    }
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · 🎰 BONUSRUNDE</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <div class="game-card" id="gameCard" style="text-align:center;">
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; margin:0 0 6px; font-size:20px;">🎰 Tør du satse?</p>
        <p class="hint" style="margin:0 0 4px; color:rgba(255,247,232,0.55);">Din score lige nu: <b style="color:var(--coin);">${myScore} point</b></p>
        ${mine ? mineHtml : `
          <p class="hint" style="margin:0 0 14px; color:rgba(255,247,232,0.7);">Vælg mellem en sikker gevinst eller en rigtig satsning — ingen kan bare springe over.</p>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="game-btn" id="casinoBetGambleBtn" style="background:linear-gradient(160deg, rgba(255,201,60,0.9), rgba(255,107,74,0.9));">🎰 Satser — vind ${CASINOBROK_BET_WIN_POINTS} eller mist ${CASINOBROK_BET_LOSE_POINTS}</button>
            <button class="game-btn ghost" id="casinoBetSafeBtn">🛡️ Sikker gevinst — +${CASINOBROK_BET_SAFE_POINTS} point, ingen risiko</button>
          </div>
        `}
      </div>
      ${gameProgressHtml(decided, g.players.length, 'har valgt')}
      ${mine ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
      ${complaintBlockHtml(g, cur)}
    `;
  }
  if(cur.phase === 'skipped'){
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 🎰 Casinobrok</div>
      <div class="empty-state"><span class="emoji">😴</span><b>Ingen nåede at skrive et ord</b>Ingen sag denne gang — vi går videre til næste spørgsmål.</div>
      ${gameReadyHtml(g, cur)}
    `;
  }
  if(cur.bets){
    const rows = state.members.filter(m=>g.players.includes(m.id)).map(m=>{
      const b = cur.bets[m.id];
      if(!b) return '';
      const label = b.choice === 'safe' ? '🛡️ Sikker gevinst' : (b.won ? '🎉 Ramte gevinsten' : '💀 Aber');
      const deltaText = b.delta > 0 ? `+${b.delta}` : `${b.delta}`;
      return `<div class="feed-item${b.delta>0?' quip-slot-win':''}" style="${b.delta>0?'border-color:var(--coin); background:rgba(255,201,60,0.16);':''}">
        <div class="avatar">${initials(m.name)}</div>
        <div class="feed-body"><div class="feed-name">${escapeHtml(m.name)}</div><div class="feed-msg">${label} · ${deltaText} point</div></div>
      </div>`;
    }).join('');
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 🎰 BONUSRUNDE — Resultat</div>
      <div class="game-card" id="gameCard">
        ${rows}
      </div>
      ${gameReadyHtml(g, cur)}
    `;
  }
  const candidates = Object.entries(cur.words||{}).map(([id,word])=>{
    const m = state.members.find(x=>x.id===id);
    return { id, name: m?m.name:'?', label: word };
  });
  const winner = candidates.find(c=>c.id===cur.winnerId);
  // Vinderen står allerede fast server-side, men må ikke AFSLØRES visuelt
  // (hverken på hjulet eller i listen herunder) FØR DENNE KLIENTS EGET spin
  // faktisk er kørt færdig (se chanceRevealedPhaseKey) — IKKE ud fra
  // vægur-tid, som ville afsløre svaret med det samme for en klient der
  // åbner/poller appen efter det planlagte fælles spin-tidspunkt allerede
  // er passeret.
  const revealed = !cur.phaseStartedAt || chanceRevealedPhaseKey === cur.phaseStartedAt;
  return `
    <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · Resultat</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
    <div class="game-card" id="gameCard" style="text-align:center;">
      ${cur.chanceVisual === 'slot'
        ? buildSlotCabinetHtml('chance', candidates, winner, '🎰 CASINOBROK TRÆKKER LOD', revealed, cur.phaseStartedAt)
        : buildWheelChanceHtml('chance', candidates, winner, '🎰 CASINOBROK TRÆKKER LOD', revealed, cur.phaseStartedAt)}
      ${candidates.map(c=>{
        const won = revealed && c.id === cur.winnerId;
        return `<div class="feed-item${won?' quip-slot-win':''}" style="${won?'border-color:var(--coin); background:rgba(255,201,60,0.16);':''}">
          <div class="avatar">${initials(c.name)}</div>
          <div class="feed-body"><div class="feed-name">${escapeHtml(c.name)} ${won?'🏆':''}</div><div class="feed-msg">"${escapeHtml(c.label)}"</div></div>
        </div>`;
      }).join('')}
    </div>
    ${gameReadyHtml(g, cur)}
  `;
}

function roseHtml(g, cur){
  const myId = profile && profile.memberId;
  if(cur.phase === 'write'){
    const targetId = cur.targets ? cur.targets[myId] : null;
    const targetMember = targetId ? state.members.find(m=>m.id===targetId) : null;
    const mine = myId && cur.compliments && cur.compliments[myId];
    const written = Object.keys(cur.compliments||{}).length;
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · 🌹 Rose</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <div class="game-card rose-card" id="gameCard">
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:0 0 6px;">🌹 Skriv en ægte ros til <span style="color:#ff8fb3;">${escapeHtml(targetMember?targetMember.name:'?')}</span></p>
        <p class="hint" style="margin:0 0 12px; color:rgba(255,247,232,0.6);">Kort og ægte — noget de er gode til, eller bare noget du sætter pris på.</p>
        <textarea id="roseInput" rows="2" maxlength="140" placeholder="Din ros..." ${mine?'disabled':''}>${mine?escapeHtml(mine):''}</textarea>
        ${mine ? '' : `<button class="game-btn rose-btn" id="roseSubmitBtn" style="margin-top:10px;">🌹 Send rosen</button>`}
      </div>
      ${gameProgressHtml(written, g.players.length, 'har skrevet')}
      ${mine ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
      ${complaintBlockHtml(g, cur)}
    `;
  }
  if(cur.phase === 'skipped'){
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 🌹 Rose</div>
      <div class="empty-state"><span class="emoji">🥀</span><b>Ingen nåede at skrive en ros</b>Ingen sag denne gang — vi går videre til næste runde.</div>
      ${gameReadyHtml(g, cur)}
    `;
  }
  if(cur.phase === 'match'){
    const authorForRecipient = {};
    Object.keys(cur.targets||{}).forEach(a=>{ authorForRecipient[cur.targets[a]] = a; });
    const recipientIds = Object.keys(authorForRecipient).sort();
    const cards = recipientIds.map(recipientId=>({ recipientId, text: (cur.compliments||{})[authorForRecipient[recipientId]] }));
    const already = myId && cur.guesses && cur.guesses[myId];
    const guessedCount = Object.keys(cur.guesses||{}).length;
    const players = state.members.filter(m=>g.players.includes(m.id));
    if(already){
      return `
        <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 🌹 Rose — Gæt</div>
        <p class="hint" style="margin:0 0 10px;">Du har afgivet dine gæt.</p>
        ${gameProgressHtml(guessedCount, g.players.length, 'har gættet')}
        <div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>
        ${complaintBlockHtml(g, cur)}
      `;
    }
    // Den ros JEG selv skrev behøver ikke nogen gætte-UI for MIG — jeg ved jo
    // allerede hvem der skrev den (mig selv). Fylder derfor ingenting og
    // tælles automatisk som "rigtig" i mit eget valg-sæt.
    const myAuthoredRecipientId = myId && cur.targets ? cur.targets[myId] : null;
    // roseMatchSelections er et GLOBALT, VEDVARENDE valg — ikke en lokal
    // variabel der nulstilles ved hvert gen-render. Før den fix her boede
    // valgene kun i en lukning inde i bindGameHandlers, så et helt
    // almindeligt poll (fx fordi en anden spiller reagerede) byggede hele
    // skærmen om fra bunden og viskede synlige valg ud, selvom man lige
    // havde trykket på alle fire — meget forvirrende ("jeg trykkede på alt,
    // og så blev det nulstillet"). Nulstilles kun ved en NY runde.
    if(roseMatchSelectionsKey !== g.round){
      roseMatchSelectionsKey = g.round;
      roseMatchSelections = {};
      if(myAuthoredRecipientId) roseMatchSelections[myAuthoredRecipientId] = myId;
    }
    const cardsHtml = cards.map(c=>{
      const recipientMember = state.members.find(m=>m.id===c.recipientId);
      if(c.recipientId === myAuthoredRecipientId){
        return `
          <div class="rose-match-card rose-match-mine" data-recipient="${c.recipientId}">
            <p class="rose-match-text">"${escapeHtml(c.text||'')}"</p>
            <p class="rose-match-to">Om: <b>${escapeHtml(recipientMember?recipientMember.name:'?')}</b> · ✓ din egen — ved du jo selv</p>
          </div>
        `;
      }
      const chosenId = roseMatchSelections[c.recipientId];
      if(chosenId){
        const chosenMember = state.members.find(m=>m.id===chosenId);
        return `
          <div class="rose-match-card rose-match-locked" data-recipient="${c.recipientId}">
            <p class="rose-match-text">"${escapeHtml(c.text||'')}"</p>
            <p class="rose-match-to">Om: <b>${escapeHtml(recipientMember?recipientMember.name:'?')}</b> · Gæt: <b>${escapeHtml(chosenMember?chosenMember.name:'?')}</b> <span class="rose-match-change" data-rose-change="${c.recipientId}">✏️ skift</span></p>
          </div>
        `;
      }
      const chips = players.map(p=>`<div class="name-pill rose-guess-chip" data-rose-recipient="${c.recipientId}" data-rose-author="${p.id}">${escapeHtml(p.name)}</div>`).join('');
      return `
        <div class="rose-match-card" data-recipient="${c.recipientId}">
          <p class="rose-match-text">"${escapeHtml(c.text||'')}"</p>
          <p class="rose-match-to">Om: <b>${escapeHtml(recipientMember?recipientMember.name:'?')}</b></p>
          <p class="hint" style="margin:6px 0 6px; font-size:12px;">Hvem skrev den?</p>
          <div class="rose-guess-chips">${chips}</div>
        </div>
      `;
    }).join('');
    const allChosen = cards.every(c => roseMatchSelections[c.recipientId] !== undefined);
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 🌹 Rose — Gæt hvem der skrev hvad</div>
      <p class="hint" style="margin:0 0 10px;">Tryk på et navn under hver ros for at gætte forfatteren.</p>
      ${cardsHtml}
      <button class="game-btn rose-btn" id="roseGuessSubmitBtn" style="margin-top:4px;" ${allChosen?'':'disabled'}>🌹 Indsend gæt</button>
      ${gameProgressHtml(guessedCount, g.players.length, 'har gættet')}
      ${complaintBlockHtml(g, cur)}
    `;
  }
  // results
  const authorForRecipient = cur.authorForRecipient || {};
  const correctCounts = cur.correctCounts || {};
  const rows = Object.keys(authorForRecipient).sort().map(recipientId=>{
    const authorId = authorForRecipient[recipientId];
    const authorMember = state.members.find(m=>m.id===authorId);
    const recipientMember = state.members.find(m=>m.id===recipientId);
    const text = (cur.compliments||{})[authorId];
    return `
      <div class="feed-item">
        <div class="avatar">${initials(authorMember?authorMember.name:'?')}</div>
        <div class="feed-body"><div class="feed-name">${escapeHtml(authorMember?authorMember.name:'?')} ➜ ${escapeHtml(recipientMember?recipientMember.name:'?')}</div><div class="feed-msg">"${escapeHtml(text||'')}"</div></div>
      </div>
    `;
  }).join('');
  const scoreRows = state.members.filter(m=>g.players.includes(m.id)).map(m=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(m.name)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(m.name)}</div></div>
      <div class="bal-amt">${correctCounts[m.id]||0} rigtige</div>
    </div>
  `).join('');
  return `
    <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 🌹 Rose — Facit</div>
    <div class="game-card rose-card" id="gameCard" style="text-align:center;">
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px; margin:0 0 10px;">🌹 Hvem sagde hvad om hvem</p>
      ${rows}
    </div>
    <div class="section-label">Dine gæt</div>
    ${scoreRows}
    ${gameReadyHtml(g, cur)}
  `;
}

function gameOverHtml(g, cur){
  const ranked = state.members.filter(m=>g.players.includes(m.id)).sort((a,b)=>(cur.scores[b.id]||0)-(cur.scores[a.id]||0));
  const losers = (cur.loserIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  const winners = (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  const rows = ranked.map((m,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(m.name)}</div></div>
      <div class="bal-amt">${cur.scores[m.id]||0} point</div>
    </div>
  `).join('');
  return `
    <div class="game-badge">🎉 Spillet er slut!</div>
    ${rows}
    ${winners.length ? `<p class="hint" style="text-align:center; margin-top:10px; color:rgba(255,247,232,0.75);">👑 Vinder: <span id="gameoverWinnerName">${winners.map(m=>escapeHtml(m.name)).join(' & ')}</span></p>` : ''}
    <div class="game-card" id="gameoverReveal" style="text-align:center; margin-top:16px;">
      <div style="font-size:34px;" id="gameoverLoserEmoji">🫵</div>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:6px 0;">Taberen er... <span id="gameoverLoserName">${losers.map(m=>escapeHtml(m.name)).join(' & ')}</span>!</p>
      ${g.wager==='euro' ? `<p class="hint" style="color:rgba(255,247,232,0.7);">1${escapeHtml(state.unit || '€')} lagt i ${escapeHtml(state.themeName || 'Brokkekassen')}s pulje.</p>` : '<p class="hint" style="color:rgba(255,247,232,0.7);">Kun for sjov denne gang.</p>'}
    </div>
    ${gameHighscoreHtml()}
    <button class="game-btn" id="playAgainBtn" style="margin-top:16px;">👉 Spil igen</button>
    <button class="game-btn ghost" id="endGameBtn">Tilbage til lobbyen</button>
  `;
}

function bindGameHandlers(g){
  const cur = g.current;
  const gameInstrToggle = document.getElementById('gameInstructionsToggle');
  if(gameInstrToggle) gameInstrToggle.onclick = ()=>{ gameInstructionsOpen = !gameInstructionsOpen; render(); };
  document.querySelectorAll('[data-wager]').forEach(el=>{
    el.onclick = ()=>{ gameWager = el.dataset.wager; render(); };
  });
  document.querySelectorAll('[data-rounds]').forEach(el=>{
    el.onclick = ()=>{ gameRounds = parseInt(el.dataset.rounds,10); render(); };
  });
  document.querySelectorAll('[data-player]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.player;
      if(gameSelectedPlayers.includes(id)) gameSelectedPlayers = gameSelectedPlayers.filter(x=>x!==id);
      else gameSelectedPlayers = [...gameSelectedPlayers, id];
      render();
    };
  });
  const startBtn = document.getElementById('startGameBtn');
  if(startBtn) startBtn.onclick = ()=> gameApi('start', { wager: gameWager, playerIds: gameSelectedPlayers, totalRounds: gameRounds });

  const readyBtn = document.getElementById('readyBtn');
  if(readyBtn) readyBtn.onclick = ()=> gameApi('ready', {});

  const complainBtn = document.getElementById('complainBtn');
  if(complainBtn) complainBtn.onclick = ()=> gameApi('complain', { payload: { targetId: complainBtn.dataset.target } });

  const playAgainBtn = document.getElementById('playAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    gameApi('end', {}).then(()=> gameApi('start', { wager: gameWager, playerIds: gameSelectedPlayers, totalRounds: gameRounds }));
  };
  const endGameBtn = document.getElementById('endGameBtn');
  if(endGameBtn) endGameBtn.onclick = ()=> gameApi('end', {});

  if(!cur) return;

  if(cur.type === 'quiplash' && cur.phase === 'answer'){
    const btn = document.getElementById('quipSubmitBtn');
    if(btn) btn.onclick = ()=>{
      const text = document.getElementById('quipInput').value.trim();
      if(!text) return;
      lockSubmitBtn(btn, 'Låser svar...');
      gameApi('submit', { payload: { text } });
    };
  }
  if(cur.type === 'quiplash' && cur.phase === 'vote'){
    document.querySelectorAll('[data-vote-for]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { votedFor: el.dataset.voteFor } });
    });
  }
  if(cur.type === 'truefalse' && cur.phase === 'write' && profile && profile.memberId === cur.authorId){
    let chosenTarget = null; // skal vælges eksplicit — ingen forudvalgt person, så man aktivt tager stilling til hvem det handler om
    let chosenTruth = null; // skal vælges eksplicit — ingen forudvalgt "sandt", så man ikke sender ved et uheld uden at tage stilling
    const input = document.getElementById('ttStatement');
    const submitBtn = document.getElementById('ttSubmitBtn');
    const updateSubmitState = ()=>{ submitBtn.disabled = !input.value.trim() || chosenTruth === null || chosenTarget === null; };
    document.querySelectorAll('#ttTargetGrid .name-pill').forEach(p=>{
      p.onclick = ()=>{
        document.querySelectorAll('#ttTargetGrid .name-pill').forEach(x=>x.classList.remove('selected'));
        p.classList.add('selected'); chosenTarget = p.dataset.target;
        updateSubmitState();
      };
    });
    document.querySelectorAll('[data-truth]').forEach(seg=>{
      seg.onclick = ()=>{
        document.querySelectorAll('[data-truth]').forEach(x=>x.classList.remove('active'));
        seg.classList.add('active'); chosenTruth = seg.dataset.truth === 'true';
        updateSubmitState();
      };
    });
    input.addEventListener('input', updateSubmitState);
    submitBtn.onclick = ()=>{
      const statement = input.value.trim();
      if(!statement || chosenTruth === null || chosenTarget === null) return;
      lockSubmitBtn(submitBtn, 'Sender...');
      gameApi('submit', { payload: { targetId: chosenTarget, statement, isTrue: chosenTruth } });
    };
  }
  if(cur.type === 'truefalse' && cur.phase === 'guess' && profile && profile.memberId !== cur.authorId){
    document.querySelectorAll('[data-guess]').forEach(btn=>{
      btn.onclick = ()=> gameApi('submit', { payload: { guess: btn.dataset.guess === 'true' } });
    });
  }
  if(cur.type === 'trivia' && cur.phase === 'answer'){
    document.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { choiceIndex: parseInt(el.dataset.choice,10) } });
    });
  }
  if(cur.type === 'guessbrok' && cur.phase === 'write' && profile && profile.memberId === cur.authorId){
    const input = document.getElementById('gbStatement');
    const submitBtn = document.getElementById('gbSubmitBtn');
    const updateSubmitState = ()=>{ submitBtn.disabled = !input.value.trim(); };
    input.addEventListener('input', updateSubmitState);
    submitBtn.onclick = ()=>{
      const statement = input.value.trim();
      if(!statement) return;
      lockSubmitBtn(submitBtn, 'Sender...');
      gameApi('submit', { payload: { statement } });
    };
  }
  if(cur.type === 'guessbrok' && cur.phase === 'guess' && profile && profile.memberId !== cur.authorId){
    document.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { choiceIndex: parseInt(el.dataset.choice,10) } });
    });
  }
  if(cur.type === 'casinobrok' && cur.phase === 'write'){
    const wordInput = document.getElementById('casinoWordInput');
    // Ét ord betyder ét ord — fjerner mellemrum mens man skriver, i stedet
    // for bare at bede pænt om det og håbe det bliver overholdt.
    if(wordInput) wordInput.addEventListener('input', ()=>{
      const stripped = wordInput.value.replace(/\s+/g, '');
      if(stripped !== wordInput.value) wordInput.value = stripped;
    });
    const btn = document.getElementById('casinoSubmitBtn');
    if(btn) btn.onclick = ()=>{
      const word = document.getElementById('casinoWordInput').value.replace(/\s+/g, '').trim();
      if(!word) return;
      lockSubmitBtn(btn, 'Sender...');
      gameApi('submit', { payload: { word } });
    };
  }
  if(cur.type === 'casinobrok' && cur.phase === 'bet'){
    const gambleBtn = document.getElementById('casinoBetGambleBtn');
    const safeBtn = document.getElementById('casinoBetSafeBtn');
    if(gambleBtn) gambleBtn.onclick = ()=>{
      lockSubmitBtn(gambleBtn, 'Satser...');
      if(safeBtn) safeBtn.disabled = true;
      gameApi('submit', { payload: { choice: 'gamble' } });
    };
    if(safeBtn) safeBtn.onclick = ()=>{
      lockSubmitBtn(safeBtn, 'Tager den sikre...');
      if(gambleBtn) gambleBtn.disabled = true;
      gameApi('submit', { payload: { choice: 'safe' } });
    };
  }
  if(cur.type === 'rose' && cur.phase === 'write'){
    const input = document.getElementById('roseInput');
    const submitBtn = document.getElementById('roseSubmitBtn');
    if(submitBtn) submitBtn.onclick = ()=>{
      const text = input.value.trim();
      if(!text) return;
      lockSubmitBtn(submitBtn, 'Sender...');
      gameApi('submit', { payload: { compliment: text } });
    };
  }
  if(cur.type === 'rose' && cur.phase === 'match'){
    const myId = profile && profile.memberId;
    const already = myId && cur.guesses && cur.guesses[myId];
    if(!already){
      // Gættene lever i roseMatchSelections (global, se roseHtml) i stedet
      // for en lokal variabel her — ellers overlever de ikke det næste
      // almindelige poll-gen-render. Et klik gen-tegner HELE skærmen (samme
      // mønster som fx mrbrokInstructionsOpen), så det valgte kort straks
      // klapper sammen til den dæmpede, låste visning.
      const cards = document.querySelectorAll('.rose-match-card');
      document.querySelectorAll('.rose-guess-chip').forEach(chip=>{
        chip.onclick = ()=>{
          roseMatchSelections[chip.dataset.roseRecipient] = chip.dataset.roseAuthor;
          render();
        };
      });
      document.querySelectorAll('[data-rose-change]').forEach(btn=>{
        btn.onclick = ()=>{
          delete roseMatchSelections[btn.dataset.roseChange];
          render();
        };
      });
      const submitBtn = document.getElementById('roseGuessSubmitBtn');
      if(submitBtn) submitBtn.onclick = ()=>{
        if(Object.keys(roseMatchSelections).length < cards.length) return;
        lockSubmitBtn(submitBtn, 'Sender...');
        gameApi('submit', { payload: { guesses: roseMatchSelections } });
      };
    }
  }
}

// Nedtælling pr. fase — samme nødbremse-filosofi som Brokspillet: ingen kan
// blokere resten af rummet ved bare at sidde stille.
// Ingen hård klient-nedtælling der selv tvinger videre længere — samme
// filosofi som Brokspillet (se getPendingIdsClient/complaintBlockHtml):
// kun et synligt brok (menneske eller "MrBrok selv" efter lang stilhed)
// og en udløbet nedtælling kan rykke fasen videre, aldrig en klients eget ur.
function getPendingMrbrokIdsClient(m, cur){
  if(!cur || !m.activeIds) return [];
  if(cur.type === 'clue') return [cur.speakerId];
  if(cur.type === 'vote') return m.activeIds.filter(id=>!(cur.votes && cur.votes[id] !== undefined));
  if(cur.type === 'steal' && !cur.guess) return [m.mrBrokId];
  if(cur.type === 'steal' && cur.guess) return m.activeIds.filter(id=>!(cur.votes && cur.votes[id] !== undefined));
  return [];
}

// Under clue-fasen er det ALTID kun taleren selv der er "pending", så et
// navngivet brok her ("X bruger sin tid") gør reelt tøven til et objektivt,
// app-godkendt "denne person var målbart langsom" — som falder direkte
// sammen med at være MrBrok (den eneste der reelt skal FINDE PÅ noget,
// ikke bare huske det). Det giver et gratis, kvantificeret praj de andre
// runde-typer ikke har (der er "langsom" ikke ensbetydende med at bluffe).
// Holder derfor clue-fasens brok anonymt — hvem der har turen er allerede
// synligt via turrækkefølgen, men selve "tempo er nu officielt mistænkeligt"
// -stemplet skal IKKE komme fra appen.
function mrbrokComplaintBlockHtml(m, cur){
  if(!cur || !profile) return '';
  const pending = getPendingMrbrokIdsClient(m, cur);
  if(!pending.length) return '';
  const myId = profile.memberId;
  const anonymize = cur.type === 'clue';
  if(cur.complaint){
    // "MrBrok" er allerede navnet på den hemmelige rolle i DETTE spil — at
    // bruge samme navn til den automatiske nedtælling (som i Brokspillet
    // hedder "Brokspillet") ville læse som om selve rollen "brokker sig",
    // hvilket er forvirrende/lyder som et hint. Kaldes derfor "Spillet" her.
    const byName = cur.complaint.by === 'brokspillet' ? 'Spillet' : ((state.members.find(mm=>mm.id===cur.complaint.by)||{}).name || 'Nogen');
    const targetName = (state.members.find(mm=>mm.id===cur.complaint.targetId)||{}).name || 'nogen';
    const line = anonymize
      ? `${cur.complaint.by === 'brokspillet' ? '🎙️' : '🐌'} Turen bruger lang tid`
      : `${cur.complaint.by === 'brokspillet' ? '🎙️' : '🐌'} <b>${escapeHtml(byName)}</b> brokker sig over at <b>${escapeHtml(targetName)}</b> bruger sin tid`;
    return `
      <div class="complaint-banner">
        <span>${line}</span>
        <span id="complaintCountdown" class="complaint-countdown"></span>
      </div>
    `;
  }
  if(pending.includes(myId)) return ''; // man skal selv være færdig for at kunne brokke sig
  const age = cur.phaseStartedAt ? (Date.now() - cur.phaseStartedAt) : 0;
  if(age < MIN_COMPLAIN_AGE_MS) return '';
  const growth = Math.min(1, (age - MIN_COMPLAIN_AGE_MS) / 30000);
  const targetName = !anonymize && pending.length === 1 ? (state.members.find(mm=>mm.id===pending[0])||{}).name : null;
  const label = targetName ? `🐌 Brok over ${escapeHtml(targetName)}s tempo` : `🐌 Brok over ventetiden`;
  return `<button class="complain-btn" id="complainBtn" data-target="${pending[0]}" style="transform:scale(${(1+growth*0.16).toFixed(2)}); opacity:${(0.6+growth*0.4).toFixed(2)};">${label}</button>`;
}

function renderMrbrokScreen(){
  const m = state.mrbrok || { active:false };
  app.innerHTML = `
    <header class="theme-mrbrok">
      <div class="title" style="font-size:30px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>Mr<span>Brok</span> 🕵️</span>
        <button id="btnAppMenu" title="Menu" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; font-size:16px; background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); color:rgba(255,247,232,0.85); border-radius:100px; flex:0 0 auto;">☰</button>
      </div>
    </header>
    <main id="main" style="padding:0 16px 40px;">${mrbrokBodyHtml(m)}</main>
  `;
  document.getElementById('btnAppMenu').onclick = openAppMenuSheet;
  bindMrbrokHandlers(m);
  const card = document.getElementById('mrbrokCard') || document.getElementById('mrbrokReveal');
  // Samme fix som Brokspillet: kun animér ved et RIGTIGT fase/tur-skift,
  // ikke ved hvert stille poll — ellers flimrer kortet ved hver eneste
  // andens reaktion. turnIndex er med i nøglen, så hver enkelt tur (ikke
  // kun hver runde) tæller som et nyt "løft".
  const cur = m.active ? m.current : null;
  const mrbrokAnimKey = cur ? (m.round + ':' + cur.type + ':' + (cur.turnIndex !== undefined ? cur.turnIndex : '')) : 'lobby';
  const isNewMrbrokPhase = mrbrokAnimKey !== lastAnimatedMrbrokKey;
  lastAnimatedMrbrokKey = mrbrokAnimKey;
  if(isNewMrbrokPhase) mrbrokTipText = null; // nyt hint kun ved en ny tur, ikke midt i ens egen
  if(card && typeof gsap !== 'undefined' && isNewMrbrokPhase){
    // Et "løft" snarere end et almindeligt fade-ind — lidt længere
    // opad-bevægelse og en blødere overshoot-easing, så det føles som at
    // ordet gives videre til den næste, ikke bare endnu et kort der popper op.
    gsap.fromTo(card, { opacity:0, y:22, scale:.96 }, { opacity:1, y:0, scale:1, duration:.5, ease:'back.out(1.4)' });
  }
  const complaintKey = cur && cur.complaint ? (mrbrokAnimKey + ':' + cur.complaint.startedAt) : null;
  if(complaintKey !== lastComplaintKeyMrbrok){
    lastComplaintKeyMrbrok = complaintKey;
    startComplaintCountdown(cur, true);
  }
  maybeShowMrbrokRoleSplash(m);
  maybeShowMrbrokEliminationReveal(m);
  maybeShowMrbrokVoteStartSplash(m);
}

function mrbrokBodyHtml(m){
  if(!m.active || !m.current) return mrbrokLobbyHtml();
  const cur = m.current;
  // MrBrok selv bliver også lagt i eliminatedIds i det øjeblik de bliver
  // afsløret (for at forlade activeIds/tur-rækkefølgen) — men de har stadig
  // en aktiv rolle i selve tyveri-fasen (deres sidste gæt på emnet), så de
  // skal IKKE regnes som "kigger med" mens den fase står på.
  // m.mrBrokId er redigeret væk af redactStateFor (kun m.youAreMrBrok findes
  // client-side, se _lib/store.js) — profile.memberId === m.mrBrokId var
  // derfor ALTID falsk her, hvilket fik den fangede MrBrok til fejlagtigt at
  // blive vist tilskuer-skærmen ("Du blev stemt ud") i stedet for selve
  // tyveri-gættet i steal-fasen. Den reelle, alvorlige konsekvens af buggen:
  // MrBrok fik aldrig chancen til at gætte emnet og stjæle sejren.
  const isCaughtMrBrokInSteal = cur.type === 'steal' && m.youAreMrBrok;
  const isEliminated = profile && !isCaughtMrBrokInSteal && (m.eliminatedIds||[]).some(e=>e.id===profile.memberId);
  if(cur.type !== 'gameover' && profile && m.players && (!m.players.includes(profile.memberId) || isEliminated)){
    return `
      <div class="game-badge">Runde ${m.round} · 👀 Du kigger med</div>
      <div class="empty-state"><span class="emoji">🍿</span><b>${isEliminated ? 'Du blev stemt ud' : 'Du er ikke med i denne omgang'}</b>${isEliminated ? 'De andre spiller videre uden dig — se med til det hele afsløres.' : 'De andre spiller videre — du er velkommen næste spil.'}</div>
    `;
  }
  if(cur.type === 'gameover') return mrbrokOverHtml(m, cur);
  if(cur.type === 'clue') return mrbrokClueHtml(m, cur);
  if(cur.type === 'vote') return mrbrokVoteHtml(m, cur);
  if(cur.type === 'steal') return mrbrokStealHtml(m, cur);
  return '';
}

function mrbrokHighscoreHtml(){
  const stats = state.mrbrokStats || {};
  const ranked = state.members
    .filter(mm => !mm.isBot && stats[mm.id] && stats[mm.id].played > 0)
    .sort((a,b) => (stats[b.id].wins - stats[a.id].wins) || (stats[b.id].played - stats[a.id].played));
  if(!ranked.length) return '';
  const rows = ranked.map((mm,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(mm.name)}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${stats[mm.id].played} spillet</div></div>
      <div class="bal-amt">${stats[mm.id].wins} sejre</div>
    </div>
  `).join('');
  return `<div class="section-label">🏆 Highscore</div>${rows}`;
}

// Ét skærmbillede pr. NYT MrBrok-spil (ikke pr. runde — det ville blive
// trættende hurtigt), i to trin: (1) en "skjul skærmen"-advarsel med en
// 3-2-1 nedtælling, så man ikke bare glider forbi hinandens skærme og ser
// rollen ved et uheld i det sekund den popper op, og (2) selve
// afsløringen + konkrete strategi-tips, forskellige for MrBrok selv vs.
// de rigtige rollehavere. Kører kun ved allerførste tur af spillet,
// styret af mrbrokRoleSplashShownFor holdt op mod m.startedAt.
function maybeShowMrbrokRoleSplash(m){
  if(!m || !m.active || !m.current) return;
  if(m.current.type !== 'clue' || m.round !== 1 || m.current.turnIndex !== 0) return;
  if(mrbrokRoleSplashShownFor === m.startedAt) return;
  mrbrokRoleSplashShownFor = m.startedAt;

  const backdropHtml = `<div class="mrbrok-splash-backdrop" id="mrbrokSplashBackdrop"><div class="mrbrok-splash" id="mrbrokSplashInner"></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('mrbrokSplashBackdrop');
  const inner = document.getElementById('mrbrokSplashInner');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });

  inner.innerHTML = `
    <div style="font-size:52px;">🙈</div>
    <h3 style="margin-bottom:10px;">Skjul skærmen for de andre!</h3>
    <p style="font-size:17px; line-height:1.5; color:rgba(255,247,232,0.85); font-weight:600;">Om lidt afslører vi din rolle — kun dig.</p>
    <div id="mrbrokSplashCountdown" style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:64px; color:var(--coin); margin-top:22px;">3</div>
  `;
  let n = 3;
  const tick = setInterval(()=>{
    n--;
    const el = document.getElementById('mrbrokSplashCountdown');
    if(!el){ clearInterval(tick); return; }
    if(n > 0){ el.textContent = String(n); }
    else{
      clearInterval(tick);
      showMrbrokRoleReveal(m, inner, close);
    }
  }, 850);
}

// Hvis den stemte-ud person IKKE var MrBrok, gik spillet hidtil bare
// stiltiende videre til næste clue-runde uden nogen reelt fik at vide
// hvad der skete — ingen bekræftelse på om gættet var rigtigt, hvilket er
// kernefeedback i den slags spil. Bruger SAMME mørke/guld afslørings-stil
// som rolle-splashen for genkendelighed. Afslører ALDRIG hvem MrBrok er
// her — kun at DEN stemte-ud person ikke var det (sikkert at vise, fordi
// vi kun når hertil når cur.type stadig er 'clue', dvs. spillet fortsætter
// — var det MrBrok, ville cur.type være 'steal' i stedet, se resolveVote).
function maybeShowMrbrokEliminationReveal(m){
  if(!m || !m.active || !m.current || m.current.type !== 'clue') return;
  const key = m.startedAt;
  if(mrbrokEliminationShownFor !== key) mrbrokEliminationShownCount = 0;
  mrbrokEliminationShownFor = key;
  const eliminated = m.eliminatedIds || [];
  if(eliminated.length <= mrbrokEliminationShownCount) return;
  const entry = eliminated[eliminated.length - 1];
  mrbrokEliminationShownCount = eliminated.length;
  if(!entry) return;
  const person = state.members.find(mm=>mm.id===entry.id);
  const backdropHtml = `<div class="mrbrok-splash-backdrop" id="mrbrokEliminationBackdrop"><div class="mrbrok-splash" id="mrbrokEliminationInner"></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('mrbrokEliminationBackdrop');
  const inner = document.getElementById('mrbrokEliminationInner');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });
  inner.innerHTML = `
    <div style="font-size:52px;">🗳️</div>
    <h3 style="margin-bottom:10px;">Stemmerne er talt op...</h3>
    <div id="mrbrokElimCountdown" style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:64px; color:var(--coin); margin-top:14px;">3</div>
  `;
  let n = 3;
  const tick = setInterval(()=>{
    n--;
    const el = document.getElementById('mrbrokElimCountdown');
    if(!el){ clearInterval(tick); return; }
    if(n > 0){ el.textContent = String(n); }
    else{
      clearInterval(tick);
      inner.innerHTML = `
        <div style="font-size:44px;">😅</div>
        <h3>${escapeHtml(person?person.name:'?')} blev stemt ud</h3>
        <p style="font-size:17px; color:rgba(255,247,232,0.8); margin:-14px 0 24px; font-weight:600;">...men det var ikke MrBrok. Spillet fortsætter.</p>
        <button class="game-btn" id="mrbrokElimCloseBtn" style="margin-top:6px;">Videre</button>
      `;
      if(typeof gsap !== 'undefined') gsap.fromTo(inner, {opacity:0, scale:.95}, {opacity:1, scale:1, duration:.35, ease:'back.out(1.6)'});
      document.getElementById('mrbrokElimCloseBtn').onclick = close;
    }
  }, 850);
}

// Hver ENKELT afstemning (ikke kun den første) er et suspense-øjeblik —
// en 3-2-1 optakt før stemme-knapperne overhovedet vises, samme
// dramatiske mønster som rolle-afsløringen. Nøglen er m.startedAt+round,
// så samme runde ikke viser den to gange ved almindelige polls.
function maybeShowMrbrokVoteStartSplash(m){
  if(!m || !m.active || !m.current || m.current.type !== 'vote') return;
  const key = m.startedAt + ':' + m.current.round;
  if(mrbrokVoteStartSplashShownFor === key) return;
  mrbrokVoteStartSplashShownFor = key;
  const isFirst = m.current.round <= m.warmupRounds + 1;
  const backdropHtml = `<div class="mrbrok-splash-backdrop" id="mrbrokVoteStartBackdrop"><div class="mrbrok-splash" id="mrbrokVoteStartInner"></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('mrbrokVoteStartBackdrop');
  const inner = document.getElementById('mrbrokVoteStartInner');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });
  inner.innerHTML = `
    <div style="font-size:52px;">🚨</div>
    <h3>${isFirst ? 'Nu bliver det alvor!' : 'Afstemning igen!'}</h3>
    <p style="font-size:17px; color:rgba(255,247,232,0.85); margin:-14px 0 22px; font-weight:600;">Hvem tror I er MrBrok?</p>
    <div id="mrbrokVoteStartCountdown" style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:64px; color:var(--coin);">3</div>
  `;
  if(typeof gsap !== 'undefined') gsap.fromTo(inner, {opacity:0, scale:.95}, {opacity:1, scale:1, duration:.35, ease:'back.out(1.6)'});
  let n = 3;
  const tick = setInterval(()=>{
    n--;
    const el = document.getElementById('mrbrokVoteStartCountdown');
    if(!el){ clearInterval(tick); return; }
    if(n > 0){ el.textContent = String(n); }
    else{
      clearInterval(tick);
      close();
    }
  }, 850);
}

    mrbrokRoleRevealedRound = m.round;
    mrbrokRoleRevealed = false;
    if(mrbrokRoleHideTimer){ clearTimeout(mrbrokRoleHideTimer); mrbrokRoleHideTimer = null; }
  }
  if(!mrbrokRoleRevealed){
    return `<div class="game-card mrbrok-role-hidden" id="mrbrokRoleToggle" style="text-align:center; cursor:pointer;">
      <div style="font-size:26px;">🔒</div>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; margin:4px 0 0;">Tryk for at se din rolle</p>
      <p class="hint" style="color:rgba(255,247,232,0.55);">Skjult som standard — nogen kunne jo kigge med på telefonen</p>
    </div>`;
  }

      <div style="font-size:26px;">🕵️</div>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; margin:4px 0 0;">Du er MrBrok!</p>
      <p class="hint" style="color:rgba(255,247,232,0.7);">Du kender IKKE rollen de andre har — <b style="color:rgba(255,247,232,0.92);">læg dig op ad deres tone og svar</b> for ikke at blive afsløret.</p>
      <p class="hint" style="margin-top:10px; color:rgba(255,247,232,0.4); font-size:11.5px;">Tryk for at skjule igen</p>

function mrbrokLobbyHtml(){
  // Samme fix som Brokspillet: bot-testspillere skal aldrig være en
  // mulighed i den normale spillerliste, kun i selve bot-testspillet.
  const realMembers = state.members.filter(mm=>!mm.isBot);
  const allIds = realMembers.map(mm=>mm.id);
  if(!mrbrokSelectedPlayers || !mrbrokKnownMemberIds){
    mrbrokSelectedPlayers = allIds.slice();
  }else{
    const newcomers = allIds.filter(id=>!mrbrokKnownMemberIds.includes(id));
    // Samme fix som Brokspillet: fjern ID'er på medlemmer der ikke længere
    // er i rummet, så "Start MrBrok (X spillere)"-knappen matcher hvad der
    // faktisk kan startes med, i stedet for at tælle spøgelses-medlemmer med.
    mrbrokSelectedPlayers = [...mrbrokSelectedPlayers.filter(id=>allIds.includes(id)), ...newcomers];
  }
  mrbrokKnownMemberIds = allIds.slice();
  const chips = realMembers.map(mm=>{
    const on = mrbrokSelectedPlayers.includes(mm.id);
    return `<div class="name-pill ${on?'selected':''}" data-mrbrok-player="${mm.id}" style="${on?'':'opacity:.5;'}">${on?'✅':'➖'} ${escapeHtml(mm.name)}</div>`;
  }).join('');
  const enough = mrbrokSelectedPlayers.length >= 3;
  const steps = [
    ['🎯', '<b>Målet:</b> afslør MrBrok — uden selv at afsløre rollen så tydeligt at MrBrok kan snige sig med'],
    ['🎭', 'Alle undtagen én får <b>den samme rolle</b> med et bredt brok-domæne — fx "sur stewardesse, besværlige passagerer"'],
    ['🎉', 'Runde 2 er en <b>imitations-runde</b> — brok dig som karakteren ville, ingen kan blive fanget i noget endnu'],
    ['🗣️', 'Fra runde 2: de andre spørger dig om rollen — <b>svar vagt nok til ikke at hjælpe MrBrok, men klart nok til at de andre tror på dig</b>'],
    ['🕵️', 'MrBrok kender ikke rollen — skal <b>lægge sig op ad de andres tone og svar</b> for ikke at blive afsløret'],
    ['🤔', 'Efter et par nysgerrige runder begynder I at <b>stemme hemmeligt</b> — den mest mistænkelige ryger ud'],
    ['🍿', 'Stemt ud? Så kigger du med resten af spillet'],
    ['🎯', 'Fanges MrBrok, får de <b>ét sidste gæt</b> på rollen for at stjæle sejren alligevel'],
  ];
  // Foldes automatisk ud første gang nogen ser lobbyen på denne enhed, og
  // sammen alle gange efter — så det ikke bare bliver fyld man scroller
  // forbi hver eneste gang man skal i gang med et nyt spil.
  if(mrbrokInstructionsOpen === null) mrbrokInstructionsOpen = !localStorage.getItem('bk_mrbrok_seen_instructions');
  localStorage.setItem('bk_mrbrok_seen_instructions', '1');
  return `
    <div class="empty-state" style="padding-top:18px; padding-bottom:10px;">
      <span class="emoji">🕵️</span>
      <b>MrBrok</b>
      Find ud af hvem der bluffer — inden de gennemskuer jer.
    </div>
    <div class="game-card" style="margin:10px 0 10px;">
      <div id="mrbrokInstructionsToggle" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer; ${mrbrokInstructionsOpen?'margin-bottom:8px;':''}">
        <label class="field-label" style="color:rgba(255,247,232,0.7); margin:0;">Sådan foregår det</label>
        <span style="color:rgba(255,247,232,0.5); font-size:13px; transition:transform .2s; display:inline-block; ${mrbrokInstructionsOpen?'transform:rotate(180deg);':''}">⌄</span>
      </div>
      ${mrbrokInstructionsOpen ? steps.map(([icon,text])=>`
        <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:9px;">
          <span style="font-size:16px; line-height:1.4;">${icon}</span>
          <p style="margin:0; font-size:13px; line-height:1.4; color:rgba(255,247,232,0.8);">${text}</p>
        </div>
      `).join('') : ''}
    </div>
    <div class="game-card" style="margin:10px 0;">
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Hvem er med? (mindst 3)</label>
      <div class="name-grid" id="mrbrokPlayerGrid">${chips}</div>
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Spil om</label>
      <div class="segmented" style="margin-bottom:14px;">
        <div class="seg ${mrbrokWager!=='euro'?'active':''}" data-mrbrok-wager="fun">🏅 Æren</div>
        <div class="seg ${mrbrokWager==='euro'?'active':''}" data-mrbrok-wager="euro">💶 1 euro i kassen</div>
      </div>
      <label class="field-label" style="color:rgba(255,247,232,0.7); display:flex; align-items:center; justify-content:space-between;"><span>Runder før første afstemning</span><span style="opacity:.7; font-weight:400; text-transform:none; letter-spacing:normal;">mere tid til at snuse rundt</span></label>
      ${(()=>{
        const minWarmup = mrbrokMinWarmup(mrbrokSelectedPlayers.length);
        if(mrbrokWarmup < minWarmup) mrbrokWarmup = minWarmup;
        // Gulvet (minWarmup) kan i store grupper overstige det normale 2-3
        // udvalg — vis da bare gulvet som eneste (låste) valg i stedet for
        // at filtrere alt væk til en tom liste.
        const options = minWarmup > 3 ? [minWarmup] : [2,3].filter(n => n >= minWarmup);
        return `<div class="segmented" style="margin-bottom:0;">
          ${options.map(n=>`<div class="seg ${mrbrokWarmup===n?'active':''}" data-mrbrok-warmup="${n}">${n}</div>`).join('')}

        <p class="hint" style="margin:6px 0 0; color:rgba(255,247,232,0.55);">3 giver et spil på ca. 12-16 minutter for en typisk gruppe.${minWarmup > 2 ? ` Løftet op til mindst ${minWarmup} pga. antal spillere — ellers fylder udstemning mere end selve spillet.` : ''}</p>`;

    ${mrbrokHighscoreHtml()}
  `;
}

// Kompakt visning af tur-rækkefølgen for DENNE runde — hvem har allerede
// sagt sin clue, hvem har ordet nu, og hvem er der tilbage. Ren kontekst,
// ingen klik/handling herfra.
// Samme name-pill som resten af appen bruger (fx target-vælgeren i
// Brokspillets sandt/falsk) — ikke en særskilt mindre chip-stil kun for
// MrBrok. Kun den der har turen nu fremhæves, med MrBrok's egen guld/
// coin-farve, ikke en tilfældig anden accentfarve.
function mrbrokTurnOrderHtml(m, cur){
  const chips = cur.order.map((id,i)=>{
    const mm = state.members.find(x=>x.id===id);
    const isDone = i < cur.turnIndex, isCurrent = i === cur.turnIndex;
    const style = isCurrent
      ? 'background:var(--coin); border-color:var(--coin); color:var(--noir);'
      : (isDone ? 'opacity:.45; text-decoration:line-through;' : 'opacity:.75;');
    return `<div class="name-pill mrbrok-turn-pill" style="${style}">${isDone?'✓ ':''}${escapeHtml(mm?mm.name:'?')}</div>`;
  }).join('');
  // Egen grid i stedet for det delte .name-grid's flex-wrap — med varierende
  // navnelængder gav flex-wrap uforudsigelige rækker (fx 2 på første række,
  // så 1 hver på de næste), i stedet for et pænt, forudsigeligt gitter med
  // lige store knapper.
  return `<div class="mrbrok-turn-grid" style="margin-bottom:14px;">${chips}</div>`;
}

// Hvilke runder (blandt de "rolige" runder før afstemning) er
// imitations-runder? Runde 1 holdes bevidst som en RIGTIG Q&A-runde nu
// (folk har intet at gå ud fra endnu ved runde 2, så en imitation her
// fungerer bedre efter man allerede har hørt et par svar/detaljer). Runde
// 2 er altid imitation. Ved længere spil (4+ rolige runder i alt) får man
// OGSÅ en imitations-runde som en finale-runde lige inden alvoren for
// afstemningen begynder — fx 5 rolige runder ud af giver imitation ved 2
// og 5, matcher samme "kan ikke blive fanget i noget endnu" logik begge
// steder siden afstemning stadig ikke er startet.
function mrbrokImitationRounds(totalPreVoteRounds){
  const set = new Set();
  set.add(totalPreVoteRounds >= 2 ? 2 : 1);
  if(totalPreVoteRounds >= 4) set.add(totalPreVoteRounds);
  return set;
}

function mrbrokClueHtml(m, cur){
  const speaker = state.members.find(mm=>mm.id===cur.speakerId);
  const isSpeaker = profile && profile.memberId === cur.speakerId;
  const turnNo = cur.turnIndex + 1, totalTurns = cur.order.length;
  const isImitationRound = mrbrokImitationRounds(m.warmupRounds + 1).has(cur.round);
  const roundLabel = isImitationRound ? ' · 🎭 imitations-runde' : (cur.round <= m.warmupRounds + 1 ? ' · nysgerrig runde' : '');
  const badge = `<div class="game-badge">Runde ${m.round} · Tur ${turnNo}/${totalTurns}${roundLabel}</div>`;

  if(isSpeaker){
    const prompt = isImitationRound
      ? '<b style="color:rgba(255,247,232,0.95);">Brok dig som din karakter ville gøre</b> — ingen spørgsmål denne runde, bare vis os hvem du er. Overdriv gerne, ingen kan blive fanget i noget endnu.'
      : 'De andre spørger dig om rollen — svar HØJT, <b style="color:rgba(255,247,232,0.95);">vagt nok til ikke at hjælpe MrBrok, men klart nok til at de andre tror på dig</b>.';
    return `
      ${badge}
      ${mrbrokTopicBanner(m)}
      ${mrbrokTurnOrderHtml(m, cur)}
      <div class="game-card" id="mrbrokCard" style="text-align:center; border-color:rgba(255,201,60,0.5); background:rgba(255,201,60,0.08);">
        <div style="font-size:26px;">${isImitationRound ? '🎭' : '🎯'}</div>
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:4px 0 6px;">Din tur!</p>
        <p class="hint" style="color:rgba(255,247,232,0.75); margin:0 0 16px;">${prompt}</p>
        <button class="game-btn" id="mrbrokDoneBtn">✅ Færdig, min tur er ovre</button>
        <button class="game-btn ghost" id="mrbrokTipBtn" style="margin-top:10px;">💡 Brug for et hint${isImitationRound?'':' til et svar'}?</button>
        ${mrbrokTipText ? `<p class="hint" style="margin:10px 0 0; color:rgba(255,201,60,0.9); font-weight:600;">${escapeHtml(mrbrokTipText)}</p>` : ''}
      </div>
    `;
  }
  // Man skal kunne se på afstand/uden at læse hvem der taler lige nu — så
  // navnet står stort, ikke gemt inde i en almindelig lille status-tekst.
  return `
    ${badge}
    <div class="mrbrok-dim">
      ${mrbrokTopicBanner(m)}
      ${mrbrokTurnOrderHtml(m, cur)}
      <div class="empty-state" style="padding:30px 20px;">
        <span class="emoji">${isImitationRound ? '🎭' : '👂'}</span>
        <b style="font-size:26px;">${escapeHtml(speaker?speaker.name:'?')}</b>
        ${isImitationRound ? 'performer deres rolle' : 'har turen — stil dem et spørgsmål om rollen'}
      </div>
      ${!isImitationRound ? `<p class="hint" style="text-align:center; margin:-14px 0 0; color:rgba(255,247,232,0.5);">💬 Fx: "${escapeHtml(MRBROK_QUESTION_EXAMPLES[(cur.round + cur.turnIndex) % MRBROK_QUESTION_EXAMPLES.length])}"</p>` : ''}
    </div>
    ${mrbrokComplaintBlockHtml(m, cur)}
  `;
}

// MrBrok stemmer OGSÅ med her (for ikke at stikke ud) — bare ikke på sig
// selv, ligesom alle andre — så der er ingen særskilt "youAreMrBrok"-gren
// længere; alle aktive spillere (MrBrok inklusiv) ser nøjagtig samme skærm.
function mrbrokVoteHtml(m, cur){
  const badge = `<div class="game-badge">Runde ${m.round} · 🤔 Hvem er MrBrok?</div>`;
  const eligible = m.activeIds.length;
  const already = profile && cur.votes && cur.votes[profile.memberId] !== undefined;
  if(already){
    return `${badge}<div class="empty-state"><span class="emoji">🤫</span><b>Din stemme er registreret</b>Ingen facit endnu — det kommer først når nogen bliver stemt ud.</div>${gameProgressHtml(cur.voteCount||0, eligible, 'har stemt')}${mrbrokComplaintBlockHtml(m, cur)}`;
  }
  return `
    ${badge}
    <p class="hint" style="text-align:center; margin:0 0 8px; color:rgba(255,247,232,0.7);"><b style="color:rgba(255,247,232,0.92);">Hvem tror du er MrBrok?</b> Den med flest stemmer ryger ud. Din stemme er hemmelig indtil alle har stemt.</p>
    ${mrbrokVoteOptionsHtml(m, cur)}
    ${gameProgressHtml(cur.voteCount||0, eligible, 'har stemt')}
    ${mrbrokComplaintBlockHtml(m, cur)}
  `;
}

function mrbrokVoteOptionsHtml(m, cur){
  const options = state.members.filter(mm=>m.activeIds.includes(mm.id) && mm.id !== profile.memberId);
  return options.map(mm=>`
    <div class="bal-row game-pick" data-mrbrok-vote="${mm.id}" style="cursor:pointer;">
      <div class="avatar">${initials(mm.name)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(mm.name)}</div></div>
    </div>
  `).join('');
}

function mrbrokStealHtml(m, cur){
  const mrbrokMember = state.members.find(mm=>mm.id===m.mrBrokId);
  const badge = `<div class="game-badge">🕵️ MrBrok er afsløret!</div>`;
  const eligible = m.activeIds.length; // MrBrok er allerede fjernet fra activeIds på dette tidspunkt
  if(m.youAreMrBrok){
    if(!cur.guess){
      return `
        ${badge}
        <div class="game-card" id="mrbrokCard">
          <p class="hint" style="margin:0 0 8px; color:rgba(255,247,232,0.7);">Sidste chance: gæt hvad emnet var for at stjæle sejren alligevel.</p>
          <textarea id="mrbrokStealInput" rows="2" maxlength="140" placeholder="Dit gæt på emnet..."></textarea>
          <button class="game-btn" id="mrbrokStealBtn" style="margin-top:10px;">🎯 Send gæt</button>
        </div>
      `;
    }
    return `${badge}<div class="empty-state"><span class="emoji">🤞</span><b>Dit gæt er sendt</b>De andre stemmer nu om det er tæt nok.</div>${gameProgressHtml(cur.voteCount||0, eligible, 'har stemt')}`;
  }
  if(!cur.guess){
    return `${badge}<div class="empty-state"><span class="emoji">⏳</span><b>${escapeHtml(mrbrokMember?mrbrokMember.name:'MrBrok')} tænker...</b>Vent på deres sidste gæt på emnet.</div>${mrbrokComplaintBlockHtml(m, cur)}`;
  }
  const already = profile && profile.memberId in (cur.votes||{});
  if(already){
    return `${badge}<div class="empty-state"><span class="emoji">🤫</span><b>Din stemme er registreret</b>Vent på de andre.</div>${gameProgressHtml(cur.voteCount||0, eligible, 'har stemt')}`;
  }
  return `
    ${badge}
    <div class="game-card" id="mrbrokCard" style="text-align:center;">
      <p class="hint" style="margin:0 0 6px; color:rgba(255,247,232,0.6);">${escapeHtml(mrbrokMember?mrbrokMember.name:'MrBrok')} gættede emnet var:</p>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px;">"${escapeHtml(cur.guess)}"</p>
      <p class="hint" style="margin:10px 0; color:rgba(255,247,232,0.6);">Var det tæt nok? Husk at være fair — det er kun sjovt hvis dommen er ærlig.</p>
      <div style="display:flex; gap:10px;">
        <button class="game-btn" data-mrbrok-steal-vote="true" style="margin-top:0; background:linear-gradient(160deg, var(--sea), var(--sea-deep)); box-shadow:0 8px 18px rgba(11,58,63,0.4);">✅ Tæt nok</button>
        <button class="game-btn" data-mrbrok-steal-vote="false" style="margin-top:0;">❌ Ikke tæt nok</button>
      </div>
    </div>
    ${gameProgressHtml(cur.voteCount||0, eligible, 'har stemt')}
    ${mrbrokComplaintBlockHtml(m, cur)}
  `;
}

// Den vigtigste linje pr. runde er HVEM der røg ud og om det var MrBrok —
// det skal man kunne se med det samme. Hvem-stemte-på-hvem er nyttig
// nysgerrighed, ikke hovedpointen, så det er nu skjult bag et tryk i
// stedet for at fylde lige så meget som selve resultatet i hver eneste
// runde-boks.
function mrbrokRecapHtml(m, cur){
  if(!cur.voteHistory || !cur.voteHistory.length) return '';
  const rows = cur.voteHistory.map((h,i)=>{
    const eliminated = state.members.find(mm=>mm.id===h.eliminatedId);
    const wasMrBrok = h.eliminatedId === cur.mrBrokId;
    const isOpen = mrbrokRecapOpenRounds.has(i);
    const votes = Object.entries(h.votes||{}).map(([voterId,votedForId])=>{
      const voter = state.members.find(mm=>mm.id===voterId);
      const votedFor = state.members.find(mm=>mm.id===votedForId);
      const right = votedForId === cur.mrBrokId;
      return `<span style="display:inline-block; margin:2px 6px 2px 0; padding:3px 9px; border-radius:100px; font-size:11.5px; background:${right?'rgba(255,201,60,0.18)':'rgba(255,247,232,0.08)'};">${escapeHtml(voter?voter.name:'?')} → ${escapeHtml(votedFor?votedFor.name:'?')} ${right?'✓':''}</span>`;
    }).join('');
    return `<div class="game-card" style="text-align:left; margin-bottom:8px;">
      <p class="hint" style="margin:0 0 4px; color:rgba(255,247,232,0.55); font-size:11.5px;">Runde ${h.round}${h.tie?' · uafgjort, Chancen valgte':''}</p>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:16px; margin:0;">${wasMrBrok?'🕵️':'😬'} ${escapeHtml(eliminated?eliminated.name:'?')} blev stemt ud${wasMrBrok?' — det var MrBrok!':''}</p>
      ${!wasMrBrok?'<p class="hint" style="margin:2px 0 0; color:rgba(255,247,232,0.6);">(ikke MrBrok)</p>':''}
      <div data-mrbrok-recap-toggle="${i}" style="margin-top:8px; font-size:12px; font-weight:700; color:rgba(255,247,232,0.55); cursor:pointer; text-decoration:underline;">${isOpen?'Skjul stemmer':'Vis hvem stemte hvordan'}</div>
      ${isOpen?`<div style="margin-top:6px;">${votes}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="section-label">📜 Sådan gik det</div>${rows}`;
}

function mrbrokOverHtml(m, cur){
  const mrbrokMember = state.members.find(mm=>mm.id===cur.mrBrokId);
  const ranked = state.members.filter(mm=>m.players.includes(mm.id) && mm.id !== cur.mrBrokId).sort((a,b)=>(cur.scores[b.id]||0)-(cur.scores[a.id]||0));
  const scoreRows = ranked.map((mm,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(mm.name)}</div></div>
      <div class="bal-amt">${cur.scores[mm.id]||0} point</div>
    </div>
  `).join('');
  const stealLine = cur.caught
    ? (cur.stealGuess
        ? (cur.mrBrokWon ? `<p class="hint" style="color:rgba(255,201,60,0.85); font-weight:600;">😏 MrBrok gættede "${escapeHtml(cur.stealGuess)}" — tæt nok! Sejren blev stjålet.</p>` : `<p class="hint" style="color:rgba(255,247,232,0.7);">MrBrok gættede "${escapeHtml(cur.stealGuess)}" — ikke tæt nok.</p>`)
        : `<p class="hint" style="color:rgba(255,247,232,0.7);">MrBrok nåede ikke at gætte i tide.</p>`)
    : `<p class="hint" style="color:rgba(255,247,232,0.7);">MrBrok blev aldrig afsløret af flertallet.</p>`;
  return `
    <div class="game-badge">🎉 MrBrok er slut!</div>
    <div class="game-card" id="mrbrokReveal" style="text-align:center; margin-bottom:12px;">
      <div style="font-size:34px;">🫵</div>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:6px 0;">MrBrok var... ${escapeHtml(mrbrokMember?mrbrokMember.name:'?')}!</p>
      <p class="hint" style="color:rgba(255,247,232,0.6);">Emnet var: <b style="color:rgba(255,247,232,0.85);">${escapeHtml(cur.topic||'?')}</b></p>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; margin-top:8px; color:${cur.mrBrokWon?'var(--coin)':'var(--coral)'};">${cur.mrBrokWon ? '👑 MrBrok vandt!' : '👑 De andre afslørede MrBrok!'}</p>
      ${stealLine}
      ${m.wager==='euro' ? `<p class="hint" style="color:rgba(255,247,232,0.7);">${cur.mrBrokWon ? 'De andre lægger 1€ hver i puljen.' : 'MrBrok lægger 1€ i puljen.'}</p>` : '<p class="hint" style="color:rgba(255,247,232,0.7);">Kun for sjov denne gang.</p>'}
    </div>
    <div class="section-label">🎯 Gætte-regnskab</div>
    ${scoreRows}
    ${mrbrokRecapHtml(m, cur)}
    ${mrbrokHighscoreHtml()}
    <button class="game-btn" id="mrbrokPlayAgainBtn" style="margin-top:16px;">🕵️ Spil igen</button>
    <button class="game-btn ghost" id="mrbrokEndBtn">Tilbage til lobbyen</button>
  `;
}

function bindMrbrokHandlers(m){
  const cur = m.current;
  const roleToggle = document.getElementById('mrbrokRoleToggle');
  if(roleToggle) roleToggle.onclick = ()=>{
    if(mrbrokRoleHideTimer){ clearTimeout(mrbrokRoleHideTimer); mrbrokRoleHideTimer = null; }
    mrbrokRoleRevealed = !mrbrokRoleRevealed;
    if(mrbrokRoleRevealed){
      mrbrokRoleHideTimer = setTimeout(()=>{ mrbrokRoleHideTimer = null; mrbrokRoleRevealed = false; render(); }, 7000);
    }
    render();
  };
  const instrToggle = document.getElementById('mrbrokInstructionsToggle');
  if(instrToggle) instrToggle.onclick = ()=>{ mrbrokInstructionsOpen = !mrbrokInstructionsOpen; render(); };
  document.querySelectorAll('[data-mrbrok-wager]').forEach(el=>{
    el.onclick = ()=>{ mrbrokWager = el.dataset.mrbrokWager; render(); };
  });
  document.querySelectorAll('[data-mrbrok-warmup]').forEach(el=>{
    el.onclick = ()=>{ mrbrokWarmup = parseInt(el.dataset.mrbrokWarmup,10); render(); };
  });
  document.querySelectorAll('[data-mrbrok-player]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.mrbrokPlayer;
      if(mrbrokSelectedPlayers.includes(id)) mrbrokSelectedPlayers = mrbrokSelectedPlayers.filter(x=>x!==id);
      else mrbrokSelectedPlayers = [...mrbrokSelectedPlayers, id];
      render();
    };
  });
  const startBtn = document.getElementById('startMrbrokBtn');
  if(startBtn) startBtn.onclick = ()=> mrbrokApi('start', { wager: mrbrokWager, playerIds: mrbrokSelectedPlayers, warmupRounds: mrbrokWarmup });

  const playAgainBtn = document.getElementById('mrbrokPlayAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    mrbrokApi('end', {}).then(()=> mrbrokApi('start', { wager: mrbrokWager, playerIds: mrbrokSelectedPlayers, warmupRounds: mrbrokWarmup }));
  };
  const endBtn = document.getElementById('mrbrokEndBtn');
  if(endBtn) endBtn.onclick = ()=> mrbrokApi('end', {});

  const complainBtn = document.getElementById('complainBtn');
  if(complainBtn) complainBtn.onclick = ()=> mrbrokApi('complain', { payload: { targetId: complainBtn.dataset.target } });

  document.querySelectorAll('[data-mrbrok-recap-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const i = parseInt(el.dataset.mrbrokRecapToggle, 10);
      if(mrbrokRecapOpenRounds.has(i)) mrbrokRecapOpenRounds.delete(i);
      else mrbrokRecapOpenRounds.add(i);
      render();
    };
  });

  if(!cur) return;

  if(cur.type === 'clue' && profile && profile.memberId === cur.speakerId){
    const tipBtn = document.getElementById('mrbrokTipBtn');
    if(tipBtn) tipBtn.onclick = ()=>{
      // Rent client-side — trænger aldrig i nærheden af serveren, det er
      // bare et tilfældigt forslag til en VINKEL, aldrig et svar/ord.
      const pool = mrbrokImitationRounds(m.warmupRounds + 1).has(cur.round) ? MRBROK_IMITATION_TIPS : MRBROK_CLUE_TIPS;
      let pick = pool[Math.floor(Math.random()*pool.length)];
      if(pool.length > 1) while(pick === mrbrokTipText) pick = pool[Math.floor(Math.random()*pool.length)];
      mrbrokTipText = pick;
      render();
    };
    const doneBtn = document.getElementById('mrbrokDoneBtn');
    if(doneBtn) doneBtn.onclick = ()=>{
      lockSubmitBtn(doneBtn, 'Går videre...');
      mrbrokApi('submit', { payload: {} });
    };
  }
  if(cur.type === 'vote'){
    document.querySelectorAll('[data-mrbrok-vote]').forEach(el=>{
      el.onclick = ()=>{
        document.querySelectorAll('[data-mrbrok-vote]').forEach(x=>x.style.opacity='.4');
        el.style.opacity='1'; el.style.outline='2px solid var(--coin)';
        mrbrokApi('submit', { payload: { votedForId: el.dataset.mrbrokVote } });
      };
    });
  }
  if(cur.type === 'steal' && m.youAreMrBrok && !cur.guess){
    const btn = document.getElementById('mrbrokStealBtn');
    if(btn) btn.onclick = ()=>{
      const guess = document.getElementById('mrbrokStealInput').value.trim();
      if(!guess) return;
      lockSubmitBtn(btn, 'Sender...');
      mrbrokApi('submit', { payload: { guess } });
    };
  }
  if(cur.type === 'steal' && cur.guess && !m.youAreMrBrok){
    document.querySelectorAll('[data-mrbrok-steal-vote]').forEach(el=>{
      el.onclick = ()=> mrbrokApi('submit', { payload: { closeEnough: el.dataset.mrbrokStealVote === 'true' } });
    });
  }
}

async function complainerApi(action, extra){
  if(action === 'end') botAutoplay = false; // se samme kommentar i gameApi
  try{
    const r = await api('complainer', Object.assign({ action, roomId, actorId: profile.memberId }, extra||{}));
    state = r.state;
    render();
  }catch(e){
    if(e.message === 'ugyldig handling lige nu'){
      toast('🔄 Runden nåede at gå videre — opdaterer...');
      await refreshState(false);
    } else {
      toast(e.message);
    }
  }
}

// Generisk, letvægts "spændings-beat" — et par sekunders fuldskærms-pause
// med et par ord, ingen handling krævet, lukker selv. Bruges til flere
// forskellige overgange (runde-start, stemmeresultat, dom), samme
// ember-udseende (.complainer-splash) som de øvrige Det Store
// Brokkeri-splashes, men uden deres egen dedikerede tilstand pr. type —
// nøglen (fx "round:<startedAt>:<round>") sikrer den kun vises ÉN gang pr.
// overgang, ikke ved hvert almindeligt poll/gen-render.
// extraHtml er valgfri, IKKE escaped (i modsætning til title/subtitle) —
// bruges til at folde det kompakte scoreboard ind i runde-start-beatsne
// (se maybeShowComplainerSuspenseSplashes), fordi Martin bad om at
// scoreboardet vises MELLEM runderne, ikke permanent på complain/vote/bet-
// skærmene (se complainerScoreboardHtml's kaldesteder, som blev fjernet
// derfra). Samme "vises kun én gang pr. overgang, lukker selv"-disciplin
// gælder også med extraHtml — det er stadig et forbigående beat, ikke en
// ny permanent placering.
function showComplainerSuspenseSplash(key, emoji, title, subtitle, autoCloseMs, extraHtml){
  if(complainerSuspenseShownKeys.has(key)) return;
  complainerSuspenseShownKeys.add(key);
  const backdropHtml = `<div class="complainer-splash-backdrop" id="complainerSuspenseBackdrop"><div class="complainer-splash" id="complainerSuspenseInner"></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('complainerSuspenseBackdrop');
  const inner = document.getElementById('complainerSuspenseInner');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });
  inner.innerHTML = `
    <div style="font-size:52px;">${emoji}</div>
    <h3>${escapeHtml(title)}</h3>
    ${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ''}
    ${extraHtml || ''}
  `;
  if(typeof gsap !== 'undefined') gsap.fromTo(inner, {opacity:0, scale:.95}, {opacity:1, scale:1, duration:.35, ease:'back.out(1.6)'});
  setTimeout(close, autoCloseMs || 1800);
}

// Suspense-beats ved tre naturlige overgange: en ny rundes start (efter
// runde 1, som i stedet får den fyldigere rolle-splash lige nedenfor), lige
// før rundens mistanke-resultat vises (bet-fasen afslører hvem der topper),
// og lige før det endelige udfald (gameover). Samme "vises kun én gang pr.
// overgang"-filosofi som resten af splashene i appen.
//
// Scoreboardet (complainerScoreboardHtml) foldes ind i de to
// runde-start-agtige beats herunder (normal runde-start + den ekstra sidste
// afstemningsrunde) — IKKE på complain/vote/bet-skærmene selv. Martins
// eksplicitte ønske efter playtesten: stillingen skal vises MELLEM
// runderne, ikke sidde permanent fremme mens man rent faktisk spiller. Da
// splashen i forvejen kun vises én gang pr. overgang og lukker sig selv, får
// scoreboardet automatisk samme "kort glimt, så væk igen"-egenskab.
function maybeShowComplainerSuspenseSplashes(c){
  if(!c || !c.active || !c.current) return;
  const cur = c.current;
  if(cur.type === 'complain' && cur.turnIndex === 0 && cur.round > 1){
    showComplainerSuspenseSplash('cxround:'+c.startedAt+':'+cur.round, '🪤', `Runde ${cur.round} starter...`, 'Nye, skarpere spørgsmål venter.', 2400, complainerScoreboardHtml(c));
  }
  // Den ekstra, sidste afstemningsrunde (se beginFinalVoteRound i
  // complainerFlow.js) — ingen ny brok-fase, kun ét sidste strategisk
  // øjeblik lige før afsløringen låser fast. Egen splash, adskilt fra den
  // almindelige runde-start-splash ovenfor, fordi den IKKE varsler nye
  // spørgsmål (der kommer ingen), kun en sidste chance for at flytte mistanken.
  if(cur.type === 'vote' && cur.round > c.totalRounds){
    showComplainerSuspenseSplash('cxfinalvote:'+c.startedAt, '🚨', 'Sidste afstemning!', 'Ingen nye spørgsmål — men mistanken kan stadig nå at flytte sig.', 2800, complainerScoreboardHtml(c));
  }
  if(cur.type === 'bet'){
    showComplainerSuspenseSplash('cxresults:'+c.startedAt+':'+cur.round, '🗳️', 'Stemmerne er talt op...', 'Hvem topper mistanken?', 1600);
  }
  if(cur.type === 'gameover'){
    showComplainerSuspenseSplash('cxoutcome:'+c.startedAt, '⚖️', 'Dommen er faldet...', null, 1600);
  }
}

// Fælles "Runde X/Y"-badge-tekst for vote/bet-skærmene — men den EKSTRA,
// sidste afstemningsrunde (se beginFinalVoteRound i complainerFlow.js) har
// intet meningsfuldt "X/Y" at vise (den ligger UDENFOR de konfigurerede
// opbygningsrunder), så den får sin egen tydelige label i stedet for det
// forvirrende "Runde 5/4".
function complainerRoundLabel(c, cur){
  if(cur.round > c.totalRounds) return 'Sidste afstemning';
  return `Runde ${c.round}/${c.totalRounds}`;
}

// Kompakt live-scoreboard, vist øverst på complain/vote/bet-skærmene under
// selve spillet (produktejer-ønske — der var ingen synlig fornemmelse af
// stilling undervejs, kun ved gameover). To kolonner side om side, fordi
// mistanke-point (c.scores) og "Godt brok!"-performance (c.brokScores) er
// BEVIDST to adskilte regnskaber (se complainerBrokScoresHtml/gameover) —
// samme adskillelse skal holde live, ikke kun i det endelige opgør. Viser
// kun top 4 (sorteret efter mistanke-point) for at holde det til et par
// linjer på en telefonskærm, ikke endnu en fuld liste.
function complainerScoreboardHtml(c){
  if(!c || !c.players || !c.players.length) return '';
  const scores = c.scores || {};
  const brokScores = c.brokScores || {};
  const ranked = state.members
    .filter(mm=>c.players.includes(mm.id))
    .sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0))
    .slice(0, 4);
  if(!ranked.length) return '';
  const rows = ranked.map(mm=>`
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:3px 0;">
      <span style="font-size:12.5px; color:rgba(255,247,232,0.85); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(mm.name)}</span>
      <span style="display:flex; gap:10px; flex:0 0 auto;">
        <span style="font-size:12px; font-weight:700; color:var(--ember);">🎯 ${scores[mm.id]||0}</span>
        <span style="font-size:12px; font-weight:700; color:rgba(255,201,60,0.9);">🔥 ${brokScores[mm.id]||0}</span>
      </span>
    </div>
  `).join('');
  return `<div class="game-card" style="padding:8px 14px; margin-bottom:12px;">${rows}</div>`;
}

// Rolle-splash ved spilstart — fuldskærm, kræver et tryk for at lukke (i
// modsætning til suspense-beatsne ovenfor, som lukker selv), fordi det er
// den vigtigste information i hele spillet og skal kunne læses i ro. Vises
// kun ved allerførste tur af spillet (runde 1, tur 0), samme trigger-mønster
// som MrBrok's maybeShowMrbrokRoleSplash.
function maybeShowComplainerRoleSplash(c){
  if(!c || !c.active || !c.current) return;
  const cur = c.current;
  if(cur.type !== 'complain' || cur.round !== 1 || cur.turnIndex !== 0) return;
  if(complainerRoleSplashShownFor === c.startedAt) return;
  complainerRoleSplashShownFor = c.startedAt;
  if(!profile) return;
  const archetypeId = c.archetypes && c.archetypes[profile.memberId];
  const situation = c.situations && c.situations[profile.memberId];
  const info = COMPLAINER_ARCHETYPE_INFO[archetypeId] || { name:'?', instructions:[] };

  const backdropHtml = `<div class="complainer-splash-backdrop" id="complainerRoleSplashBackdrop"><div class="complainer-splash" id="complainerRoleSplashInner"></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('complainerRoleSplashBackdrop');
  const inner = document.getElementById('complainerRoleSplashInner');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });

  const instructionsHtml = (info.instructions||[]).map(text=>`<li><span>🎭</span><span>${escapeHtml(text)}</span></li>`).join('');
  inner.innerHTML = `
    <div style="font-size:52px;">🪤</div>
    <h3>${escapeHtml(info.name)}</h3>
    <p>Din situation: brok dig over ${escapeHtml(COMPLAINER_SITUATION_LABELS[situation]||situation||'?')}</p>
    <ul>${instructionsHtml}</ul>
    <button class="game-btn" id="complainerRoleSplashCloseBtn">Forstået, lad os brokke os</button>
  `;
  if(typeof gsap !== 'undefined') gsap.fromTo(inner, {opacity:0, scale:.95}, {opacity:1, scale:1, duration:.35, ease:'back.out(1.6)'});
  document.getElementById('complainerRoleSplashCloseBtn').onclick = close;
}

// Den PRIVATE afsløring (se beginReveal i complainerFlow.js) — men BÅDE
// pushen (se api/complainer.js's to-batch-push) OG denne splash vises for
// ALLE spillere samtidig, ikke kun den skyldige. Havde kun den skyldiges
// telefon lyst op/vist noget nyt lige nu, ville DET i sig selv være et
// afsløringstegn ved bordet — uanset hvad der reelt stod i det (produktejer-
// rettelse, samme fejltype som CLAUDE.md's MrBrok-anekdote, bare flyttet fra
// runde 1 til dette øjeblik). Indholdet er stadig korrekt kildet fra den
// eksisterende per-viewer-redaktion (c.youAreGuilty) — kun TIMINGEN af
// hvornår alle kigger på skærmen er synkroniseret, ikke hvad de ser.
// Fungerer desuden som det robuste, poll-baserede reserve-signal hvis en
// push fejler stille (VAPID ikke sat op, tilladelse afvist, telefonen lå i
// lommen...) — virker ved næste almindelige gen-render, ikke kun i selve
// øjeblikket. Vises højst én gang pr. spil (keyed på c.startedAt, samme
// mønster som MrBrok's rolle-splash keyet på m.startedAt).
function maybeShowComplainerRevealSplash(c){
  // Trigges nu på 'interrogation' (den ENE spørgerunde der ligger LIGE efter
  // afsløringen, se beginReveal/beginInterrogationRound i complainerFlow.js)
  // i stedet for 'guess' — reveal-tidspunktet er stadig det samme, kun den
  // fase der starter umiddelbart bagefter er ny.
  if(!c || !c.active || !c.current || c.current.type !== 'interrogation') return;
  if(complainerRevealSplashShownFor === c.startedAt) return;
  complainerRevealSplashShownFor = c.startedAt;

  const backdropHtml = `<div class="complainer-splash-backdrop" id="complainerRevealBackdrop"><div class="complainer-splash" id="complainerRevealInner"></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('complainerRevealBackdrop');
  const inner = document.getElementById('complainerRevealInner');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });

  if(c.youAreGuilty){
    inner.innerHTML = `
      <div style="font-size:52px;">🪤</div>
      <h3>Du er Den Store Brokker!</h3>
      <p>Bliv i karakter gennem den sidste spørgerunde — så skal du gætte en konkret detalje om en af de andre, ud fra det de har sagt undervejs. Ingen andre ved det er dig endnu.</p>
      <button class="game-btn" id="complainerRevealCloseBtn">Forstået, jeg er klar</button>
    `;
    if(typeof gsap !== 'undefined') gsap.fromTo(inner, {opacity:0, scale:.95}, {opacity:1, scale:1, duration:.35, ease:'back.out(1.6)'});
    document.getElementById('complainerRevealCloseBtn').onclick = close;
    return;
  }
  // Neutral, in-theme "der sker noget"-skærm — bevidst UDEN reelt indhold
  // (afslører hverken ja eller nej om noget), skal bare se ud som om DENNE
  // telefon også lige fik en besked, akkurat som den skyldiges. Lukker
  // automatisk efter kort tid, ingen handling krævet. VIGTIGT for selve
  // anti-afslørings-pointen: klienterne poller hvert 3. sekund (se
  // startPolling), så to telefoner kan i værste fald opdage afsløringen op
  // til ~3s forskudt af hinanden — luk-forsinkelsen skal derfor være
  // TYDELIGT længere end ét fuldt poll-interval, ellers kan en tidlig
  // telefons splash nå at lukke igen FØR en sen telefons splash overhovedet
  // åbner, hvilket ville ødelægge selve pointen (at alle skærme lyser op
  // SAMTIDIG, set fra bordet).
  inner.innerHTML = `
    <div style="font-size:52px;">🪤</div>
    <h3>Der sker noget...</h3>
    <p>Nogen har lige fundet ud af noget. Hold øje med bordet.</p>
  `;
  if(typeof gsap !== 'undefined') gsap.fromTo(inner, {opacity:0, scale:.95}, {opacity:1, scale:1, duration:.35, ease:'back.out(1.6)'});
  setTimeout(close, 4200);
}

function complainerBodyHtml(c){
  if(!c.active || !c.current) return complainerLobbyHtml();
  const cur = c.current;
  if(cur.type !== 'gameover' && profile && c.players && !c.players.includes(profile.memberId)){
    return `
      <div class="game-badge">${complainerRoundLabel(c, cur)} · 👀 Du kigger med</div>
      <div class="empty-state"><span class="emoji">🍿</span><b>Du er ikke med i denne omgang</b>De andre spiller videre — du er velkommen næste spil.</div>
    `;
  }
  if(cur.type === 'gameover') return complainerOverHtml(c, cur);
  if(cur.type === 'complain') return complainerComplainHtml(c, cur);
  if(cur.type === 'interrogation') return complainerInterrogationHtml(c, cur);
  if(cur.type === 'vote') return complainerVoteHtml(c, cur);
  if(cur.type === 'bet') return complainerBetHtml(c, cur);
  if(cur.type === 'guess') return complainerGuessHtml(c, cur);
  if(cur.type === 'judge') return complainerJudgeHtml(c, cur);
  return '';
}

function complainerHighscoreHtml(){
  const stats = state.complainerStats || {};
  const ranked = state.members
    .filter(mm => !mm.isBot && stats[mm.id] && stats[mm.id].played > 0)
    .sort((a,b) => (stats[b.id].wins - stats[a.id].wins) || (stats[b.id].played - stats[a.id].played));
  if(!ranked.length) return '';
  const rows = ranked.map((mm,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(mm.name)}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${stats[mm.id].played} spillet</div></div>
      <div class="bal-amt">${stats[mm.id].wins} sejre</div>
    </div>
  `).join('');
  return `<div class="section-label">🏆 Highscore</div>${rows}`;
}
