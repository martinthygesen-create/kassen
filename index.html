// Kompakt visning af tur-rækkefølgen for DENNE runde — hvem har allerede
// sagt sit brok, hvem har ordet nu, hvem er der tilbage. Nøjagtig samme
// mønster/CSS-klasser som MrBrok's mrbrokTurnOrderHtml (se den for
// baggrund om hvorfor et eget grid i stedet for .name-grid's flex-wrap) —
// genbruger bevidst de samme klassenavne, da de er ren layout/visuel stil
// uden nogen kobling til MrBroks state/flow.
function complainerTurnOrderHtml(c, cur){
  const chips = cur.order.map((id,i)=>{
    const mm = state.members.find(x=>x.id===id);
    const isDone = i < cur.turnIndex, isCurrent = i === cur.turnIndex;
    const style = isCurrent
      ? 'background:var(--ember); border-color:var(--ember); color:var(--ember-noir-deep);'
      : (isDone ? 'opacity:.45; text-decoration:line-through;' : 'opacity:.75;');
    return `<div class="name-pill mrbrok-turn-pill" style="${style}">${isDone?'✓ ':''}${escapeHtml(mm?mm.name:'?')}</div>`;
  }).join('');
  return `<div class="mrbrok-turn-grid" style="margin-bottom:14px;">${chips}</div>`;
}

// VERBALT, tur-baseret — broksene siges HØJT ved bordet, ikke skrives.
// Nøjagtig samme mønster som MrBrok's mrbrokClueHtml: en delt tur-rækkefølge,
// kun den aktuelle taler har en handling (en "færdig"-bekræftelse, intet
// tekstfelt), alle andre ser hvis tur det er og hvilken prompt de svarer på
// (prompts er ikke hemmelige — alle må gerne følge med i hvad der bliver
// spurgt om, se redactComplainerFor).
// "🔥 Godt brok!" — én simpel anerkendelse fra de andre spillere til den der
// LIGE har haft sin tur (cur.order[cur.turnIndex-1]), for hvor godt de ramte
// deres arketypes instruerede stil. Helt separat point-kanal fra c.scores
// (mistankepoint) — se c.brokScores/'approveBrok' i api/complainer.js. Kun
// ét tryk, ingen formular, for ikke at bremse den verbale rytme.
function complainerBrokApproveHtml(c, cur){
  if(!profile || cur.turnIndex < 1) return '';
  const prevId = cur.order[cur.turnIndex - 1];
  if(prevId === profile.memberId) return '';
  const prevMember = state.members.find(mm=>mm.id===prevId);
  const key = cur.round + ':' + prevId;
  const already = c.brokApprovals && c.brokApprovals[key] && c.brokApprovals[key][profile.memberId];
  if(already){
    return `<p class="hint" style="text-align:center; margin-top:10px; color:rgba(255,201,60,0.7);">🔥 Du gav ros for ${escapeHtml(prevMember?prevMember.name:'?')}s brok</p>`;
  }
  return `<button class="game-btn ghost" id="complainerApproveBrokBtn" data-target="${prevId}" style="margin-top:10px;">🔥 Godt brok, ${escapeHtml(prevMember?prevMember.name:'?')}!</button>`;
}

        <p style="font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px; margin:0 0 16px;">${speakerPrompt ? escapeHtml(speakerPrompt.text) : '...'}</p>

      ${complainerBrokApproveHtml(c, cur)}

  return `
    ${badge}

      ${complainerTurnOrderHtml(c, cur)}
      <div class="empty-state" style="padding:30px 20px;">
        <span class="emoji">👂</span>
        <b style="font-size:26px;">${escapeHtml(speaker?speaker.name:'?')}</b>

// Den ENE spørgerunde mellem den private afsløring og gættefinalen (se

    </div>

function complainerVoteOptionsHtml(c, cur){
  const options = state.members.filter(mm=>c.players.includes(mm.id) && mm.id !== profile.memberId);
  return options.map(mm=>`
    <div class="bal-row game-pick" data-complainer-vote="${mm.id}" style="cursor:pointer;">
      <div class="avatar">${initials(mm.name)}</div>

// EXPERIMENTAL "Udfordring"-blok (se api/_lib/complainerFlow.js's
// applyComplainerChallenge og api/complainer.js's 'challenge'-handler for
// baggrund/fjernelses-instruktion). Kun denne funktion + dens ene
// kaldested i complainerBetHtml + de to server-side steder skal fjernes
// for at rippe featuren ud igen, hvis den ikke tester godt ved bordet.
function complainerChallengeBlockHtml(c, cur){
  if(c.challengeEnabled === false) return '';
  if(cur.challenged){
    const byMember = state.members.find(mm=>mm.id===cur.challengedBy);
    const tallyRows = Object.entries(cur.tally||{}).map(([id,n])=>{
      const mm = state.members.find(x=>x.id===id);
      return `<span style="display:inline-block; margin:2px 6px 2px 0; padding:3px 9px; border-radius:100px; font-size:11.5px; background:rgba(255,122,61,0.18);">${escapeHtml(mm?mm.name:'?')}: ${n}</span>`;
    }).join('');
    return `
      <div class="game-card" style="text-align:left; margin-bottom:12px;">
        <p class="hint" style="margin:0 0 6px; color:rgba(255,201,60,0.9); font-weight:700;">⚡ ${escapeHtml(byMember?byMember.name:'Nogen')} udfordrede! Point er fordoblet denne runde, og hele stemmefordelingen er nu åben:</p>
        <div>${tallyRows}</div>
      </div>
    `;
  }
  const isTop = profile && profile.memberId === cur.topId;
  const alreadyUsed = profile && c.challengeUsedBy && c.challengeUsedBy[profile.memberId];
  if(isTop || alreadyUsed || cur.choice) return '';
  return `<button class="game-btn ghost" id="complainerChallengeBtn" style="margin-top:10px;">⚡ Udfordring! (fordobler indsatsen, afslører alle stemmer — kan kun bruges én gang pr. spil)</button>`;
}

function complainerBetHtml(c, cur){
  const badge = `<div class="game-badge">${complainerRoundLabel(c, cur)} · 🎰 Rundens mest mistænkte</div>`;
  const topMember = state.members.find(mm=>mm.id===cur.topId);
  const isTop = profile && profile.memberId === cur.topId;
  const stakePoints = SUSPECT_POINTS_CLIENT * (cur.stakeMultiplier || 1);
  // Den EKSTRA, sidste afstemningsrunde (se beginFinalVoteRound i
  // complainerFlow.js) har ingen runde EFTER sig til at gamble ind i — der
  // er intet "topmest mistænkt IGEN næste runde" at satse på. Gamble-valget
  // skjules derfor helt her (serveren har samme værn, se api/complainer.js's
  // 'bet'-håndtering), i stedet for at tilbyde et valg der reelt aldrig kan
  // udbetale sig.
  const isFinalRound = cur.round > c.totalRounds;
  const gambleNote = c.lastGambleResult ? (()=>{
    const gm = state.members.find(mm=>mm.id===c.lastGambleResult.playerId);
    return c.lastGambleResult.won
      ? `<p class="hint" style="color:rgba(255,201,60,0.9); font-weight:600; text-align:center;">🎉 ${escapeHtml(gm?gm.name:'?')} var topmest mistænkt igen — satsningen gav dobbelt op!</p>`
      : `<p class="hint" style="color:rgba(255,247,232,0.7); text-align:center;">😬 ${escapeHtml(gm?gm.name:'?')} var IKKE topmest mistænkt denne gang — satsningen gik tabt.</p>`;
  })() : '';
  if(!isTop){
    return `${badge}${gambleNote}<div class="empty-state"><span class="emoji">😳</span><b>${escapeHtml(topMember?topMember.name:'?')} er rundens mest mistænkte</b>${isFinalRound ? 'De banker nu deres sidste point, lige inden afsløringen.' : 'De vælger nu om de vil banke et sikkert point, eller satse dobbelt op.'}</div>${complainerChallengeBlockHtml(c, cur)}`;
  }
  return `
    ${badge}
    ${gambleNote}
    ${complainerChallengeBlockHtml(c, cur)}
    <div class="game-card" id="complainerCard" style="text-align:center;">
      <div style="font-size:26px;">😳</div>
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:4px 0 6px;">Du er rundens mest mistænkte!</p>
      ${isFinalRound
        ? `<p class="hint" style="color:rgba(255,247,232,0.7); margin:0 0 16px;">Sidste afstemning — ingen flere runder at satse videre i. Bank dine ${stakePoints} point.</p>
           <button class="game-btn" data-complainer-bet="safe" style="margin-top:0;">🏦 Bank ${stakePoints} sikkert</button>`
        : `<p class="hint" style="color:rgba(255,247,232,0.7); margin:0 0 16px;">Bank ${stakePoints} sikkert point nu, eller sats dem — bliver du topmest mistænkt IGEN næste runde, får du det dobbelte. Ellers er de tabt.</p>
           <div style="display:flex; gap:10px;">
             <button class="game-btn" data-complainer-bet="safe" style="margin-top:0; background:linear-gradient(160deg, var(--sea), var(--sea-deep)); box-shadow:0 8px 18px rgba(11,58,63,0.4);">🏦 Bank ${stakePoints} sikkert</button>
             <button class="game-btn" data-complainer-bet="gamble" style="margin-top:0;">🎰 Sats dobbelt op</button>
           </div>`
      }
    </div>
  `;
}

// VIGTIGT: broksenes ORDLYD er ALDRIG gemt (se beginComplainRound i
// complainerFlow.js) — de blev sagt højt ved bordet, og gættefinalen skal
// bevidst hvile på spillernes egen hukommelse om det, ikke en app-facitliste
// (produktejer-beslutning). Denne historik viser derfor kun HVILKEN prompt
// hver spiller svarede på hver runde — en hukommelses-krog, ikke et referat.
function complainerHistoryHtml(c){
  if(!c.history || !c.history.length) return '';
  const rows = c.history.map((h,i)=>{
    const isOpen = complainerHistoryOpenRounds.has(i);
    const lines = c.players.map(id=>{
      const mm = state.members.find(x=>x.id===id);
      const prompt = h.prompts && h.prompts[id];
      if(!prompt) return '';
      return `<div style="margin-bottom:6px;"><p style="margin:0; font-size:13px; color:rgba(255,247,232,0.85);"><b style="color:rgba(255,247,232,0.98);">${escapeHtml(mm?mm.name:'?')}</b>: ${escapeHtml(prompt.text)}</p></div>`;
    }).join('');
    return `<div class="game-card" style="text-align:left; margin-bottom:8px;">
      <div data-complainer-history-toggle="${i}" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
        <p class="hint" style="margin:0; color:rgba(255,247,232,0.55);">Runde ${h.round} — hvem svarede på hvad</p>
        <span style="font-size:12px; color:rgba(255,247,232,0.5); text-decoration:underline;">${isOpen?'Skjul':'Vis'}</span>
      </div>
      ${isOpen?`<div style="margin-top:8px;">${lines}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="section-label">📜 Hvad blev spurgt om hidtil (husk selv svarene!)</div>${rows}`;
}

// Samme "ambient brok mod langsomme"-mekanik som Brokspillet/MrBrok — se
// mrbrokComplaintBlockHtml. Ingen anonymisering her (der er ingen turrækkefølge
// at skjule bag, i modsætning til MrBrok's clue-fase).
// Under den verbale komplain-fase anonymiseres målet for et brok — samme
// begrundelse som MrBrok's mrbrokComplaintBlockHtml's clue-anonymisering:
// hvem der har turen er allerede synligt via tur-rækkefølgen, men selve
// "tempo er nu officielt mistænkeligt"-stemplet skal IKKE komme fra appen
// lige før en mistankeafstemning om netop denne runde.
function complainerComplaintBlockHtml(c, cur){
  if(!cur || !profile) return '';
  const pending = getPendingComplainerIdsClient(c, cur);
  if(!pending.length) return '';
  const myId = profile.memberId;
  const anonymize = cur.type === 'complain';
  if(cur.complaint){
    const byName = cur.complaint.by === 'brokkefaelden' ? 'Spillet' : ((state.members.find(mm=>mm.id===cur.complaint.by)||{}).name || 'Nogen');
    const targetName = (state.members.find(mm=>mm.id===cur.complaint.targetId)||{}).name || 'nogen';
    const line = anonymize
      ? `${cur.complaint.by === 'brokkefaelden' ? '🎙️' : '🐌'} Turen bruger lang tid`
      : `${cur.complaint.by === 'brokkefaelden' ? '🎙️' : '🐌'} <b>${escapeHtml(byName)}</b> brokker sig over at <b>${escapeHtml(targetName)}</b> bruger sin tid`;
    return `
      <div class="complaint-banner">
        <span>${line}</span>
        <span id="complaintCountdown" class="complaint-countdown"></span>
      </div>
    `;
  }
  if(pending.includes(myId)) return ''; // man skal selv være færdig for at kunne brokke sig
  const age = cur.phaseStartedAt ? (Date.now() - cur.phaseStartedAt) : 0;
  if(age < MIN_COMPLAIN_AGE_MS) return '';
  const growth = Math.min(1, (age - MIN_COMPLAIN_AGE_MS) / 30000);
  const targetName = !anonymize && pending.length === 1 ? (state.members.find(mm=>mm.id===pending[0])||{}).name : null;
  const label = targetName ? `🐌 Brok over ${escapeHtml(targetName)}s tempo` : `🐌 Brok over ventetiden`;
  return `<button class="complain-btn" id="complainBtn" data-target="${pending[0]}" style="transform:scale(${(1+growth*0.16).toFixed(2)}); opacity:${(0.6+growth*0.4).toFixed(2)};">${label}</button>`;
}

function bindComplainerHandlers(c){
  const cur = c.current;
  const roleToggle = document.getElementById('complainerRoleToggle');
  if(roleToggle) roleToggle.onclick = ()=>{
    if(complainerRoleHideTimer){ clearTimeout(complainerRoleHideTimer); complainerRoleHideTimer = null; }
    complainerRoleRevealed = !complainerRoleRevealed;
    if(complainerRoleRevealed){
      complainerRoleHideTimer = setTimeout(()=>{ complainerRoleHideTimer = null; complainerRoleRevealed = false; render(); }, 7000);
    }
    render();
  };
  const instrToggle = document.getElementById('complainerInstructionsToggle');
  if(instrToggle) instrToggle.onclick = ()=>{ complainerInstructionsOpen = !complainerInstructionsOpen; render(); };
  document.querySelectorAll('[data-complainer-wager]').forEach(el=>{
    el.onclick = ()=>{ complainerWager = el.dataset.complainerWager; render(); };
  });
  document.querySelectorAll('[data-complainer-rounds]').forEach(el=>{
    el.onclick = ()=>{ complainerRounds = parseInt(el.dataset.complainerRounds,10); render(); };
  });
  document.querySelectorAll('[data-complainer-player]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.complainerPlayer;
      if(complainerSelectedPlayers.includes(id)) complainerSelectedPlayers = complainerSelectedPlayers.filter(x=>x!==id);
      else complainerSelectedPlayers = [...complainerSelectedPlayers, id];
      render();
    };
  });
  const startBtn = document.getElementById('startComplainerBtn');
  if(startBtn) startBtn.onclick = ()=> complainerApi('start', { wager: complainerWager, playerIds: complainerSelectedPlayers, totalRounds: complainerRounds });

  const playAgainBtn = document.getElementById('complainerPlayAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    complainerApi('end', {}).then(()=> complainerApi('start', { wager: complainerWager, playerIds: complainerSelectedPlayers, totalRounds: complainerRounds }));
  };
  const endBtn = document.getElementById('complainerEndBtn');
  if(endBtn) endBtn.onclick = ()=> complainerApi('end', {});

  const complainBtn = document.getElementById('complainBtn');
  if(complainBtn) complainBtn.onclick = ()=> complainerApi('complain', { payload: { targetId: complainBtn.dataset.target } });

  document.querySelectorAll('[data-complainer-history-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const i = parseInt(el.dataset.complainerHistoryToggle, 10);
      if(complainerHistoryOpenRounds.has(i)) complainerHistoryOpenRounds.delete(i);
      else complainerHistoryOpenRounds.add(i);
      render();
    };
  });

  if(!cur) return;

  if(cur.type === 'complain' && profile && profile.memberId === cur.speakerId){
    const doneBtn = document.getElementById('complainerDoneBtn');
    if(doneBtn) doneBtn.onclick = ()=>{
      lockSubmitBtn(doneBtn, 'Går videre...');
      complainerApi('submit', { payload: {} });
    };
  }
  if(cur.type === 'interrogation' && profile && profile.memberId === cur.speakerId){
    const doneBtn = document.getElementById('complainerInterrogationDoneBtn');
    if(doneBtn) doneBtn.onclick = ()=>{
      lockSubmitBtn(doneBtn, 'Går videre...');
      complainerApi('submit', { payload: {} });
    };
  }
  if(cur.type === 'complain'){
    const approveBtn = document.getElementById('complainerApproveBrokBtn');
    if(approveBtn) approveBtn.onclick = ()=>{
      lockSubmitBtn(approveBtn, 'Sender...');
      complainerApi('approveBrok', { payload: { targetId: approveBtn.dataset.target } });
    };
  }
  if(cur.type === 'vote'){
    document.querySelectorAll('[data-complainer-vote]').forEach(el=>{
      el.onclick = ()=>{
        document.querySelectorAll('[data-complainer-vote]').forEach(x=>x.style.opacity='.4');
        el.style.opacity='1'; el.style.outline='2px solid var(--coin)';
        complainerApi('submit', { payload: { votedForId: el.dataset.complainerVote } });
      };
    });
  }
  if(cur.type === 'bet' && profile && profile.memberId === cur.topId){
    document.querySelectorAll('[data-complainer-bet]').forEach(el=>{
      el.onclick = ()=> complainerApi('submit', { payload: { choice: el.dataset.complainerBet } });
    });
  }
  if(cur.type === 'bet'){
    // EXPERIMENTAL "Udfordring" — se complainerChallengeBlockHtml.
    const challengeBtn = document.getElementById('complainerChallengeBtn');
    if(challengeBtn) challengeBtn.onclick = ()=>{
      lockSubmitBtn(challengeBtn, 'Udfordrer...');
      complainerApi('challenge', {});
    };
  }
  if(cur.type === 'guess' && c.youAreGuilty && !cur.targetId){

    <defs>

    </defs>
    <rect x="72" y="6" width="76" height="20" rx="6" fill="#cfd6d2"/>

    <g clip-path="url(#jarClip)">
      <rect x="30" y="${fillY}" width="160" height="${230-fillY}" fill="url(#coinFill)"/>
      <path id="waveTop" d="M0 ${fillY} Q30 ${fillY-6} 60 ${fillY} T120 ${fillY} T180 ${fillY} T240 ${fillY} V230 H0 Z" fill="#FFE49E" opacity="0.5"/>
      ${coinDots(fillY)}
    </g>
    <path d="M52 34 Q48 34 48 42 L48 172" stroke="rgba(255,247,232,0.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function coinDots(fillY){
  if(fillY >= 208) return '';
  let dots = '';
  const rows = Math.floor((210-fillY)/16);
  for(let i=0;i<Math.min(rows*3, 26);i++){
    const x = 55 + (i*37)%110 + (i%2?8:0);
    const y = fillY + 10 + Math.floor(i/3)*15;
    dots += `<ellipse cx="${x}" cy="${y}" rx="9" ry="4" fill="#E8A317" opacity="0.55"/>`;
  }
  return dots;
}

function feedItemHtml(e, old){
  const m = state.members.find(x=>x.id===e.memberId);
  const name = m ? m.name : '?';
  // e.memberId er den ANKLAGEDE (synderen der brokkede sig højt i det
  // virkelige liv), IKKE nødvendigvis den der sad med telefonen og
  // oprettede opslaget — se openBrokSheet ("Hvem brokker sig? Peg på
  // synderen") og api/brok.js's 'accuse'-handling. Uden et eksplicit
  // "brokkede sig over" foran citatet læste det let som et citat SKREVET
  // AF personen, ikke en beskrivelse af hvad de blev overhørt sige — reelt
  // stor forskel på hvem der "skrev" vs. hvem der blev anklaget.
  const complaintPrefix = !e.gameLoss ? 'brokkede sig over ' : '';
  if(e.acquitted){
    return `<div class="feed-item" style="opacity:${old ? .6 : .78};">
      <div class="avatar">${initials(name)}</div>
      <div class="feed-body">
      <div class="feed-name">${escapeHtml(name)} <span class="amt" style="color:rgba(255,201,60,0.9);">⚖️ frikendt</span></div>
      ${e.message ? `<div class="feed-msg">${complaintPrefix}"${escapeHtml(e.message)}"</div>` : ''}
      <div class="feed-msg" style="color:rgba(255,201,60,0.85); font-weight:600;">Ikke nok stemmer nåede rettidigt</div>
      <div class="feed-time">${fmtTime(e.ts)}</div></div></div>`;
  }
  const opacity = e.voided ? .55 : (old ? .72 : 1);
  return `<div class="feed-item" style="opacity:${opacity};">
    <div class="avatar" style="${e.voided?'filter:grayscale(1);':''}">${initials(name)}</div>
    <div class="feed-body">
    <div class="feed-name">${escapeHtml(name)} <span class="amt">${e.voided ? '🫤 talt fra' : (e.gameLoss ? '👉 +1€' : (e.free ? '🎫 gratis' : '+1€'))}</span></div>
    ${e.message ? `<div class="feed-msg" style="${e.voided?'text-decoration:line-through;':''}">${complaintPrefix}"${escapeHtml(e.message)}"</div>` : ''}
    ${e.voided ? `<div class="feed-msg" style="color:rgba(255,201,60,0.85); font-weight:600;">🫤 Mistanke om snyd — tæller ikke med</div>` : ''}
    <div class="feed-time">${fmtTime(e.ts)}</div></div></div>`;
}

function renderFeed(main){
  const pendingCards = (state.pendingList||[]).slice().sort((a,b)=>a.openedAt-b.openedAt).map(renderPendingCard).join('');
  // Ekstra sikkerhedsnet: en bot skal ALDRIG vises som vinder her, uanset
  // hvad der ligger i freeBrokMemberId (fx fra før bot-filtreringen i
  // redrawFreeBrok/updateStreaksAndDrawLottery blev rettet, se store.js).
  const winner = state.freeBrokMemberId ? state.members.find(m=>m.id===state.freeBrokMemberId && !m.isBot) : null;
  const winnerBanner = winner ? `<div class="feed-item" style="border-style:dashed; border-color:rgba(255,201,60,0.5); background:rgba(255,201,60,0.1); align-items:center;">
    <div class="avatar" style="background:linear-gradient(160deg,#ffc93c,#e8a317); color:var(--ink);">🍀</div>
    <div class="feed-body"><div class="feed-name">${escapeHtml(winner.name)} har vundet 1 gratis brok i dag</div><div class="feed-msg">Ét brok i dag er på husets regning</div></div>
  </div>` : '';
  // Gammelt brok kan enten stadig ligge i state.events (bare ældre end i dag)
  // eller allerede være arkiveret i historikken (fx fra en tidligere "Gør op",
  // eller fra tiden inden krukken holdt op med at tømme sig selv hver nat).
  const historyEvents = [];
  state.history.forEach(round => (round.events||[]).forEach(e => historyEvents.push(e)));
  const acquittalEvents = (state.acquittals||[]).map(a => ({ ...a, ts: a.expiredAt, acquitted: true }));
  const allEvents = [...historyEvents, ...state.events, ...acquittalEvents];
  if(!allEvents.length && !state.pendingList.length){
    main.innerHTML = winnerBanner + `<div class="empty-state"><span class="emoji">🤐</span><b>Ingen brok endnu</b>Første gang nogen brokker sig, koster det 1€. Hold øje!</div>`;
    return;
  }
  const sorted = allEvents.slice().sort((a,b)=>b.ts-a.ts);
  const fresh = sorted.filter(e=>e.ts >= state.dayBoundary);
  const stale = sorted.filter(e=>e.ts < state.dayBoundary);
  const freshRows = fresh.map(e=>feedItemHtml(e, false)).join('');
  const staleRows = stale.map(e=>feedItemHtml(e, true)).join('');
  const quietToday = !fresh.length && !!stale.length
    ? `<div class="empty-state" style="padding:24px 20px 10px;"><span class="emoji">🤐</span><b>Stille indtil videre i dag</b>Rul ned og nyd gårsdagens elendighed.</div>`
    : '';
  main.innerHTML = pendingCards + winnerBanner + quietToday
    + (fresh.length ? `<div class="section-label">Seneste brok</div>${freshRows}` : '')
    + (stale.length ? `<div class="section-label" style="margin-top:${fresh.length?22:10}px;">📜 Gammelt brok</div>${staleRows}` : '');
  bindPendingCardHandlers();
}
function allTimeTotals(){
  const totals = {};
  state.members.filter(m=>!m.isBot).forEach(m=>totals[m.id]=0);
  state.history.forEach(round=>{
    Object.entries(round.totals||{}).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  });
  const live = balances();
  Object.entries(live).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  return totals;
}

function spotlightCards(vals){
  const members = state.members.filter(m=>!m.isBot);
  const maxV = Math.max(0, ...Object.values(vals));
  if(maxV <= 0) return '';
  const minV = Math.min(...members.map(m=>vals[m.id]||0));
  const topNames = members.filter(m=>(vals[m.id]||0) === maxV).map(m=>m.name).join(' & ');
  const saintNames = minV < maxV ? members.filter(m=>(vals[m.id]||0) === minV).map(m=>m.name).join(' & ') : null;
  const card = (title, emoji, names, amt, accent) => `
    <div style="flex:1; background:${accent ? 'rgba(255,107,74,0.14)' : 'rgba(255,247,232,0.07)'}; border:1px solid ${accent ? 'rgba(255,107,74,0.35)' : 'rgba(255,247,232,0.15)'}; border-radius:16px; padding:12px; text-align:center;">
      <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,247,232,0.68);">${emoji} ${title}</div>
      <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:${names.length>14?'12.5':'15'}px; color:var(--cream); margin-top:4px; line-height:1.2;">${escapeHtml(names)}</div>
      <div style="font-size:12px; color:var(--coin);">${amt}€</div>
    </div>`;
  return `<div style="display:flex; gap:10px; margin-bottom:18px;">
    ${card('TopBrokker', '🏆', topNames, maxV, true)}
    ${saintNames ? card('Helgenen', '😇', saintNames, minV, false) : ''}
  </div>`;
}

function renderBalanceToday(main){
  const bal = todayBalances();
  const balValues = Object.values(bal);
  const maxAmt = Math.max(0, ...balValues);
  const minAmt = balValues.length ? Math.min(...balValues) : 0;
  const streaks = state.streaks || {};
  const rows = state.members.filter(m=>!m.isBot).sort((a,b)=>bal[b.id]-bal[a.id]).map(m=>{
    const amt = bal[m.id]||0;
    const isTop = amt > 0 && amt === maxAmt;
    const isLeast = maxAmt > minAmt && amt === minAmt;
    const crown = isTop ? ' 👑' : (isLeast ? ' 😇' : '');
    const freeTag = state.freeBrokMemberId === m.id ? ' 🎫' : '';
    const streak = streaks[m.id] || 0;
    let sub;
    if(state.freeBrokMemberId === m.id) sub = 'Har dagens gratis brok';
    else if(isTop) sub = 'TopBrokker i dag';
    else if(isLeast) sub = 'Helgenen i dag 😇';
    else if(streak > 0) sub = `🔥 ${streak} dag${streak===1?'':'e'} uden brok`;
    else sub = titleFor(amt);
    return `<div class="bal-row"><div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(m.name)}</div><div class="feed-body"><div class="bal-name ${profile && m.id===profile.memberId?'me':''}">${escapeHtml(m.name)}${crown}${freeTag}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${sub}</div></div><div class="bal-amt ${amt===0?'zero':''}">${amt}€</div></div>`;
  }).join('');

  main.innerHTML = spotlightCards(bal) + `<div class="section-label">💸 Dagens regnskab</div>` + rows;
}
function renderAllTimeHistory(main){
  const totals = allTimeTotals();
  const totalValues = Object.values(totals);
  const maxTotal = Math.max(0, ...totalValues);
  const minTotal = totalValues.length ? Math.min(...totalValues) : 0;
  const anyTotal = maxTotal > 0;
  const chart = anyTotal ? (
    spotlightCards(totals) +
    `<div class="section-label">Alle medlemmer — alle tider</div>` +
    state.members.filter(m=>!m.isBot).sort((a,b)=>totals[b.id]-totals[a.id]).map(m=>{
      const amt = totals[m.id]||0;
      const isTop = amt > 0 && amt === maxTotal;
      const isLeast = maxTotal > minTotal && amt === minTotal;
      const pct = amt > 0 ? Math.max(6, Math.round(amt/maxTotal*100)) : 0;
      const badge = isTop ? ' 🏆' : (isLeast ? ' 😇' : '');
      return `<div class="bar-row"><div class="avatar" style="width:30px;height:30px;font-size:11px;">${initials(m.name)}</div><div class="bar-track"><div class="bar-fill ${isTop?'top':''}" style="width:${pct}%;"></div></div><div class="bar-amt">${amt}€${badge}</div></div>`;
    }).join('')
  ) : '';

  if(!state.history.length){
    // Kun vis den STORE tomme-tilstand hvis der reelt intet er at vise
    // overhovedet (heller ikke et igangværende regnskab) — ellers virkede
    // det modsigende at vise et rigtigt regnskab foroven og "ingen data
    // endnu" lige nedenunder. Med data foroven er en lille fodnote nok.
    main.innerHTML = anyTotal
      ? chart + `<p class="hint" style="text-align:center; margin-top:14px;">📜 Det er den aktive pulje ovenfor — der kommer en "dag for dag"-historik her, når I trykker 💶 "Gør op" første gang.</p>`
      : chart + `<div class="empty-state"><span class="emoji">📜</span><b>Ingen brok registreret endnu</b>Så snart nogen brokker sig, vises regnskabet her.</div>`;
    return;
  }
  const days = `<div class="section-label" style="margin-top:${anyTotal?22:0}px;">🗓️ Dag for dag</div>` + [...state.history].reverse().map(r=>{
    // Filtreret her (ikke kun ved kilden i settleRound) så allerede
    // arkiverede runder fra FØR dette fix også vises korrekt.
    const lines = Object.entries(r.totals).filter(([id])=>{
      const m = state.members.find(x=>x.id===id);
      return !m || !m.isBot;
    }).sort((a,b)=>b[1]-a[1]).map(([id,amt])=>{
      const m = state.members.find(x=>x.id===id);
      return `<div class="hr-line"><span>${escapeHtml(m?m.name:'?')}</span><span>${amt}€</span></div>`;
    }).join('');
    const start = new Date(r.startedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    const end = new Date(r.closedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    return `<div class="history-round"><div class="hr-title">${r.total}€ i alt</div><div class="hr-sub">${start} – ${end} · ${r.events.length} brok</div>${lines}</div>`;
  }).join('');
  main.innerHTML = chart + days;
}

function openSheet(html, onOpen){
  let backdrop = document.getElementById('sheetBackdrop');
  if(backdrop) backdrop.remove();
  backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'sheetBackdrop';
  backdrop.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>${html}</div>`;
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) closeSheet(); });
  document.body.appendChild(backdrop);
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  bindSheetSwipe(backdrop.querySelector('.sheet'));
  if(onOpen) onOpen();
}
function bindSheetSwipe(sheetEl){
  let startY = null, currentY = 0, dragging = false;
  sheetEl.addEventListener('touchstart', e=>{
    if(sheetEl.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    dragging = false;
  }, { passive:true });
  sheetEl.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || sheetEl.scrollTop > 0) return;
    dragging = true;
    currentY = dy;
    sheetEl.style.transition = 'none';
    sheetEl.style.transform = `translateY(${dy}px)`;
  }, { passive:true });
  sheetEl.addEventListener('touchend', ()=>{
    if(dragging){
      if(currentY > 90){
        sheetEl.style.transition = 'transform .2s ease';
        sheetEl.style.transform = 'translateY(100%)';
        setTimeout(closeSheet, 200);
      }else{
        sheetEl.style.transition = '';
        sheetEl.style.transform = '';
      }
    }
    startY = null; dragging = false; currentY = 0;
  }, { passive:true });
}
function closeSheet(){
  const b = document.getElementById('sheetBackdrop');
  if(!b) return;
  b.classList.remove('show');
  setTimeout(()=>b.remove(), 220);
}

function checkFreeBrokReveal(){
  if(!state || !state.freeBrokMemberId || !state.members.length) return;
  const marker = String(state.freeBrokDrawnAt || state.dayBoundary);
  const key = 'bk_lastFreeReveal_' + roomId;
  if(localStorage.getItem(key) === marker) return; // denne trækning er allerede vist
  if(document.getElementById('sheetBackdrop')) return; // vent — prøves igen næste render, når dialogen er lukket
  localStorage.setItem(key, marker); // marker først NU, når vi rent faktisk viser den (undgår at "spise" den uset)
  playFreeBrokDraw();
}

function playFreeBrokDraw(previewWinnerId, isPreview){
  const winner = state.members.find(m=>m.id===(previewWinnerId || state.freeBrokMemberId));
  if(!winner) return;
  const members = state.members;
  const REEL_H = 58;

  function buildStrip(){
    const n = 14 + Math.floor(Math.random()*4);
    const syms = [];
    for(let i=0;i<n;i++) syms.push(members[Math.floor(Math.random()*members.length)]);
    syms.push(winner); // sidste symbol i strimlen — det reel'en lander på
    return syms;
  }

  const reels = [buildStrip(), buildStrip(), buildStrip()];
  const reelsHtml = reels.map((syms,ri)=>`
    <div class="reel"><div class="reel-strip" id="reelStrip${ri}">
      ${syms.map(m=>`<div class="reel-symbol"><div class="avatar">${initials(m.name)}</div></div>`).join('')}
    </div></div>
  `).join('');

  openSheet(`
    <div style="text-align:center; padding:4px 0 6px;">
      <div id="slotBanner" class="slot-banner">🎰 DAGENS GRATIS BROK${isPreview ? ' (test)' : ''}</div>
      <div class="slot-cabinet" id="slotCabinet">
        <div class="slot-window">${reelsHtml}</div>
        <button class="slot-lever" id="pullLever">🎰 Træk i håndtaget!</button>
        <div class="slot-winner-name" id="slotWinnerName">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
    <button class="sheet-btn ghost" id="drawCloseBtn" style="display:none; margin-top:10px;">Luk</button>
  `, ()=>{
    const cabinet = document.getElementById('slotCabinet');
    const banner = document.getElementById('slotBanner');
    const lever = document.getElementById('pullLever');
    const winnerNameEl = document.getElementById('slotWinnerName');
    const closeBtn = document.getElementById('drawCloseBtn');
    closeBtn.onclick = ()=>{
      closeSheet();
      if(!isPreview) setTimeout(()=>toast(`☀️ Dag ${dayCount()} er skudt i gang — af sted!`), 260);
    };

    if(typeof gsap !== 'undefined'){
      gsap.to(banner, { rotate: 2.5, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    }

    function winConfetti(){
      const rect = cabinet.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + 24;
      const layer = document.createElement('div');
      layer.className = 'confetti';
      document.body.appendChild(layer);
      for(let i=0;i<24;i++){
        const c = document.createElement('div');
        c.textContent = ['🎉','✨','🪙','🎊'][Math.floor(Math.random()*4)];
        c.style.cssText = `position:absolute; left:${cx}px; top:${cy}px; font-size:${14+Math.random()*12}px;`;
        layer.appendChild(c);
        const ang = Math.random()*Math.PI - Math.PI/2 - Math.PI/2; // opad-fan
        const dist = 60 + Math.random()*120;
        if(typeof gsap !== 'undefined'){
          gsap.set(c, { xPercent:-50, yPercent:-50, opacity:1 });
          gsap.to(c, { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist + 40, rotate: Math.random()*360, duration: 0.9+Math.random()*0.4, ease:'power1.out' });
          gsap.to(c, { opacity:0, duration:0.6, delay:0.5 });
        }
      }
      setTimeout(()=>layer.remove(), 1600);
    }

    function onAllStopped(){
      cabinet.classList.add('win');
      winConfetti();
      if(typeof gsap !== 'undefined'){
        gsap.fromTo(winnerNameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      }else{
        winnerNameEl.style.opacity = '1';
      }
      closeBtn.style.display = 'block';
      toast(`🍀 ${winner.name} har dagens gratis brok!`);
    }

    lever.onclick = ()=>{
      lever.disabled = true;
      const durations = [1.0, 1.5, 2.1];
      let doneCount = 0;
      reels.forEach((syms, ri)=>{
        const strip = document.getElementById('reelStrip'+ri);
        const distance = (syms.length-1) * REEL_H;
        const finish = ()=>{ doneCount++; if(doneCount === reels.length) onAllStopped(); };
        if(typeof gsap !== 'undefined'){
          gsap.fromTo(strip, { y: 0 }, { y: -distance, duration: durations[ri], ease: 'power3.out', onComplete: finish });
        }else{
          strip.style.transition = `transform ${durations[ri]}s ease-out`;
          strip.style.transform = `translateY(-${distance}px)`;
          setTimeout(finish, durations[ri]*1000);
        }
      });
    };
  });
}

function bounceJar(){
  const jarSvg = document.querySelector('.jar-svg');
  if(!jarSvg) return;
  const rot = Math.random() * 6 - 3;
  if(typeof gsap === 'undefined'){
    jarSvg.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    jarSvg.style.transform = `scale(1.05) rotate(${rot}deg)`;
    setTimeout(()=>{ jarSvg.style.transform = 'scale(1) rotate(0deg)'; }, 170);
    return;
  }
  gsap.set(jarSvg, { transformOrigin: '50% 100%' });
  gsap.timeline()
    .to(jarSvg, { scale: 1.09, rotate: rot, duration: 0.14, ease: 'power2.out' })
    .to(jarSvg, { scale: 1, rotate: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' });
}

// Konstant, rolig skvulpe-bevægelse i mønt-overfladen — kører videre i baggrunden
let jarIdleTween = null;
function startJarIdleWave(){
  const wave = document.getElementById('waveTop');
  if(!wave) return;
  if(jarIdleTween) jarIdleTween.kill();
  if(typeof gsap === 'undefined') return;
  gsap.set(wave, { x: 0 });
  jarIdleTween = gsap.to(wave, { x: -60, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: -1 });
}

function launchCoinToJar(onDone){
  const jarWrap = document.querySelector('.jar-wrap');
  const rect = jarWrap ? jarWrap.getBoundingClientRect() : null;
  const endX = rect ? rect.left + rect.width/2 : window.innerWidth/2;
  const endY = rect ? rect.top + rect.height*0.62 : window.innerHeight*0.35;
  const startX = window.innerWidth/2;
  const startY = 64;

  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);

  if(typeof gsap === 'undefined'){
    // Fallback uden GSAP, hvis scriptet af en eller anden grund ikke loadede
    layer.remove();
    if(onDone) onDone();
    return;
  }

  const coin = document.createElement('div');
  coin.textContent = '🪙';
  coin.style.cssText = `position:absolute; left:${startX}px; top:${startY}px; font-size:36px; z-index:2;`;
  layer.appendChild(coin);
  gsap.set(coin, { xPercent: -50, yPercent: -50, scale: 0.5, rotate: 0 });

  const impact = () => {
    // lille møntsprøjt ved nedslaget
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.textContent = Math.random() > 0.5 ? '🪙' : '✨';
      const ang = Math.random()*Math.PI*2, dist = 24+Math.random()*46;
      c.style.cssText = `position:absolute; left:${endX}px; top:${endY}px; font-size:${12+Math.random()*10}px;`;
      layer.appendChild(c);
      gsap.set(c, { xPercent: -50, yPercent: -50, scale: 0.6, opacity: 1 });
      gsap.to(c, {
        x: Math.cos(ang)*dist, y: Math.sin(ang)*dist - 18, rotate: Math.random()*360, scale: 1,
        duration: 0.6, ease: 'power2.out',
      });
      gsap.to(c, { opacity: 0, duration: 0.5, delay: 0.25 });
    }
    // krukken "hopper" ved nedslaget
    const jarSvg = document.querySelector('.jar-svg');
    if(jarSvg){
      gsap.set(jarSvg, { transformOrigin: '50% 100%' });
      gsap.timeline()
        .to(jarSvg, { scale: 1.09, y: 2, duration: 0.16, ease: 'power2.out' })
        .to(jarSvg, { scale: 1, y: 0, duration: 0.65, ease: 'elastic.out(1, 0.4)' });
    }
    if(onDone) onDone();
  };

  gsap.timeline()
    .to(coin, { left: endX, top: endY, scale: 1.15, rotate: 480, duration: 0.7, ease: 'power2.in' })
    .to(coin, { opacity: 0, duration: 0.2 }, '-=0.05')
    .add(impact);

  setTimeout(()=>layer.remove(), 1500);
}

/* ============ TRÆK-NED-FOR-AT-OPDATERE ============ */
(function setupPullToRefresh(){
  const THRESHOLD = 70;
  let startY = null, pulling = false, indicator = null;

  function ensureIndicator(){
    if(indicator) return indicator;
    indicator = document.createElement('div');
    indicator.style.cssText = 'position:fixed; top:10px; left:50%; transform:translateX(-50%) scale(.6); opacity:0; z-index:90; width:34px; height:34px; border-radius:50%; background:rgba(255,247,232,0.95); display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.25);';
    indicator.textContent = '🔄';
    document.body.appendChild(indicator);
    return indicator;
  }
  function reset(){
    if(indicator){ indicator.style.opacity = '0'; indicator.style.transform = 'translateX(-50%) scale(.6)'; }
    startY = null; pulling = false;
  }

  document.addEventListener('touchstart', e=>{
    const main = document.getElementById('main');
    if(!main || !roomId || main.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive:true });

  document.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const main = document.getElementById('main');
    if(!main || main.scrollTop > 0) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0) return;
    pulling = true;
    const ind = ensureIndicator();
    const pull = Math.min(dy, 120);
    ind.style.transition = 'none';
    ind.style.opacity = Math.min(1, pull / THRESHOLD);
    ind.style.transform = `translateX(-50%) translateY(${Math.min(pull,60)}px) scale(${0.6 + Math.min(pull/THRESHOLD,1)*0.4}) rotate(${pull*2}deg)`;
  }, { passive:true });

  document.addEventListener('touchend', ()=>{
    if(pulling && indicator){
      indicator.style.transition = 'opacity .2s, transform .2s';
      const pulledEnough = parseFloat(indicator.style.opacity || '0') >= 1;
      if(pulledEnough){
        indicator.textContent = '⏳';
        refreshState(true).finally(()=>{ reset(); setTimeout(()=>{ if(indicator) indicator.textContent = '🔄'; }, 300); });
        return;
      }
    }
    reset();
  }, { passive:true });
})();

/* ============ INIT ============ */
boot();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // Tjek for opdatering med det samme ved åbning, ikke kun når appen senere
    // kommer i forgrunden igen — ellers kræver en opdatering altid mindst én
    // baggrund/forgrund-cyklus efter en frisk åbning, før den overhovedet
    // opdages.
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          toast('🔄 Ny version klar — opdaterer...');
          setTimeout(()=>location.reload(), 900);
        }
      });
    });
  }).catch(()=>{});
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed) return;
    swRefreshed = true;
    location.reload();
  });
}
