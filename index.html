function renderWhoAmI(justCreated){
  app.innerHTML = `
    <div class="onboard">
      <div class="emoji">👋</div>
      <h1>Hvem er du?</h1>
      <p>${justCreated ? `${escapeHtml(state.themeName || 'Brokkekassen')} er oprettet! Skriv dit navn, så er du med.` : `Skriv dit navn for at komme ind i ${escapeHtml((state.themeName || 'Brokkekassen').toLowerCase())}.`} Ingen adgangskode nødvendig.</p>
      ${homeScreenTip(true)}
      <div class="onboard-card">
        <label class="field-label" style="color:rgba(255,247,232,0.6);">Dit navn</label>
        <input type="text" id="nameInput" placeholder="Fx Martin" maxlength="24" value="${escapeHtml(getSavedIdentity().name)}" />
        <label class="field-label" style="color:rgba(255,247,232,0.6);">E-mail (valgfri)</label>
        <input type="email" id="emailInput" placeholder="til fx afregning" maxlength="80" value="${escapeHtml(getSavedIdentity().email)}" />
        <button class="sheet-btn primary" id="joinBtn">Fortsæt</button>
      </div>
      ${justCreated ? `
        <div class="divider">del med familien</div>
        <div class="onboard-card" style="text-align:center;">
          <p style="margin:0 0 2px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:rgba(5,32,36,0.4);">Jeres kode</p>
          <div id="codeBox" style="cursor:pointer; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:34px; letter-spacing:.04em; color:var(--sea); padding:6px 0 2px;">${roomId}</div>
          <p style="margin:0 0 14px; font-size:12.5px; color:rgba(5,32,36,0.5);">De andre indtaster koden under "Har du fået et link?"</p>
          <button class="sheet-btn ghost" id="copyBtn" style="margin-top:0;">📤 Del link i stedet</button>
        </div>
      ` : ''}
    </div>
  `;
  const nameInput = document.getElementById('nameInput');
  nameInput.focus();
  if(nameInput.value) nameInput.select();
  const go = async ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    const email = document.getElementById('emailInput').value.trim();
    document.getElementById('joinBtn').innerHTML = '<span class="spinner"></span>';
    try{
      const r = await api('room', { action: 'join', roomId, name, email });
      if(r.pending){
        saveIdentity(name, email);
        renderAwaitingApproval(r.pendingId, name);
        return;
      }
      profile = { memberId: r.memberId, name };
      localStorage.setItem('bk_profile_' + roomId, JSON.stringify(profile));
      localStorage.setItem('bk_lastRoom', roomId);
      saveIdentity(name, email);
      rememberRoom();
      state = r.state;
      if(!state.kasseEnabled && state.gameEnabled) activeApp = 'spil';
      else if(!state.kasseEnabled && !state.gameEnabled && state.mrbrokEnabled) activeApp = 'mrbrok';
      else if(!state.kasseEnabled && !state.gameEnabled && !state.mrbrokEnabled && state.complainerEnabled) activeApp = 'complainer';
      else if(state.kasseEnabled) activeApp = 'kasse';
      render();
      startPolling();
      if(justCreated) setTimeout(showRoomIntroSplash, 300);
    }catch(e){ toast('Kunne ikke fortsætte: ' + e.message); document.getElementById('joinBtn').textContent = 'Fortsæt'; }
  };
  document.getElementById('joinBtn').onclick = go;
  nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); }});
  if(justCreated){
    document.getElementById('copyBtn').onclick = doShare;
    document.getElementById('codeBox').onclick = ()=>{
      navigator.clipboard.writeText(roomId).then(()=>toast('Kode kopieret! 🔢')).catch(()=>prompt('Kopiér koden manuelt:', roomId));
    };
  }
}

// Kasse-motor-generalisering, operationelt "adgang"-valg
// (accessModel:'approval', se KASSEMOTORPLAN.md): vises mens man venter på
// værtens/medværtens godkendelse (se api/room.js's join-handler + api/
// admin.js's approveMember). Poller samme state-endpoint som resten af
// appen, med det ventende id som "member" — genkendes som medlem i det
// øjeblik admin godkender (samme id genbruges, se admin.js).
function renderAwaitingApproval(pendingId, name){
  app.innerHTML = `
    <div class="onboard">
      <div class="emoji">⏳</div>
      <h1>Venter på godkendelse</h1>
      <p>Hej ${escapeHtml(name)}! Værten skal lige godkende dig, før du kommer ind. Denne skærm opdaterer automatisk.</p>
    </div>
  `;
  const poll = setInterval(async ()=>{
    try{
      const { state: s } = await api('state?room=' + encodeURIComponent(roomId) + '&member=' + encodeURIComponent(pendingId));
      if(s.members.find(m=>m.id===pendingId)){
        clearInterval(poll);
        profile = { memberId: pendingId, name };
        localStorage.setItem('bk_profile_' + roomId, JSON.stringify(profile));
        localStorage.setItem('bk_lastRoom', roomId);
        rememberRoom();
        state = s;
        if(!state.kasseEnabled && state.gameEnabled) activeApp = 'spil';
        else if(!state.kasseEnabled && !state.gameEnabled && state.mrbrokEnabled) activeApp = 'mrbrok';
        else if(!state.kasseEnabled && !state.gameEnabled && !state.mrbrokEnabled && state.complainerEnabled) activeApp = 'complainer';
        else if(state.kasseEnabled) activeApp = 'kasse';
        render();
        startPolling();
      }
    }catch(e){ /* stille — prøver bare igen ved næste poll */ }
  }, 4000);
}

// Vises PRÆCIS én gang pr. rum, lige efter rummets opretter selv er kommet
// ind første gang (se justCreated i go()-handleren ovenfor) — forklarer kort
// hvor mange ting der reelt bor i samme rum, og at man skifter mellem dem
// via ☰-menuen, så det ikke skal opdages ved et tilfælde. Samme
// splash-mønster som mrbrok/complainer's egne (se .room-splash-backdrop),
// bare i rummets neutrale sea/coin-farvevej i stedet for et enkelt spils tema.
function showRoomIntroSplash(){
  if(!roomId) return;
  const seenKey = 'bk_seen_room_intro_' + roomId;
  if(localStorage.getItem(seenKey)) return;
  localStorage.setItem(seenKey, '1');

  const items = [];
  const gn = state.gameNames || {};
  if(state.kasseEnabled) items.push(['🫙', state.themeName || 'Brokkekassen', `Fælles regnskab — ${state.ruleTagline ? state.ruleTagline.charAt(0).toLowerCase()+state.ruleTagline.slice(1) : 'brok dig, og det koster en krone i puljen'}`]);
  if(state.gameEnabled) items.push(['👉', gn.spil || 'Brokspillet', 'Hurtige quiz- og afstemningsrunder I spiller sammen']);
  if(state.mrbrokEnabled) items.push(['🕵️', gn.mrbrok || 'MrBrok', `Find den skjulte ${gn.mrbrok || 'MrBrok'}, før de andre bliver afsløret`]);
  if(state.complainerEnabled) items.push(['🪤', gn.complainer || 'Det Store Brokkeri', 'Brok dig i karakter — men ingen ved endnu hvem der er skyldig']);
  if(items.length < 2) return; // ingen grund til at forklare "skift mellem" hvis der kun er én ting valgt

  const backdropHtml = `<div class="room-splash-backdrop" id="roomSplashBackdrop"><div class="room-splash" id="roomSplashInner"></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('roomSplashBackdrop');
  const inner = document.getElementById('roomSplashInner');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });

  inner.innerHTML = `
    <div style="font-size:52px;">🎉</div>
    <h3>Jeres rum er klar!</h3>
    <p>I har ${items.length} ting samlet i ét og samme rum:</p>
    <ul>
      ${items.map(([icon,name,desc])=>`<li><span>${icon}</span><span><b>${name}</b> — ${desc}</span></li>`).join('')}
    </ul>
    <p style="margin-bottom:14px;">Skift mellem dem når som helst via <b>☰</b>-menuen øverst til højre.</p>
    <button class="sheet-btn primary" id="roomSplashCloseBtn" style="margin-top:0;">Forstået, lad os gå i gang!</button>
  `;
  document.getElementById('roomSplashCloseBtn').onclick = close;
}

/* ============ MAIN RENDER ============ */
function totalPool(){ return state.events.filter(e=>!e.free && !e.voided).length; }
// Alle nuværende (endnu ikke afregnede) brok — kan sagtens strække sig over flere dage.
function balances(){
  const map = {}; state.members.filter(m=>!m.isBot).forEach(m=>map[m.id]=0);
  state.events.forEach(e=>{ if(!e.free && !e.voided && map[e.memberId]!==undefined) map[e.memberId]++; });
  return map;
}
// Kun dagens brok (siden kl. 04), til "Dagens BigSpender".
function todayBalances(){
  const map = {}; state.members.filter(m=>!m.isBot).forEach(m=>map[m.id]=0);
  state.events.forEach(e=>{ if(!e.free && !e.voided && e.ts >= state.dayBoundary && map[e.memberId]!==undefined) map[e.memberId]++; });
  return map;
}

/* ============ BOT-TESTSPIL ============ */
// Lader admin teste Brokspillet/MrBrok solo: 3 bot-medlemmer tilføjes til
// rummet og spiller automatisk deres egne ture (kort tilfældig forsinkelse,
// så det ikke føles helt mekanisk) — admin skal kun styre sin EGEN tur og
// kan følge alle skridt undervejs, ligegyldigt hvem der ender med at vinde.
const BOT_NAMES = ['🤖 Bot Anna', '🤖 Bot Bo', '🤖 Bot Cille'];
const BOT_FILLER_ANSWERS = ['Det er da til at grine ad, ærlig talt', 'Nogen må gøre noget ved det snart', 'Sker hver eneste gang, uden undtagelse', 'Ked af at sige det, men sådan er det bare', 'Ren galskab, hver evig eneste gang'];
const BOT_FILLER_WORDS = ['regnvejr', 'morgenmad', 'myggestik', 'trafikkø', 'snorken'];
const BOT_FILLER_STATEMENTS = ['Jeg har prøvet det tre gange i denne uge', 'Det skete faktisk i går aftes', 'Alle andre vidste det, bare ikke mig'];
const BOT_FILLER_COMPLIMENTS = ['Du er altid god til at få humøret op igen', 'Du lytter bedre end de fleste jeg kender', 'Du finder altid en løsning, uanset hvad'];
function pickBotFiller(list){ return list[Math.floor(Math.random()*list.length)]; }
function isBotMember(id){ const mm = state.members.find(m=>m.id===id); return !!(mm && mm.isBot); }

async function ensureTestBots(){
  for(const name of BOT_NAMES){
    try{
      const r = await api('room', { action:'join', roomId, name, isBot:true });
      if(r && r.state) state = r.state;
    }catch(e){ /* en fejlet bot-oprettelse må ikke stoppe resten */ }
  }
}

async function startBotTestGame(kind){
  closeSheet();
  toast('🤖 Tilføjer bot-spillere...');
  await ensureTestBots();
  const botIds = state.members.filter(m=>m.isBot).map(m=>m.id);
  const playerIds = [profile.memberId, ...botIds];
  botAutoplay = true;
  botTestStartedAt = Date.now();
  if(kind === 'game') await gameApi('start', { wager:'fun', playerIds, totalRounds:5 });
  else if(kind === 'mrbrok') await mrbrokApi('start', { wager:'fun', playerIds, warmupRounds:2 });
  else await complainerApi('start', { wager:'fun', playerIds, totalRounds:3 });
  toast('🤖 Bots spiller automatisk — du styrer kun din egen tur');
}

function scheduleBotOnce(key, fn, delayMs){
  if(botScheduledKeys.has(key)) return;
  botScheduledKeys.add(key);
  setTimeout(()=>{ botScheduledKeys.delete(key); fn(); }, delayMs);
}

// Botterne skal virke som om de rent faktisk "tænker sig om" én ad gangen,
// ikke svare alle på samme tid — ellers ser man kun et glimt af en fase, før
// den allerede er slået om til resultater. Hver bot i samme fase får derfor
// sin egen tur i køen (index i-baseret trin) i stedet for alle på samme
// tilfældige 0.9-2.7s vindue.
function botActionDelay(indexInPhase){
  return 1600 + indexInPhase * 2200 + Math.random() * 1400;
}

// MrBrok-runder viser et EMNE-kort man skal nå at læse (og ved clue-fasen:
// alles clues indtil videre) FØR det er ens egen tur — 1.6s var rigeligt
// hurtigt til at bottene allerede var i gang, mens man stadig sad og læste.
// Fem sekunders bund-forsinkelse for FØRSTE bot giver reel læsetid.
function mrbrokBotActionDelay(indexInPhase){
  return 5000 + indexInPhase * 2200 + Math.random() * 1400;
}

// Botterne må aldrig løbe i gang mens man stadig sidder og læser
// admin-menuen/rolle-splashen lige efter man har trykket "test-spil med
// bots" — så uanset hvilken fase-forsinkelse der ellers ville gælde, er der
// et fælles gulv på 10s fra selve admin-klikket, kun ved allerførste fase.
function botStartGraceRemaining(){
  if(!botTestStartedAt) return 0;
  return Math.max(0, botTestStartedAt + 10000 - Date.now());
}

async function botSubmit(kind, actorId, payload){
  try{
    const r = await api(kind, { action:'submit', roomId, actorId, payload });
    if(r && r.state){ state = r.state; render(); }
  }catch(e){ /* prøves automatisk igen ved næste render, hvis stadig pending */ }
}
async function botReady(actorId){
  try{
    const r = await api('game', { action:'ready', roomId, actorId });
    if(r && r.state){ state = r.state; render(); }
  }catch(e){}
}

function driveBotsIfNeeded(){
  if(!botAutoplay || !state) return;
  // Kaldes fra render()'s allerførste linje ved HVER eneste gen-tegning —
  // en uventet fejl her (fx en runde-type/felt-kombination der ikke er
  // dækket endnu) må ALDRIG vælte selve render()-kaldet, for så ville hele
  // appen fryse midt i et almindeligt spil med rigtige spillere, bare fordi
  // et bot-testspil kørte ved siden af tidligere i samme fane.
  try{
    if(state.game && state.game.active && state.game.current) driveBotsForGame(state.game);
    if(state.mrbrok && state.mrbrok.active && state.mrbrok.current) driveBotsForMrbrok(state.mrbrok);
    if(state.complainer && state.complainer.active && state.complainer.current) driveBotsForComplainer(state.complainer);
  }catch(e){ console.error('driveBotsIfNeeded fejlede (ufarligt, prøves igen ved næste render):', e); }
}

function driveBotsForGame(g){
  const cur = g.current;
  if(!cur || cur.type === 'gameover') return;
  const phaseKey = g.round + ':' + cur.type + ':' + (cur.phase||'');
  const pending = getPendingIdsClient(cur, g.players||[]);
  pending.filter(isBotMember).forEach((botId,i)=>{
    scheduleBotOnce('game:'+phaseKey+':'+botId, ()=>runGameBotAction(cur, botId), Math.max(botActionDelay(i), botStartGraceRemaining()));
  });
}

async function runGameBotAction(cur, botId){
  if(cur.phase === 'results' || cur.phase === 'skipped') return botReady(botId);
  if(cur.type === 'quiplash' && cur.phase === 'answer') return botSubmit('game', botId, { text: pickBotFiller(BOT_FILLER_ANSWERS) });
  if(cur.type === 'quiplash' && cur.phase === 'vote'){
    const options = [...Object.keys(cur.answers||{}).filter(id=>id!==botId), ...(cur.decoys||[]).map(d=>d.id)];
    if(!options.length) return;
    return botSubmit('game', botId, { votedFor: pickBotFiller(options) });
  }
  if(cur.type === 'truefalse' && cur.phase === 'write'){
    const players = state.game.players || [];
    return botSubmit('game', botId, { targetId: pickBotFiller(players), statement: pickBotFiller(BOT_FILLER_STATEMENTS), isTrue: Math.random() < 0.5 });
  }
  if(cur.type === 'truefalse' && cur.phase === 'guess') return botSubmit('game', botId, { guess: Math.random() < 0.5 });
  if(cur.type === 'trivia' && cur.phase === 'answer') return botSubmit('game', botId, { choiceIndex: Math.floor(Math.random()*4) });
  if(cur.type === 'guessbrok' && cur.phase === 'write') return botSubmit('game', botId, { statement: pickBotFiller(BOT_FILLER_STATEMENTS) });
  if(cur.type === 'guessbrok' && cur.phase === 'guess'){
    const n = (cur.options||[]).length || 4;
    return botSubmit('game', botId, { choiceIndex: Math.floor(Math.random()*n) });
  }
  if(cur.type === 'casinobrok' && cur.phase === 'write') return botSubmit('game', botId, { word: pickBotFiller(BOT_FILLER_WORDS) });
  if(cur.type === 'casinobrok' && cur.phase === 'bet') return botSubmit('game', botId, { choice: Math.random() < 0.5 ? 'gamble' : 'safe' });
  if(cur.type === 'rose' && cur.phase === 'write') return botSubmit('game', botId, { compliment: pickBotFiller(BOT_FILLER_COMPLIMENTS) });
  if(cur.type === 'rose' && cur.phase === 'match'){
    const targets = cur.targets || {};
    const recipientIds = Object.keys(targets).map(a=>targets[a]);
    const authorIds = Object.keys(targets);
    const guesses = {};
    recipientIds.forEach(rid=>{ guesses[rid] = pickBotFiller(authorIds); });
    return botSubmit('game', botId, { guesses });
  }
}

function driveBotsForMrbrok(m){
  const cur = m.current;
  if(!cur || cur.type === 'gameover') return;
  const phaseKey = m.round + ':' + cur.type + ':' + (cur.turnIndex !== undefined ? cur.turnIndex : '');
  const pending = getPendingMrbrokIdsClient(m, cur);
  pending.filter(isBotMember).forEach((botId,i)=>{
    scheduleBotOnce('mrbrok:'+phaseKey+':'+botId, ()=>runMrbrokBotAction(m, cur, botId), Math.max(mrbrokBotActionDelay(i), botStartGraceRemaining()));
  });
}

async function runMrbrokBotAction(m, cur, botId){
  if(cur.type === 'clue') return botSubmit('mrbrok', botId, {});
  if(cur.type === 'vote'){
    const options = (m.activeIds||[]).filter(id=>id!==botId);
    if(!options.length) return;
    return botSubmit('mrbrok', botId, { votedForId: pickBotFiller(options) });
  }
  if(cur.type === 'steal' && !cur.guess) return botSubmit('mrbrok', botId, { guess: pickBotFiller(BOT_FILLER_STATEMENTS) });
  if(cur.type === 'steal' && cur.guess) return botSubmit('mrbrok', botId, { closeEnough: Math.random() < 0.5 });
}

// Samme begrænsning som getPendingMrbrokIdsClient: guiltyId er ALTID
// maskeret client-side (se redactComplainerFor), også for bot-testspil, så
// et bot-forsøg på at gætte/dømme når det ikke er relevant for dem fejler
// bare stille (botSubmit sluger fejlen) — spillet rykker alligevel videre
// via server-timeouten hvis ingen bot rammer rigtigt. Kun brugt til
// bot-autoplay, IKKE til at afgøre hvad der reelt vises for et rigtigt menneske.
function getPendingComplainerIdsClient(c, cur){
  if(!cur || !c.players) return [];
  if(cur.type === 'complain') return [cur.speakerId];
  if(cur.type === 'interrogation') return [cur.speakerId];
  if(cur.type === 'vote') return c.players.filter(id=>!(cur.votes && cur.votes[id] !== undefined));
  if(cur.type === 'bet') return cur.choice ? [] : [cur.topId];
  if(cur.type === 'guess') return cur.targetId ? [] : (c.youAreGuilty && profile ? [profile.memberId] : c.players.slice());
  if(cur.type === 'judge') return c.players.filter(id=>!(cur.votes && cur.votes[id] !== undefined));
  return [];
}

function driveBotsForComplainer(c){
  const cur = c.current;
  if(!cur || cur.type === 'gameover') return;
  const phaseKey = cur.round + ':' + cur.type + ':' + (cur.turnIndex !== undefined ? cur.turnIndex : '');
  const pending = getPendingComplainerIdsClient(c, cur);
  pending.filter(isBotMember).forEach((botId,i)=>{
    scheduleBotOnce('complainer:'+phaseKey+':'+botId, ()=>runComplainerBotAction(c, cur, botId), Math.max(mrbrokBotActionDelay(i), botStartGraceRemaining()));
  });
}

async function runComplainerBotAction(c, cur, botId){
  // Broksene siges højt ved bordet — bottens "handling" er bare at
  // bekræfte sin tur er ovre, samme mønster som MrBrok's clue-fase
  // (runMrbrokBotAction's cur.type === 'clue' gren).
  if(cur.type === 'complain') return botSubmit('complainer', botId, {});
  // Spørgerunden efter afsløringen — bottens "svar" er, ligesom brok-fasen,
  // bare en bekræftelse af at turen er ovre, intet reelt indhold at generere.
  if(cur.type === 'interrogation') return botSubmit('complainer', botId, {});
  if(cur.type === 'vote'){
    const options = (c.players||[]).filter(id=>id!==botId);
    if(!options.length) return;
    return botSubmit('complainer', botId, { votedForId: pickBotFiller(options) });
  }
  if(cur.type === 'bet' && cur.topId === botId) return botSubmit('complainer', botId, { choice: Math.random() < 0.5 ? 'gamble' : 'safe' });
  if(cur.type === 'guess' && c.youAreGuilty){
    const options = (c.players||[]).filter(id=>id!==botId);
    if(!options.length) return;
    return botSubmit('complainer', botId, { targetId: pickBotFiller(options), detail: pickBotFiller(BOT_FILLER_STATEMENTS) });
  }
  if(cur.type === 'judge') return botSubmit('complainer', botId, { closeEnough: Math.random() < 0.5 });
}

// Enhver af de MANGE ting der kalder render() (eget svar, en andens svar
// via poll, en bot der handler, en klar-markering...) bygger HELE
// app.innerHTML om fra bunden. Uden dette ville en igangværende skrive-fase
// miste fokus (og tastaturet lukke) i det øjeblik NOGEN ANDEN gjorde noget —
// selv når man endnu ikke var gået i gang med at skrive, bare stod og
// læste/tænkte med feltet fokuseret. Endnu værre: da skrivefelter altid
// starter tomme ved gen-render (de viser kun ens EGET indsendte svar, og man
// har jo ikke indsendt endnu), forsvandt alt man havde nået at skrive også.
// Redder derfor fokuseret felt + dets nuværende værdi/markør før hvert
// gen-render, og lægger dem tilbage bagefter hvis samme felt (samme id)
// stadig findes i den nye DOM.
function render(){
  const activeEl = document.activeElement;
  let savedFocus = null;
  if(activeEl && activeEl.id && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'INPUT') && app.contains(activeEl)){
    savedFocus = { id: activeEl.id, value: activeEl.value, selStart: activeEl.selectionStart, selEnd: activeEl.selectionEnd };
  }
  renderInner();
  if(savedFocus){
    const el = document.getElementById(savedFocus.id);
    if(el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') && !el.disabled){
      if(!el.value) el.value = savedFocus.value;
      el.focus();
      try{ el.setSelectionRange(savedFocus.selStart, savedFocus.selEnd); }catch(e){}
    }
  }
}
function renderInner(){
  driveBotsIfNeeded();
  // Forsvar mod at stå i en visning der er slået fra i dette rum.
  if(activeApp === 'spil' && !state.gameEnabled) activeApp = 'kasse';
  if(activeApp === 'mrbrok' && !state.mrbrokEnabled) activeApp = 'kasse';
  if(activeApp === 'complainer' && !state.complainerEnabled) activeApp = 'kasse';
  if(activeApp === 'kasse' && !state.kasseEnabled) activeApp = state.gameEnabled ? 'spil' : (state.mrbrokEnabled ? 'mrbrok' : (state.complainerEnabled ? 'complainer' : 'kasse'));
  // Det mørke "efterforskningslokale" gælder nu HELE MrBrok — både lobby og
  // selve spillet, ikke kun før det starter. Skiftede tilbage til det
  // fælles teal midt i spillet gjorde det svært at se det som "sit eget"
  // spil (matcher heller ikke rolle-splashens mørke/guld look). Det Store
  // Brokkeri får sin EGEN varme ember-nuance (theme-complainer) i stedet
  // for at genbruge MrBroks kølige noir — de to spil skal ikke se ud af
  // samme familie, selvom begge er mørke temaer med en afsløring i sig.
  const isMrbrokTheme = activeApp === 'mrbrok';
  const isComplainerTheme = activeApp === 'complainer';
  // Rose-runden skal tydeligt IKKE ligne resten af Brokspillet mens den
  // står på — se CSS-kommentaren ved html.theme-rose. Kun aktiv præcis så
  // længe den aktuelle runde faktisk ER type 'rose', falder automatisk
  // tilbage til det fælles teal så snart runden er slut.
  const isRoseTheme = activeApp === 'spil' && state.game && state.game.active && state.game.current && state.game.current.type === 'rose';
  // Klassen sættes på <html>, ikke <body> — se CSS-kommentaren ved
  // html{background:...} for hvorfor det er html's baggrund der tæller.
  document.documentElement.classList.toggle('theme-mrbrok', isMrbrokTheme);
  document.documentElement.classList.toggle('theme-complainer', isComplainerTheme);
  document.documentElement.classList.toggle('theme-rose', isRoseTheme);
  // OS-statusbaren (og browserens egen UI-chrome) males IKKE af sidens CSS —
  // den bruger kun den statiske <meta theme-color>-værdi, som ellers stod
  // fast på teal uanset skærm. Det gav en hård søm øverst hver gang MrBroks
  // mørke baggrund var aktiv (teal statusbar oven på en næsten sort side),
  // og en mindre men stadig synlig søm på Brokkekassen/Brokspillet fordi den
  // faste farve var mørkere end selve gradientens top. Matcher den nu til
  // den farve der rent faktisk er øverst i den aktive baggrund.
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');
  if(themeColorMeta) themeColorMeta.setAttribute('content', isMrbrokTheme ? '#0A1416' : (isComplainerTheme ? '#2A0F08' : (isRoseTheme ? '#3a1530' : '#12666b')));
  if(activeApp === 'spil') return renderGameScreen();
  if(activeApp === 'mrbrok') return renderMrbrokScreen();
  if(activeApp === 'complainer') return renderComplainerScreen();
  const prevMain = document.getElementById('main');
  const savedMainScroll = prevMain ? prevMain.scrollTop : 0;
  const savedWindowScroll = window.scrollY;
  const total = totalPool();
  const fillPct = Math.min(100, total * 4);

async function gameApi(action, extra){
  // Bot-autoplay er scoped til ÉT testspil ad gangen — når spillet afsluttes
  // (manuelt eller genstartet fra admin), slukkes det igen, så det ikke ved
  // et uheld bliver ved med at styre bot-medlemmer ind i et senere rigtigt
  // spil med rigtige venner uden at nogen bad om det.
  if(action === 'end') botAutoplay = false;
  try{
    const r = await api('game', Object.assign({ action, roomId, actorId: profile.memberId }, extra||{}));
    state = r.state;
    render();
  }catch(e){
    if(e.message === 'ugyldig handling lige nu'){
      // Denne fejl betyder ALTID at runden nåede at rykke videre (fx pga.
      // en brok-nedtælling) i det korte vindue mellem at skærmen blev
      // tegnet og at man nåede at trykke — klientens lokale visning er
      // dermed forældet. Uden dette stod man bare med en kryptisk
      // fejlbesked og en død skærm, og ens indtastede svar så ud til at
      // "forsvinde" uden forklaring. Hent frisk state med det samme i
      // stedet, så skærmen viser hvad der RENT FAKTISK sker nu.
      toast('🔄 Runden nåede at gå videre — opdaterer...');
      await refreshState(false);
    } else {
      toast(e.message);
    }
  }
}

// Der er IKKE længere nogen ambient nedtælling der selv trykker "gå videre"
// — kun serveren afgør timing (se expireGamePhaseIfDue i api/_lib/gameFlow.js),
// og kun som en synlig konsekvens af et brok (menneske eller Brokspillet),
// aldrig stille. Det eneste der tælles ned her, er visningen af en AKTIV
// brok-nedtælling — ren kosmetik, udløser aldrig selv noget.
const MIN_COMPLAIN_AGE_MS = 30000;
const COMPLAINT_COUNTDOWN_MS = 12000;
// MrBrok er mere snak-tungt end Brokspillet — se samme konstant server-side
// i api/_lib/mrbrokFlow.js. Skal matche PRÆCIS, ellers tæller klienten ned
// til et andet tidspunkt end serveren rent faktisk tvinger videre på.
const MRBROK_COMPLAINT_COUNTDOWN_MS = 30000;

function getPendingIdsClient(cur, players){
  if(!cur) return [];
  if(cur.phase === 'results' || cur.phase === 'skipped') return players.filter(id=>!(cur.readyIds||[]).includes(id));
  if(cur.type === 'quiplash' && cur.phase === 'answer') return players.filter(id=>!(cur.answers && cur.answers[id] !== undefined));
  if(cur.type === 'quiplash' && cur.phase === 'vote') return players.filter(id=>!(cur.votes && cur.votes[id] !== undefined));
  if(cur.type === 'truefalse' && cur.phase === 'write') return cur.authorId ? [cur.authorId] : [];
  if(cur.type === 'truefalse' && cur.phase === 'guess'){
    const eligible = cur.authorId ? players.filter(id=>id!==cur.authorId) : players;
    return eligible.filter(id=>!(cur.guesses && cur.guesses[id] !== undefined));
  }
  if(cur.type === 'trivia' && cur.phase === 'answer') return players.filter(id=>!(cur.choices && cur.choices[id] !== undefined));
  if(cur.type === 'guessbrok' && cur.phase === 'write') return cur.authorId ? [cur.authorId] : [];
  if(cur.type === 'guessbrok' && cur.phase === 'guess') return players.filter(id=>id!==cur.authorId).filter(id=>!(cur.guesses && cur.guesses[id] !== undefined));
  if(cur.type === 'rose' && cur.phase === 'write') return players.filter(id=>cur.compliments && cur.compliments[id] === undefined);
  if(cur.type === 'rose' && cur.phase === 'match') return players.filter(id=>cur.guesses && cur.guesses[id] === undefined);
  if(cur.type === 'casinobrok' && cur.phase === 'write') return players.filter(id=>!(cur.words && cur.words[id] !== undefined));
  if(cur.type === 'casinobrok' && cur.phase === 'bet') return players.filter(id=>!(cur.bets && cur.bets[id] !== undefined));
  return [];
}

// Vises hvor som helst en fase venter på nogen: enten den voksende
// "brok over ..."-knap (kun for spillere der selv allerede er færdige), eller
// selve brok-banneret + nedtælling, når nogen (menneske eller Brokspillet)
// allerede har brokket sig. Ingen tal vises FØR der reelt er brokket over nogen.
function complaintBlockHtml(g, cur){
  if(!cur || !profile || !g.players) return '';
  const pending = getPendingIdsClient(cur, g.players);
  if(!pending.length) return '';
  const myId = profile.memberId;
  if(cur.complaint){
    const byName = cur.complaint.by === 'brokspillet' ? 'Brokspillet' : ((state.members.find(m=>m.id===cur.complaint.by)||{}).name || 'Nogen');
    const targetName = (state.members.find(m=>m.id===cur.complaint.targetId)||{}).name || 'nogen';
    return `
      <div class="complaint-banner">
        <span>${cur.complaint.by === 'brokspillet' ? '🎙️' : '🐌'} <b>${escapeHtml(byName)}</b> brokker sig over at <b>${escapeHtml(targetName)}</b> bruger sin tid</span>
        <span id="complaintCountdown" class="complaint-countdown"></span>
      </div>
    `;
  }
  if(pending.includes(myId)) return ''; // man skal selv være færdig for at kunne brokke sig
  const age = cur.phaseStartedAt ? (Date.now() - cur.phaseStartedAt) : 0;
  if(age < MIN_COMPLAIN_AGE_MS) return '';
  const growth = Math.min(1, (age - MIN_COMPLAIN_AGE_MS) / 30000);
  const targetName = pending.length === 1 ? (state.members.find(m=>m.id===pending[0])||{}).name : null;
  const label = targetName ? `🐌 Brok over ${escapeHtml(targetName)}s tempo` : `🐌 Brok over de langsomme`;
  return `<button class="complain-btn" id="complainBtn" data-target="${pending[0]}" style="transform:scale(${(1+growth*0.16).toFixed(2)}); opacity:${(0.6+growth*0.4).toFixed(2)};">${label}</button>`;
}

function startComplaintCountdown(cur, isMrbrok){
  clearInterval(complaintCountdownInterval);
  complaintCountdownInterval = null;
  if(!cur || !cur.complaint) return;
  const deadline = cur.complaint.startedAt + (isMrbrok ? MRBROK_COMPLAINT_COUNTDOWN_MS : COMPLAINT_COUNTDOWN_MS);
  const tick = ()=>{
    const el = document.getElementById('complaintCountdown');
    if(!el){ clearInterval(complaintCountdownInterval); complaintCountdownInterval = null; return; }
    const left = Math.max(0, Math.ceil((deadline - Date.now())/1000));
    el.textContent = '⏱️ ' + left + 's';
  };
  tick();
  complaintCountdownInterval = setInterval(tick, 1000);
}

  n => `😈 ${n} vandt runden — resten kan pakke sammen.`,

  n => `🔥 ${n} smadrede runden!`,

];
function randomTaunt(name){ return GAME_TAUNTS[Math.floor(Math.random()*GAME_TAUNTS.length)](name); }

function fireConfetti(centerEl){
  if(typeof gsap === 'undefined') return;
  const rect = centerEl ? centerEl.getBoundingClientRect() : { left: innerWidth/2, top: 140, width: 0 };
  const cx = rect.left + rect.width/2, cy = rect.top + 20;
  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);
  for(let i=0;i<28;i++){
    const c = document.createElement('div');
    c.textContent = ['🎉','✨','🪙','🎊','🔥'][Math.floor(Math.random()*5)];
    c.style.cssText = `position:absolute; left:${cx}px; top:${cy}px; font-size:${14+Math.random()*14}px;`;
    layer.appendChild(c);
    const ang = Math.random()*Math.PI*2;
    const dist = 70 + Math.random()*140;
    gsap.set(c, { xPercent:-50, yPercent:-50, opacity:1 });
    gsap.to(c, { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist - 30, rotate: Math.random()*360, duration: 0.9+Math.random()*0.5, ease:'power1.out' });
    gsap.to(c, { opacity:0, duration:0.6, delay:0.5 });
  }
  setTimeout(()=>layer.remove(), 1700);
}

function celebrateGameRound(g){
  const cur = g.current;
  if(!cur) return;
  let winnerNames = [], key = null;
  if(cur.phase === 'results'){
    key = `r${g.round}-${cur.type}`;
    const ids = cur.type === 'quiplash' ? (cur.winnerIds||[]) : (cur.correctGuessers||[]);
    winnerNames = ids.map(id=>state.members.find(m=>m.id===id)).filter(Boolean).map(m=>m.name);
  } else if(cur.type === 'gameover'){
    key = 'gameover';
    winnerNames = (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean).map(m=>m.name);
  }
  if(!winnerNames.length || key === lastCelebratedKey) return;
  lastCelebratedKey = key;
  const card = document.getElementById('gameCard') || document.getElementById('gameoverReveal');
  fireConfetti(card);
  if(cur.type === 'gameover'){
    toast(`👑 ${winnerNames.join(' & ')} vandt hele spillet! Hån frit resten af aftenen.`);
    const winnerNameEl = document.getElementById('gameoverWinnerName');
    if(winnerNameEl) winnerNameEl.classList.add('gameover-winner-pop', 'gameover-winner-glow');
    const loserNameEl = document.getElementById('gameoverLoserName');
    if(loserNameEl) loserNameEl.classList.add('gameover-loser-shake');
    const loserEmojiEl = document.getElementById('gameoverLoserEmoji');
    if(loserEmojiEl) loserEmojiEl.classList.add('gameover-loser-droop', 'gameover-loser-sway');
  }else{
    toast(randomTaunt(winnerNames.join(' & ')));
  }
}

function playRoundCountdown(){
  const el = document.createElement('div');
  el.className = 'game-countdown';
  el.innerHTML = `<div class="game-countdown-num">3</div>`;
  document.body.appendChild(el);
  const numEl = el.querySelector('.game-countdown-num');
  const steps = ['3','2','1'];
  let i = 0;
  const tick = ()=>{
    numEl.textContent = steps[i];
    if(typeof gsap !== 'undefined'){
      gsap.fromTo(numEl, { scale:.4, opacity:0 }, { scale:1, opacity:1, duration:.3, ease:'back.out(2)' });
      gsap.to(numEl, { opacity:0, duration:.2, delay:.6 });
    }
    i++;
    if(i < steps.length) setTimeout(tick, 850);
    else setTimeout(()=>el.remove(), 900);
  };
  tick();
}

function renderGameScreen(){
  // Mens en Chancen-afsløring (hjul eller whack-a-mole) reelt spiller af,
  // må intet gen-render røre DOM'en — heller ikke fordi en ANDEN spiller
  // trykkede "klar" og dermed reelt ændrede server-staten. Sådan et
  // gen-render erstatter HELE main-DOM'en, hvilket ødelægger den igangværende
  // CSS-transition midt i spinnet/elimineringen og fik det til at se ud som
  // om det bare hoppede direkte til facit på under et sekund. Genoptages af
  // sig selv når afsløringen er færdig — se playWheelChanceReveal/
  // playMoleChanceReveal's onDone, som nulstiller låsen.
  if(revealAnimationLock) return;
  const g = state.game || { active:false };
  if(g.active && !g.players) g.players = state.members.map(m=>m.id); // forsvar mod ældre spil-state uden players-feltet
  if(g.active && g.current && (g.current.phase === 'answer' || g.current.phase === 'write') && g.round !== lastCountdownRound){
    lastCountdownRound = g.round;
    playRoundCountdown();
  }
  const isRose = g.active && g.current && g.current.type === 'rose';
  app.innerHTML = `
    <header class="theme-spil${isRose?' theme-rose':''}">
      <div class="title" style="font-size:30px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>Brok<span>spillet</span> 👉</span>
        <button id="btnAppMenu" title="Menu" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; font-size:16px; background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); color:rgba(255,247,232,0.85); border-radius:100px; flex:0 0 auto;">☰</button>
      </div>
    </header>
    <main id="main" style="padding:0 16px 40px;">${gameBodyHtml(g)}</main>
  `;
  document.getElementById('btnAppMenu').onclick = openAppMenuSheet;
  bindGameHandlers(g);
  const card = document.getElementById('gameCard') || document.getElementById('gameoverReveal');
  // Kun afspil kort-animationen OG genstarte nedtællingen når runde/fase
  // RENT FAKTISK skifter — ellers sker begge dele ved hvert stille poll (fx
  // når en anden spiller svarer), hvilket så ud som flimren og fik uret til
  // at hoppe tilbage til fuld tid igen og igen i stedet for at tælle ned.
  const animKey = g.active && g.current ? (g.round + ':' + g.current.type + ':' + g.current.phase) : 'lobby';
  const isNewGamePhase = animKey !== lastAnimatedGameKey;
  lastAnimatedGameKey = animKey;
  if(card && typeof gsap !== 'undefined' && isNewGamePhase){
    gsap.fromTo(card, { opacity:0, y:14, scale:.97 }, { opacity:1, y:0, scale:1, duration:.45, ease:'power2.out' });
  }
  const complaintKey = g.active && g.current && g.current.complaint ? (animKey + ':' + g.current.complaint.startedAt) : null;
  if(complaintKey !== lastComplaintKey){
    lastComplaintKey = complaintKey;
    startComplaintCountdown(g.current);
  }
  celebrateGameRound(g);
  if(isNewGamePhase && g.current && g.current.type === 'quiplash' && g.current.phase === 'results' && g.current.randomPick){
    if(g.current.chanceVisual === 'wheel'){
      scheduleChanceReveal(playWheelChanceReveal, 'chance', g.current.phaseStartedAt);
    }else if(g.current.chanceVisual === 'slot'){
      scheduleChanceReveal(playSlotChanceReveal, 'chance', g.current.phaseStartedAt);
    }else{
      playMoleChanceReveal('chance');
    }
  }
  if(isNewGamePhase && g.current && g.current.type === 'casinobrok' && g.current.phase === 'results'){
    if(g.current.chanceVisual === 'slot'){
      scheduleChanceReveal(playSlotChanceReveal, 'chance', g.current.phaseStartedAt);
    }else{
      scheduleChanceReveal(playWheelChanceReveal, 'chance', g.current.phaseStartedAt);
      pulseMyWordOnWheel('chance');
    }
  }
}

const SLOT_REEL_H = 58;
// Bygger selve spillemaskine-markup'et — samme .slot-cabinet/.slot-window/
// .reel-design som Brokkekassens daglige "dagens gratis brok"-lodtrækning,
// nu genbrugt til Chancen. Reelernes fyld-symboler er tilfældige hver gang
// denne kaldes (harmløst — de ruller ud af syne uanset), men SIDSTE symbol
// på hver reel er altid vinderen, og strip'en er som DEFAULT allerede
// transformeret til den landede position. Det betyder et helt almindeligt
// gen-render (fx fordi en anden spiller trykker "klar" mens man kigger på
// resultatet) viser den korrekte, landede tilstand med det samme — kun den
// FØRSTE visning kører den egentlige spin-animation (se playSlotChanceReveal).
function buildSlotCabinetHtml(prefix, candidates, winner, bannerText, revealed, phaseStartedAt){
  if(!winner || !candidates.length) return '';
  if(revealed === undefined) revealed = true;
  function buildStrip(){
    const n = 10 + Math.floor(Math.random()*4);
    const syms = [];
    for(let i=0;i<n;i++) syms.push(candidates[Math.floor(Math.random()*candidates.length)]);
    syms.push(winner);
    return syms;
  }
  const reels = [buildStrip(), buildStrip(), buildStrip()];
  const reelsHtml = reels.map((syms,ri)=>`
    <div class="reel"><div class="reel-strip" id="${prefix}ReelStrip${ri}" style="transform:translateY(-${(syms.length-1)*SLOT_REEL_H}px);">
      ${syms.map(m=>`<div class="reel-symbol"><div class="avatar">${initials(m?m.name:'?')}</div></div>`).join('')}
    </div></div>
  `).join('');
  return `
    <div style="text-align:center;">
      <div class="slot-banner">${bannerText}</div>
      <div class="slot-cabinet${revealed?' win':''}" id="${prefix}Cabinet" data-winner-cid="${winner.id}" data-phase-started="${phaseStartedAt||''}">
        <div class="slot-window">${reelsHtml}</div>
        <div class="slot-winner-name" id="${prefix}WinnerName" style="opacity:${revealed?1:0};">${escapeHtml(winner.name)} vandt! 🍀</div>
        ${winner.label ? `<div class="slot-winner-word" id="${prefix}WinnerWord" style="opacity:${revealed?1:0};">med ordet "${escapeHtml(winner.label)}"</div>` : ''}
      </div>
    </div>
  `;
}

// Spiller selve spin-animationen for et allerede-renderet spillemaskine-kort
// (bygget af buildSlotCabinetHtml) — "unsettler" hjulene til top og lader
// dem rulle ned til den position markup'et allerede sagde de skulle lande
// på. Kører kun én gang pr. ny resultat-fase, styret af isNewGamePhase i
// renderGameScreen — den bagvedliggende vinder er allerede afgjort
// server-side, dette er ren visuel spænding, ikke selve afgørelsen. Samme
// revealAnimationLock/chanceRevealedPhaseKey-mønster som hjulet (se
// playWheelChanceReveal) — uden det kunne et gen-render midt i spinnet
// (fx en anden spillers "klar"-tryk) nulstille hjulene halvvejs.
function playSlotChanceReveal(prefix){
  const cabinet = document.getElementById(prefix+'Cabinet');
  if(!cabinet) return;
  revealAnimationLock = true; // se renderGameScreen — intet gen-render må afbryde spinnet
  cabinet.classList.remove('win');
  const nameEl = document.getElementById(prefix+'WinnerName');
  const wordEl = document.getElementById(prefix+'WinnerWord');
  if(nameEl) nameEl.style.opacity = '0';
  if(wordEl) wordEl.style.opacity = '0';
  const strips = [...cabinet.querySelectorAll('.reel-strip')];
  const durations = [1.0, 1.5, 2.1];
  let doneCount = 0;
  const onAllStopped = ()=>{
    cabinet.classList.add('win');
    if(nameEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(nameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      else nameEl.style.opacity = '1';
    }
    if(wordEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(wordEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out', delay:.3});
      else wordEl.style.opacity = '1';
    }
    fireConfetti(cabinet);
    const phaseStarted = cabinet.dataset.phaseStarted;
    if(phaseStarted) chanceRevealedPhaseKey = Number(phaseStarted);
    revealAnimationLock = false; // gen-render må nu godt køre igen
  };
  strips.forEach((strip, ri) => {
    const distance = strip.children.length ? (strip.children.length-1)*SLOT_REEL_H : 0;
    const duration = durations[ri] || 1.5;
    const finish = ()=>{ doneCount++; if(doneCount >= strips.length) onAllStopped(); };
    if(typeof gsap !== 'undefined'){
      gsap.fromTo(strip, { y: 0 }, { y: -distance, duration, ease: 'power3.out', onComplete: finish });
    }else{
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0)';
      requestAnimationFrame(()=>{
        strip.style.transition = `transform ${duration}s ease-out`;
        strip.style.transform = `translateY(-${distance}px)`;
      });
      setTimeout(finish, duration*1000);
    }
  });
}

// Chancens NUVÆRENDE standardvisning: et lykkehjul, opdelt i lige store
// stykker (ét pr. kandidat), der snurrer og lander med den server-afgjorte
// vinder under pilen. Samme "landet som default"-mønster som spillemaskinen
// ovenfor: restAngle er den vinkel hjulet SKAL stå i for at vinderen er
// under pilen, gemt som data-attribut, så et almindeligt gen-render (ingen
// animation) altid viser den korrekte, landede tilstand med det samme.
const WHEEL_COLORS = ['#FF6B4A','#FFC93C','#0B4F55','#137a7d','#E8A317','#8a5fb0'];
function wheelPolarPoint(cx, cy, r, angleDeg){
  const rad = angleDeg * Math.PI/180; // 0° = kl. 12 (toppen), stigende med uret
  return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
}
// Vegas-lys rundt om hjulet — statiske pærer (roterer IKKE med hjulet, de
// sidder fast på kabinettet, som på en rigtig lykkehjul-maskine). Hver
// pære får sin egen animation-delay, ellers blinker de i takt og ser
// mekanisk ud i stedet for et rigtigt glimtende lyskæde-mønster.
function wheelLightsHtml(n){
  // Pixel-koordinater matcher .wheel-wrap's egen CSS-størrelse (270x270) —
  // ændres wrap'ens størrelse, skal cx/cy/r ændres tilsvarende, ellers
  // ryger lysene ud af position i forhold til selve hjulet.
  const cx = 135, cy = 135, r = 132;
  let html = '';
  for (let i = 0; i < n; i++) {
    const p = wheelPolarPoint(cx, cy, r, (360/n)*i);
    html += `<div class="wheel-bulb" style="left:${p.x.toFixed(1)}px; top:${p.y.toFixed(1)}px; animation-delay:${(i%4)*0.25}s;"></div>`;
  }
  return html;
}

function buildWheelChanceHtml(prefix, candidates, winner, bannerText, revealed, phaseStartedAt){
  if(!winner || !candidates.length) return '';
  // revealed=false (kun brugt af Casinobrok, som venter til et fælles
  // tidspunkt før spinnet — se scheduleWheelChanceReveal): hjulets HVILE-
  // vinkel er nødt til at pege på vinderen med det samme (for at kunne stå
  // stille og korrekt ved senere gen-render), men selve AFSLØRINGEN
  // (glødende vinder-stykke, guld-kabinet, navnet) holdes skjult indtil
  // det planlagte tidspunkt — ellers ville folk kunne se svaret i samme
  // øjeblik skærmen åbnes, længe før hjulet overhovedet begynder at snurre.
  if(revealed === undefined) revealed = true;
  // Med kun 2-3 rigtige kandidater ser hjulet kedeligt/mønt-kast-agtigt ud
  // delt i 2-3 store stykker. Gentager kandidaterne til mindst 6 SYNLIGE
  // stykker i stedet — ændrer IKKE de reelle odds, hver kandidat får stadig
  // nøjagtig samme SAMLEDE andel af hjulet, bare fordelt på flere mindre
  // stykker i stedet for én stor kile.
  const MIN_SLICES = 6;
  const repeats = Math.max(1, Math.ceil(MIN_SLICES / candidates.length));
  const visual = [];
  for (let rep = 0; rep < repeats; rep++) visual.push(...candidates);
  const n = visual.length;
  const sliceDeg = 360/n;
  const cx = 110, cy = 110, r = 104;
  // Altid FØRSTE forekomst af vinderen — deterministisk, ikke tilfældig ved
  // hvert render, ellers ville "landet som default"-tilstanden (se
  // playWheelChanceReveal) hoppe til et andet stykke ved hvert stille poll.
  const winnerIdx = Math.max(0, visual.findIndex(c=>c.id===winner.id));
  const midWinner = winnerIdx*sliceDeg + sliceDeg/2;
  // Vinklen hjulet skal roteres til for at vinderens midte lander under
  // pilen (som sidder fast kl. 12, dvs. 0°) — se playWheelChanceReveal.
  const restAngle = ((-midWinner) % 360 + 360) % 360;
  const slicesHtml = visual.map((c,i)=>{
    const start = i*sliceDeg, end = (i+1)*sliceDeg;
    const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
    const p1 = wheelPolarPoint(cx,cy,r,start), p2 = wheelPolarPoint(cx,cy,r,end);
    const largeArc = (end-start) > 180 ? 1 : 0;
    const path = `M${cx},${cy} L${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z`;
    return `<path d="${path}" fill="${color}" class="wheel-slice${(i===winnerIdx&&revealed)?' wheel-slice-win':''}" stroke="#052024" stroke-width="2" data-cid="${c.id}"></path>`;
  }).join('');
  const labelsHtml = visual.map((c,i)=>{
    const mid = i*sliceDeg + sliceDeg/2;
    // Teksten roteres RADIÆRT (langs stykkets egen retning, fra nav mod
    // kant) i stedet for at stå vandret uanset hvor på hjulet den er —
    // vandret tekst passede fint i toppen/bunden, men stak ud af den smalle
    // kile ved fx kl. 3/9, hvor et helt ord ikke er bredt nok til at være
    // vandret uden at ramme naboskiverne. Gruppen roteres til punktets
    // vinkel (samme matematik som wheelPolarPoint), og teksten selv får
    // yderligere +90° for at pege radiært i stedet for tangentielt — vippes
    // 180° oveni hvis det ellers ville stå på hovedet for den der kigger på
    // hjulet i ro.
    const textExtraRot = 90;
    const finalAngle = ((mid + textExtraRot) % 360 + 360) % 360;
    const flip = finalAngle > 90 && finalAngle < 270;
    const textOwnRot = textExtraRot + (flip ? 180 : 0);
    // Kandidater med et eget `.label` (fx et brok-ord) viser den tekst,
    // trunkeret så den er kort nok til at stå på ét stykke af hjulet —
    // ellers falder den tilbage til navne-initialer (den oprindelige brug:
    // en person direkte).
    // Ordet er selve pointen med at kigge på hjulet under en Casinobrok-
    // reveal (modsat initialer, som bare er dekorativ identifikation) — så
    // det skal være markant større/tydeligere, ikke bare passe ind i en
    // lille cirkel. Vigtigt på mobil, hvor hjulet i forvejen er lille.
    const text = c.label ? (c.label.length > 9 ? c.label.slice(0,8)+'…' : c.label) : initials(c.name);
    const fontSize = c.label ? 13.5 : 14;
    // Ingen rund baggrundscirkel bag teksten længere (så den ikke ser ud
    // som en malplaceret prik oven på hjulet) — kontrasten mod farve-
    // stykkerne klares i stedet af et mørkt "omrids" via stroke bag selve
    // teksten (paint-order tegner stroke FØR fill, så streget ligger bagved).
    return `<g transform="rotate(${mid.toFixed(2)} ${cx} ${cy}) translate(${cx} ${(cy - r*0.62).toFixed(2)})" data-cid="${c.id}">
      <text transform="rotate(${textOwnRot})" text-anchor="middle" dominant-baseline="central" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="${fontSize}" fill="#FFF7E8" stroke="rgba(5,32,36,0.85)" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">${escapeHtml(text)}</text>
    </g>`;
  }).join('');
  return `
    <div style="text-align:center;">
      <div class="slot-banner">${bannerText}</div>
      <div class="wheel-cabinet${revealed?' win':''}" id="${prefix}Cabinet" data-winner-cid="${winner.id}" data-phase-started="${phaseStartedAt||''}">
        <div class="wheel-pointer"></div>
        <div class="wheel-wrap">
          <div class="wheel-lights">${wheelLightsHtml(14)}</div>
          <svg id="${prefix}WheelSvg" class="wheel-svg" viewBox="0 0 220 220">
            <g id="${prefix}WheelSpinGroup" class="wheel-spin-group" data-rest-angle="${restAngle}" style="transform:rotate(${restAngle}deg);">
              ${slicesHtml}
              ${labelsHtml}
              <circle cx="110" cy="110" r="14" fill="#052024" stroke="${revealed ? WHEEL_COLORS[winnerIdx % WHEEL_COLORS.length] : '#8a6b1f'}" stroke-width="3"></circle>
            </g>
          </svg>
        </div>
        <div class="slot-winner-name" id="${prefix}WinnerName" style="opacity:${revealed?1:0};">${escapeHtml(winner.name)} vandt! 🍀</div>
        ${winner.label ? `<div class="slot-winner-word" id="${prefix}WinnerWord" style="opacity:${revealed?1:0};">med ordet "${escapeHtml(winner.label)}"</div>` : ''}
      </div>
    </div>
  `;
}

// Spiller selve spin-animationen for et allerede-renderet hjul (bygget af
// buildWheelChanceHtml) — starter hjulet ved 0° og lader det snurre flere
// hele omgange plus den vinkel markup'et allerede sagde det skulle lande
// på (data-rest-angle), så det ALTID lander præcis samme sted som den
// statiske, uanimerede visning. Kører kun én gang pr. ny resultat-fase.

// Hver klient opdager selv en ny resultat-fase på et LIDT forskelligt
// tidspunkt (afhængig af hvornår ens eget 3-sekunders poll lige rammer) —
// starter spinnet man med det samme, kan nogen nå at åbne skærmen efter
// den allerede er landet, og aldrig se selve snurret. I stedet planlægges
// spinnet til at starte på et FÆLLES tidspunkt, udregnet ud fra serverens
// egen cur.phaseStartedAt (som alle klienter allerede får med) — så alle
// telefoner regner sig frem til PRÆCIS samme starttidspunkt, uanset hvornår
// deres eget poll opdagede fasen. Er man allerede for sent på den (fx en
// telefon der lige er kommet tilbage), spilles det bare med det samme.
const WHEEL_REVEAL_DELAY_MS = 4000;
const WHEEL_SPIN_DURATION_MS = 6000; // ægte 5-7 sekunders spin, ikke et hop
// Fælles ventetid før BEGGE Casinobrok-visninger (hjul eller spillemaskine,
// se casinobrokHtml's chanceVisual) starter — samme princip uanset hvilken
// af de to der er valgt for denne runde.
function scheduleChanceReveal(playFn, prefix, phaseStartedAt){
  clearTimeout(wheelRevealTimeout);
  const target = (phaseStartedAt || Date.now()) + WHEEL_REVEAL_DELAY_MS;
  const delay = Math.max(0, target - Date.now());
  wheelRevealTimeout = setTimeout(()=> playFn(prefix), delay);
}
function scheduleWheelChanceReveal(prefix, phaseStartedAt){
  scheduleChanceReveal(playWheelChanceReveal, prefix, phaseStartedAt);
}

// Kort visuel bekræftelse af at ens EGET ord rent faktisk er på hjulet —
// spillerne kan se alle ord med det samme (de er aldrig hemmelige, se
// buildWheelChanceHtml), men med op til WHEEL_REVEAL_DELAY_MS før spinnet overhovedet
// begynder er det let at overse hvor ens eget stykke egentlig sidder. Et
// ord kan optræde på FLERE stykker (se MIN_SLICES-gentagelsen), så alle
// forekomster glimter, ikke kun den første. Kører kun én gang pr. nyt
// resultat-kort (styret af isNewGamePhase, samme sted spinnet planlægges).
function pulseMyWordOnWheel(prefix){
  if(!profile) return;
  const cabinet = document.getElementById(prefix+'Cabinet');
  if(!cabinet) return;
  cabinet.querySelectorAll('path[data-cid="'+profile.memberId+'"]').forEach(el=>el.classList.add('wheel-my-word-pulse'));
  cabinet.querySelectorAll('g[data-cid="'+profile.memberId+'"] text').forEach(el=>el.classList.add('wheel-my-word-text-pulse'));
}

// Snurrer hjulet via en almindelig CSS `transition` på `transform`, IKKE
// via GSAP — GSAP's `rotate`-property på et rod-<svg>-element viste sig i
// praksis upålideligt på iOS Safari (nedtællingen/landingen virkede fint,
// men selve spinnet var usynligt — kun den statiske slut-tilstand blev
// vist). Almindelig `transform:rotate()` + `transition` er langt mere
// robust cross-browser, og er allerede den vej der fungerede i test.
function playWheelChanceReveal(prefix){
  const cabinet = document.getElementById(prefix+'Cabinet');
  if(!cabinet) return;
  revealAnimationLock = true; // se renderGameScreen — intet gen-render må afbryde spinnet
  cabinet.classList.remove('win');
  const nameEl = document.getElementById(prefix+'WinnerName');
  const wordEl = document.getElementById(prefix+'WinnerWord');
  if(nameEl) nameEl.style.opacity = '0';
  if(wordEl) wordEl.style.opacity = '0';
  const spinGroup = document.getElementById(prefix+'WheelSpinGroup');
  if(!spinGroup){ revealAnimationLock = false; return; }
  const restAngle = parseFloat(spinGroup.dataset.restAngle || '0');
  const spins = 9; // flere omgange for at fylde de længere sekunder ordentligt ud, ikke bare rotere hurtigt forbi
  const finalAngle = restAngle + 360*spins;
  const onDone = ()=>{
    cabinet.classList.add('win');
    if(nameEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(nameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      else nameEl.style.opacity = '1';
    }
    // Ordet er selve pointen med at have skrevet noget — det skal have sin
    // egen tydelige, lidt forsinkede indflyvning, ikke bare dukke op
    // samtidig og drukne i navnet + konfetti.
    if(wordEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(wordEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out', delay:.3});
      else wordEl.style.opacity = '1';
    }
    // Selve det vindende ord på hjulet stod bare der med et statisk glow
    // efter landing — nem at overse midt i konfetti-regnen. Lader det
    // rent faktisk BLINKE et par gange (genbruger samme glow/skalerings-
    // keyframes som "bekræft mit eget ord"-pulset før spinnet), så det er
    // tydeligt HVILKET stykke der vandt, ikke kun at hjulet er stoppet.
    const winnerCid = cabinet.dataset.winnerCid;
    if(winnerCid){
      cabinet.querySelectorAll('path[data-cid="'+winnerCid+'"]').forEach(el=>el.classList.add('wheel-winner-flash'));
      cabinet.querySelectorAll('g[data-cid="'+winnerCid+'"] text').forEach(el=>el.classList.add('wheel-winner-text-flash'));
    }
    fireConfetti(cabinet);
    // Markerer at DENNE klient nu selv har set spinnet for denne runde køre
    // færdigt — casinobrokHtml's "revealed" bruger dette (ikke vægur-tid) til
    // at vise vinderen i listen/på hjulet, så en klient der åbner/poller
    // sent aldrig ser et "afslør, nulstil, spin forfra"-glimt (se
    // chanceRevealedPhaseKey).
    const phaseStarted = cabinet.dataset.phaseStarted;
    if(phaseStarted) chanceRevealedPhaseKey = Number(phaseStarted);
    revealAnimationLock = false; // gen-render må nu godt køre igen (fx en anden spillers "klar"-tryk imens vi ventede)
  };
  spinGroup.style.transition = 'none';
  spinGroup.style.transform = 'rotate(0deg)';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      spinGroup.style.transition = `transform ${WHEEL_SPIN_DURATION_MS/1000}s cubic-bezier(.16,.84,.28,1)`;
      spinGroup.style.transform = `rotate(${finalAngle}deg)`;
    });
  });
  setTimeout(onDone, WHEEL_SPIN_DURATION_MS);
}

// Chancens standard-visning ved uafgjort/2-spiller-skip: whack-a-mole. Ren
// tilfældig elimination, ingen valg involveret — matcher hvad Chancen
// FAKTISK er lige nu (se CSS-kommentaren ovenfor). Vinderens muldvarp er
// markeret med data-winner, så JS'en kan finde den uanset klasse-ændringer
// undervejs. Samme "landet som default"-mønster som hjul/spillemaskine:
// markup'et viser allerede den endelige tilstand (taberne nede, vinderen
// oppe og fejrer), så et almindeligt gen-render ikke nulstiller visningen.
function buildMoleChanceHtml(prefix, candidates, winner, bannerText, winnerQuote){
  if(!winner || !candidates.length) return '';
  // Ren tilfældighed, ingen tekst — kun avatar-bogstavet. Hammeren er
  // tilbage, men pointen er nu IKKE at ramme præcist (umuligt at sælge
  // troværdigt på en lille skærm) — det ER molens overdrevne "splintret"-
  // reaktion (se .mole-hit/.mole-shard + playMoleChanceReveal) der bærer
  // sjovet, uanset hvor "præcist" hammeren rammer visuelt. Navnet under
  // hullet holder identiteten synlig, selvom avataren selv splintres væk.
  const holes = candidates.map(c=>{
    const isWin = c.id === winner.id;
    return `
      <div class="mole-hole-wrap">
        <div class="mole-hammer" data-hammer-id="${c.id}"><div class="mole-hammer-head"></div><div class="mole-hammer-handle"></div></div>
        <div class="mole-hole">
          <div class="mole ${isWin?'mole-win':'mole-hit'}" data-mole-id="${c.id}" ${isWin?'data-winner="1"':''}>
            <div class="avatar">${initials(c.name)}</div>
            <div class="mole-shard s1"></div>
            <div class="mole-shard s2"></div>
            <div class="mole-shard s3"></div>
          </div>
          <div class="mole-impact" data-impact-id="${c.id}"></div>
        </div>
        <div class="mole-name-tag ${isWin?'win':''}">${escapeHtml(c.name)}</div>
      </div>`;
  }).join('');
  // Vinderens citat (den frækkeste kommentar — hele pointen med runden) vises
  // nu som en fuldskærms-banner EFTER selve muldvarpe-afsløringen (se
  // showMoleWinBanner), ikke som en lille boks inde i kabinettet — den var
  // for let at overse, OG forsvandt hvis en anden spiller nåede at trykke
  // "klar" og udløse et gen-render før man selv nåede at læse den. Navn +
  // citat gemmes som data-attributter her, så JS kan bygge banneret uden at
  // være afhængig af DOM-elementer der kan blive bygget om undervejs.
  return `
    <div style="text-align:center;">
      <div class="slot-banner">${bannerText}</div>
      <div class="mole-cabinet win" id="${prefix}Cabinet" data-winner-name="${escapeHtml(winner.name)}" data-winner-quote="${escapeHtml(winnerQuote||'')}">
        <div class="mole-intro-hammer" id="${prefix}IntroHammer"><div class="mole-hammer-head"></div><div class="mole-hammer-handle"></div></div>
        <div class="mole-grid" id="${prefix}MoleGrid">${holes}</div>
        <div class="mole-countdown" id="${prefix}MoleCountdown"></div>
        <div class="slot-winner-name" id="${prefix}WinnerName" style="opacity:1;">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
  `;
}

// Spiller elimination-animationen: alle popper op, så bankes taberne ned
// én ad gangen i tilfældig rækkefølge (rent visuel spænding — vinderen er
// allerede afgjort server-side), til kun vinderens muldvarp står tilbage
// og fejrer. Kører kun én gang pr. ny resultat-fase.
// Fast total varighed på ~6 sekunder UANSET hvor mange kandidater der er —
// med kun 1 taber ville den gamle version være færdig på under et sekund
// (én hurtig bank, ingen reel spænding). Nu er der altid en ordentlig
// optakt før den første bankes ned, og en kort pause før vinderen fejrer,
// så det føles som en rigtig afsløring uanset gruppestørrelse.
const MOLE_PREROLL_MS = 3200;
const MOLE_KNOCK_BUDGET_MS = 3200;
const MOLE_POST_PAUSE_MS = 1400;
function playMoleChanceReveal(prefix){
  const cabinet = document.getElementById(prefix+'Cabinet');
  if(!cabinet) return;
  revealAnimationLock = true; // se renderGameScreen — intet gen-render må afbryde elimineringen
  cabinet.classList.remove('win');
  const nameEl = document.getElementById(prefix+'WinnerName');
  if(nameEl) nameEl.style.opacity = '0';
  const moles = [...cabinet.querySelectorAll('.mole')];
  if(!moles.length){ revealAnimationLock = false; return; }
  const winnerMole = moles.find(m => m.dataset.winner === '1');
  const losers = moles.filter(m => m.dataset.winner !== '1');
  moles.forEach(m => m.classList.remove('mole-win', 'mole-hit'));
  cabinet.querySelectorAll('.mole-impact').forEach(el => el.classList.remove('hit'));
  const introHammerReset = cabinet.querySelector('.mole-intro-hammer');
  if(introHammerReset) introHammerReset.classList.remove('entering', 'fading', 'whacking');
  const hammerFor = (mole) => cabinet.querySelector('[data-hammer-id="'+mole.dataset.moleId+'"]');
  const impactFor = (mole) => cabinet.querySelector('[data-impact-id="'+mole.dataset.moleId+'"]');
  const order = losers.slice().sort(() => Math.random() - 0.5);
  const perHitDelay = order.length ? Math.max(500, MOLE_KNOCK_BUDGET_MS / order.length) : 0;

  const finish = () => {
    cabinet.classList.add('win');
    if(winnerMole) winnerMole.classList.add('mole-win');
    if(nameEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(nameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      else nameEl.style.opacity = '1';
    }
    fireConfetti(cabinet);
    revealAnimationLock = false; // gen-render må nu godt køre igen
    // Vinderens citat — hele pointen med at have skrevet noget sjovt — vises
    // nu som sin egen fuldskærms-banner (se showMoleWinBanner), IKKE som en
    // lille boks i kabinettet: den forsvandt for let, og forsvandt HELT hvis
    // en anden spillers "klar"-tryk nåede at udløse et gen-render før man
    // selv fik læst den (banneret lever uden for det almindelige render()-
    // kredsløb, så det overlever den slags).
    setTimeout(()=>{
      showMoleWinBanner(cabinet.dataset.winnerName, cabinet.dataset.winnerQuote);
    }, 500);
  };

  // Introduktion/præsentation: hammeren letter ind KÆMPESTOR midt i
  // kabinettet og krymper ned til sin rigtige størrelse — ingen "prøve-
  // sving" hen over hullerne længere (det så ud som mislykkede slag/en
  // fejl, ikke som spænding). Herefter tæller en klassisk 3-2-1 ned mens
  // hammeren står synlig og klar, og til sidst toner den ud igen og
  // overlader selve banket til de rigtige per-hul-hamre (se hitNext).
  const introHammer = document.getElementById(prefix+'IntroHammer');
  if(introHammer) introHammer.classList.add('entering');
  const countdownEl = document.getElementById(prefix+'MoleCountdown');
  if(countdownEl){
    const steps = ['3','2','1'];
    const countdownBudget = Math.max(900, MOLE_PREROLL_MS - 700);
    const perStep = countdownBudget / steps.length;
    let ci = 0;
    const tick = () => {
      countdownEl.innerHTML = `<div class="mole-countdown-num">${steps[ci]}</div>`;
      const numEl = countdownEl.querySelector('.mole-countdown-num');
      if(typeof gsap !== 'undefined' && numEl) gsap.fromTo(numEl, { scale:.5, opacity:0 }, { scale:1, opacity:1, duration:.25, ease:'back.out(2)' });
      ci++;
      if(ci < steps.length) setTimeout(tick, perStep);
      else setTimeout(()=>{ countdownEl.innerHTML = ''; }, perStep * 0.5);
    };
    setTimeout(tick, 650);
  }
  setTimeout(()=>{
    if(!introHammer) return;
    introHammer.classList.remove('entering'); // stopper "forwards"-holdt opacity:1 fra selve entré-animationen, ellers slår transition'en herunder aldrig igennem
    introHammer.classList.add('fading');
  }, MOLE_PREROLL_MS - 150);

  let i = 0;
  const hitNext = () => {
    if(i < order.length){
      const mole = order[i];
      const hammer = hammerFor(mole);
      if(hammer) hammer.classList.add('whacking');
      setTimeout(()=>{
        mole.classList.add('mole-hit');
        const impact = impactFor(mole);
        if(impact) impact.classList.add('hit');
      }, 220);
      i++;
      setTimeout(hitNext, perHitDelay);
    }else{
      setTimeout(finish, MOLE_POST_PAUSE_MS);
    }
  };
  setTimeout(hitNext, MOLE_PREROLL_MS);
}

// Fuldskærms fejrings-banner for Chancens vinder — lille "X vandt!" foroven,
// den faktiske vindende kommentar/ord STORT og centreret (det ER pointen med
// runden), tryk hvor som helst for at lukke og komme tilbage til resultat-
// skærmen. Bevidst Brokspillets eget teal/guld-tema, IKKE MrBroks mørke
// stil — de to spil skal ikke ligne hinanden et kort øjeblik.
function showMoleWinBanner(name, quote){
  const backdropHtml = `<div class="mole-win-banner-backdrop" id="moleWinBannerBackdrop"><div class="mole-win-banner"><div class="mole-win-banner-emoji">🏆</div><div class="mole-win-banner-name">${escapeHtml(name||'?')} vandt!</div>${quote ? `<div class="mole-win-banner-quote">"${escapeHtml(quote)}"</div>` : ''}<p class="mole-win-banner-hint">Tryk for at fortsætte</p></div></div>`;
  document.body.insertAdjacentHTML('beforeend', backdropHtml);
  const backdrop = document.getElementById('moleWinBannerBackdrop');
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close = ()=>{ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(), 250); };
  backdrop.addEventListener('click', close);
  if(typeof gsap !== 'undefined'){
    const inner = backdrop.querySelector('.mole-win-banner');
    gsap.fromTo(inner, {opacity:0, scale:.9}, {opacity:1, scale:1, duration:.4, ease:'back.out(1.6)', delay:.15});
  }
}

function gameBodyHtml(g){
  if(!g.active || !g.current) return gameLobbyHtml();
  const cur = g.current;
  if(cur.type !== 'gameover' && profile && g.players && !g.players.includes(profile.memberId)){
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 👀 Du kigger med</div>
      <div class="empty-state"><span class="emoji">🍿</span><b>Du er ikke med i denne omgang</b>De andre spiller videre — du er velkommen næste spil.</div>
    `;
  }
  if(cur.type === 'gameover') return gameOverHtml(g, cur);
  if(cur.type === 'quiplash') return quiplashHtml(g, cur);
  if(cur.type === 'truefalse') return truefalseHtml(g, cur);
  if(cur.type === 'trivia') return triviaHtml(g, cur);
  if(cur.type === 'guessbrok') return guessBrokHtml(g, cur);
  if(cur.type === 'casinobrok') return casinobrokHtml(g, cur);
  if(cur.type === 'rose') return roseHtml(g, cur);
  return '';
}

function gameHighscoreHtml(){
  const stats = state.gameStats || {};
  const ranked = state.members
    .filter(m => !m.isBot && stats[m.id] && stats[m.id].played > 0)
    .sort((a,b) => (stats[b.id].wins - stats[a.id].wins) || (stats[b.id].played - stats[a.id].played));
  if(!ranked.length) return '';
  const rows = ranked.map((m,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(m.name)}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${stats[m.id].played} spillet</div></div>
      <div class="bal-amt">${stats[m.id].wins} sejre</div>
    </div>
  `).join('');
  return `<div class="section-label">🏆 Highscore</div>${rows}`;
}

function gameProgressHtml(count, total, label){
  const pct = total ? Math.min(100, Math.round((count/total)*100)) : 0;
  return `<div class="game-progress"><span>${count}/${total} ${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div></div>`;
}

// Bruges i resultat-pausen mellem runder — hver spiller trykker selv "klar"
// i stedet for at én person kan tvinge alle videre; runden skifter først
// når alle har trykket (eller nedtællingen løber ud som nødbremse).
function gameReadyHtml(g, cur){
  const already = profile && (cur.readyIds||[]).includes(profile.memberId);
  const readyCount = (cur.readyIds||[]).length;
  return `
    ${gameProgressHtml(readyCount, g.players.length, 'er klar')}
    ${already
      ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>`
      : `<button class="game-btn" id="readyBtn">✅ Klar til næste runde</button>`}
    ${complaintBlockHtml(g, cur)}
  `;
}

function gameLobbyHtml(){
  // Bot-testspillere (se BOT_NAMES/ensureTestBots) bliver permanente
  // medlemmer af rummet efter første bot-testspil — de skal ALDRIG dukke
  // op som en mulighed i den normale spillerliste for et rigtigt spil,
  // kun i selve bot-testspillet (startBotTestGame vælger dem eksplicit).
  const realMembers = state.members.filter(m=>!m.isBot);
  const allIds = realMembers.map(m=>m.id);
  if(!gameSelectedPlayers || !gameKnownMemberIds){
    gameSelectedPlayers = allIds.slice();
  }else{
    const newcomers = allIds.filter(id=>!gameKnownMemberIds.includes(id));
    // Fjerner ID'er på medlemmer der ikke længere er i rummet — ellers
    // tæller "Start spillet (X spillere)"-knappen dem stadig med, så den
    // ser aktiv/nok ud selvom kun de RESTERENDE, faktiske medlemmer er for
    // få, og serveren afviser starten et øjeblik efter med "vælg mindst..."
    gameSelectedPlayers = [...gameSelectedPlayers.filter(id=>allIds.includes(id)), ...newcomers];
  }
  gameKnownMemberIds = allIds.slice();
  const chips = realMembers.map(m=>{
    const on = gameSelectedPlayers.includes(m.id);
    return `<div class="name-pill ${on?'selected':''}" data-player="${m.id}" style="${on?'':'opacity:.5;'}">${on?'✅':'➖'} ${escapeHtml(m.name)}</div>`;
  }).join('');
  const enough = gameSelectedPlayers.length >= 2;
  const gameSteps = [
    ['🎭', 'Skriv-og-stem: alle skriver et sjovt svar, så stemmer I på det bedste'],
    ['⚖️', 'Sandt/falsk: én skriver et udsagn om en anden — resten gætter'],
    ['🎯', 'Hvilket brok? Én skriver et RIGTIGT brok blandt 3 opdigtede — resten gætter hvilket der er ægte'],
    ['🔍', 'Trivia om jeres egen brok-historik (og lidt verdens-brok ind imellem)'],
    ['🎰', 'Casinobrok: alle skriver ét brok-ord, og hjulet trækker lod om hvis ord der vinder'],
    ['🌹', 'Rose: skriv en ægte ros til en tilfældig medspiller, gæt bagefter hvem der skrev hvad om hvem'],
    ['🏆', 'Point tælles på tværs af alle runder — flest point vinder'],
  ];
  if(gameInstructionsOpen === null) gameInstructionsOpen = !localStorage.getItem('bk_game_seen_instructions');
  localStorage.setItem('bk_game_seen_instructions', '1');
  return `
    <div class="empty-state" style="padding-top:18px; padding-bottom:10px;">
      <span class="emoji">👉</span>
      <b>Brokspillet</b>
      Skriv, gæt og stem jer igennem jeres egen brok-historie.
    </div>
    <div class="game-card" style="margin:10px 0 10px;">
      <div id="gameInstructionsToggle" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer; ${gameInstructionsOpen?'margin-bottom:8px;':''}">
        <label class="field-label" style="color:rgba(255,247,232,0.7); margin:0;">Sådan foregår det</label>
        <span style="color:rgba(255,247,232,0.5); font-size:13px; transition:transform .2s; display:inline-block; ${gameInstructionsOpen?'transform:rotate(180deg);':''}">⌄</span>
      </div>
      ${gameInstructionsOpen ? gameSteps.map(([icon,text])=>`
        <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:9px;">
          <span style="font-size:16px; line-height:1.4;">${icon}</span>
          <p style="margin:0; font-size:13px; line-height:1.4; color:rgba(255,247,232,0.8);">${text}</p>
        </div>
      `).join('') : ''}
    </div>
    <div class="game-card" style="margin:10px 0;">
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Hvem er med? (mindst 2)</label>
      <div class="name-grid" id="playerGrid">${chips}</div>
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Spil om</label>
      <div class="segmented" style="margin-bottom:14px;">
        <div class="seg ${gameWager!=='euro'?'active':''}" data-wager="fun">🏅 Æren</div>
        <div class="seg ${gameWager==='euro'?'active':''}" data-wager="euro">💶 1 euro i kassen</div>
      </div>
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Antal runder</label>
      <div class="segmented" style="margin-bottom:0;">
        <div class="seg ${gameRounds===5?'active':''}" data-rounds="5">5</div>
        <div class="seg ${gameRounds===8?'active':''}" data-rounds="8">8</div>
        <div class="seg ${gameRounds===12?'active':''}" data-rounds="12">12</div>
      </div>
    </div>
    <button class="game-btn" id="startGameBtn" ${enough?'':'disabled'}>👉 Start spillet (${gameSelectedPlayers.length} spillere)</button>
    ${enough?'':'<p class="hint" style="text-align:center;">Vælg mindst 2 spillere</p>'}
    ${gameHighscoreHtml()}
  `;
}

// Ved en 2-spiller "vinder-hån"-runde (cur.isWinnerTaunt) er "modstanderen"
// en helt bestemt person, men HVEM afhænger af hvem der kigger — kan derfor
// ikke bages ind i cur.prompt server-side (samme streng vises til begge),
// og indsættes i stedet her ud fra hvem den anden spiller er for MIG.
function quiplashPromptText(g, cur){
  if(!cur.isWinnerTaunt) return cur.prompt || '';
  const otherId = (g.players||[]).find(id => id !== (profile && profile.memberId));
  const other = otherId ? state.members.find(m=>m.id===otherId) : null;
  return (cur.prompt || '').replace(/\{target\}/g, other ? other.name : 'modstanderen');
}

function quiplashHtml(g, cur){
  if(cur.phase === 'answer'){
    const answered = Object.keys(cur.answers||{}).length;
    const mine = profile && cur.answers[profile.memberId];
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · 🎭 Skriv-og-stem</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <div class="game-card" id="gameCard">
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:0 0 14px; line-height:1.3;">${escapeHtml(quiplashPromptText(g, cur))}</p>
        <textarea id="quipInput" rows="2" maxlength="120" placeholder="Dit svar..." ${mine?'disabled':''}>${mine?escapeHtml(mine):''}</textarea>
        ${mine ? '' : `<button class="game-btn" id="quipSubmitBtn" style="margin-top:10px;">🔒 Lås dit svar</button>`}
      </div>
      ${gameProgressHtml(answered, g.players.length, 'har svaret')}
      ${mine ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
      ${complaintBlockHtml(g, cur)}
    `;
  }
  if(cur.phase === 'vote'){
    const myId = profile && profile.memberId;
    const myAnswer = myId ? cur.answers[myId] : undefined;
    const others = Object.entries(cur.answers||{}).filter(([id])=>id!==myId).map(([id,text])=>({id,text}));
    const decoys = (cur.decoys||[]).map(d=>({id:d.id, text:d.text}));
    // Blander egne + opdigtede svar i én stabil (ikke gen-tilfældig ved
    // hvert poll) rækkefølge, så decoys ikke altid ligger sidst og dermed
    // stikker ud rent visuelt.
    const combined = [...others, ...decoys].sort((a,b)=> a.id < b.id ? -1 : (a.id > b.id ? 1 : 0));
    const myVote = profile && cur.votes[profile.memberId];
    const votedCount = Object.keys(cur.votes||{}).length;
    const rows = combined.map(({id,text},i)=>`
      <div class="bal-row${myVote?'':' game-pick'}" ${myVote?'':`data-vote-for="${id}"`} style="${myVote?'':'cursor:pointer;'} ${myVote===id?'outline:2px solid var(--coin);':''} ${myVote&&myVote!==id?'opacity:.5;':''}">
        <div class="avatar" style="width:34px;height:34px;font-size:12.5px; background:linear-gradient(160deg, var(--coin), var(--coin-dark)); color:var(--ink);">${i+1}</div>
