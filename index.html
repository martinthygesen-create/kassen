<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12666b" />
<title>Brokkekassen</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Brokkekassen" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#073B40; --sea:#0B4F55; --sea-light:#137a7d;
    --coin:#FFC93C; --coin-dark:#E8A317; --coral:#FF6B4A;
    --cream:#FFF7E8; --ink:#052024; --ink-soft:#0b3a3f;
    --noir:#0A1416; --noir-deep:#050B0C; /* MrBrok-nuance — mørkt "efterforskningslokale", stadig i teal-familien i stedet for en fremmed farve */
    --ember:#FF7A3D; --ember-dark:#C4491B; --ember-noir:#2A0F08; --ember-noir-deep:#180804; /* Det Store Brokkeri-nuance — varm rust/ember, "kogende over" i stedet for MrBroks kølige efterforskningslokale */
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  /* Gradienten sidder på <html>, IKKE på body eller en position:fixed div.
     Årsag: på mobile browsere (og især en installeret iOS-PWA) males
     safe-area/hak-området og overscroll-kanterne ud fra CSS-spec'ens
     "canvas background" — som pr. spec tages fra <html>'s baggrund, og
     kun falder tilbage til <body>'s hvis html slet ingen har. Både
     `body{background}` og en separat `position:fixed`-div (begge afprøvet
     tidligere) blev konsekvent overtrumfet af den blanke standardfarve i
     netop det område i en installeret PWA — html-baggrunden er den eneste
     der faktisk regnes med til canvas'en. */
  html{
    background:
      radial-gradient(ellipse at 20% -10%, #12666b 0%, transparent 100%),
      radial-gradient(ellipse at 100% 0%, #0e5a5f 0%, transparent 100%),
      linear-gradient(180deg, var(--sea) 0%, var(--sea-deep) 100%);
    /* `background` er en shorthand og nulstiller ALT den ikke selv nævner
       — inkl. attachment/repeat. Uden disse to linjer bliver attachment
       "scroll" og repeat "repeat", så gradienten FLISER (gentager sig)
       med en hård søm så snart siden er højere end én skærm (fx et langt
       brok-feed) — præcis samme sømfejl som tidligere er set og rettet på
       både Brokkekassen og MrBrok, nu genopstået fordi den blev glemt da
       gradienten flyttede fra body til html. */
    background-attachment:fixed; background-repeat:no-repeat;
    /* De øverste ca. 30px (statusbar/hak-området) i en installeret iOS-PWA
       lader IKKE til at male selve gradient-billedet, kun en flad farve —
       formentlig fordi det translucent-komposit-lag iOS lægger ovenpå kun
       kender til `background-color`, ikke `background-image`. I stedet for
       at blive ved med at jagte en "ægte" pixel-perfekt løsning på det
       (afprøvet 3 forskellige tilgange uden held), blander vi det i stedet:
       sætter background-color eksplicit til den lyseste farve fra selve
       gradienten, så den flade strimmel matcher det den støder op til i
       stedet for at være en tilfældig anden nuance. Skal stå EFTER
       shorthand'en ovenfor, ellers nulstiller shorthanden den igen. */
    background-color:#12666b;
    transition:background .7s ease, background-color .7s ease;
  }
  /* MrBrok får sit eget mørke "efterforskningslokale" i stedet for det
     fælles teal — klassen sættes på <html> (ikke body), netop fordi det
     er html's baggrund der tæller for canvas'en. Samme shorthand-fælde
     gælder her, så attachment/repeat gentages eksplicit. */
  html.theme-mrbrok{
    background:
      radial-gradient(ellipse at 30% -10%, rgba(255,201,60,0.14) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(255,201,60,0.06) 0%, transparent 60%),
      linear-gradient(180deg, var(--noir) 0%, var(--noir-deep) 100%);
    background-attachment:fixed; background-repeat:no-repeat;
    background-color: var(--noir);
  }
  /* Det Store Brokkeri får sin egen varme rust/ember-baggrund i stedet for
     at genbruge MrBroks kølige noir-tema — de to spil skal ikke se ud af
     samme familie. Ember matcher stemningen bedre: brok der koger over,
     ikke en efterforskning. Samme klasse-placering-mønster som theme-mrbrok. */
  html.theme-complainer{
    background:
      radial-gradient(ellipse at 30% -10%, rgba(255,122,61,0.22) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 10%, rgba(255,90,54,0.14) 0%, transparent 60%),
      linear-gradient(180deg, var(--ember-noir) 0%, var(--ember-noir-deep) 100%);
    background-attachment:fixed; background-repeat:no-repeat;
    background-color: var(--ember-noir);
  }
  /* Rose-bonusrunden får sin egen tydeligt lyserøde/marmorerede baggrund
     mens den står på (skiftes tilbage til det fælles teal så snart runden
     er slut) — hele pointen er at det IKKE skal ligne resten af Brokspillet,
     så det er klart uden at skulle læse noget at "nu handler det ikke om
     brok". Samme mønster/klasse-placering som theme-mrbrok. */
  html.theme-rose{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(255,200,220,0.32) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 15%, rgba(255,143,179,0.28) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 90%, rgba(255,180,205,0.16) 0%, transparent 65%),
      linear-gradient(180deg, #6b2648 0%, #3a1530 100%);
    background-attachment:fixed; background-repeat:no-repeat;
    background-color: #3a1530;
  }
  body{
    margin:0; font-family:'Work Sans', system-ui, sans-serif;
    background:transparent;
    color:var(--cream); min-height:100dvh; overflow-x:hidden;
    -webkit-tap-highlight-color: transparent; user-select:none;
    -webkit-overflow-scrolling: touch;
    position:relative;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  button{font-family:inherit;}
  #app{ max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  header{ padding:20px 20px 6px; display:flex; flex-direction:column; gap:4px; position:relative; }
  header .title{ font-size:26px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; }
  header .title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header .title span{color:var(--coin);}

  /* Subtil per-app-nuance så man kan se hvilket "rum" man er i uden at
     læse titlen — Brokkekassen er den fælles/neutrale (teal, uændret),
     Brokspillet får en varm guld-glød (matcher mønt-temaet), MrBrok en
     lidt mystisk lilla-glød (matcher detektiv-temaet). Kun headeren
     nuanceres — resten af skærmen holder sig til det fælles tema. */
  header.theme-spil::before, header.theme-mrbrok::before, header.theme-rose::before, header.theme-complainer::before{
    content:''; position:absolute; inset:-10px -10px auto -10px; height:110px; pointer-events:none; z-index:-1;
    -webkit-mask-image:linear-gradient(180deg, #000 0%, transparent 100%); mask-image:linear-gradient(180deg, #000 0%, transparent 100%);
  }
  header.theme-spil::before{ background:radial-gradient(ellipse at 30% 0%, rgba(255,201,60,0.28), transparent 70%); }
  header.theme-mrbrok::before{ background:radial-gradient(ellipse at 30% 0%, rgba(255,201,60,0.2), transparent 70%); }
  header.theme-rose::before{ background:radial-gradient(ellipse at 30% 0%, rgba(255,143,179,0.4), transparent 70%); }
  header.theme-complainer::before{ background:radial-gradient(ellipse at 30% 0%, rgba(255,122,61,0.3), transparent 70%); }
  header.theme-spil #btnAppMenu, header.theme-spil #btnGameAdminMenu{ border-color:rgba(255,201,60,0.4); }
  header.theme-rose #btnAppMenu, header.theme-rose #btnGameAdminMenu{ border-color:rgba(255,143,179,0.5); }
  header.theme-mrbrok #btnAppMenu, header.theme-mrbrok #btnGameAdminMenu, header.theme-mrbrok #btnMrbrokAdminMenu{ border-color:rgba(255,201,60,0.3); }
  header.theme-complainer #btnAppMenu, header.theme-complainer #btnGameAdminMenu{ border-color:rgba(255,122,61,0.4); }
  /* Rolle-splash ved spilstart — egen mørk/guld visning (ligesom MrBroks
     "efterforskningslokale"), IKKE Brokspillets lyse sheet-stil, så den ikke
     et kort øjeblik ligner det forkerte spil. Vises kun ÉN gang pr. nyt spil. */
  /* Baggrunden er bevidst HELT uigennemsigtig (ikke rgba med alpha som
     resten af appens overlays) — splashen skal dække 100% af skærmen uden
     at headeren bag ved kan skinne let igennem foroven, uanset hvordan
     safe-area/100%-højde regner sig ud på den enkelte telefon. */
  .mrbrok-splash-backdrop{ position:fixed; inset:0; background:var(--noir-deep); z-index:92; display:flex; align-items:stretch; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .mrbrok-splash-backdrop.show{ opacity:1; pointer-events:auto; }
  /* Fylder hele skærmen i stedet for at være endnu et lille kort — det er
     spillets vigtigste instruktion, den skal ikke konkurrere om pladsen med
     resten af skærmen, og skriften skal kunne læses fra den anden ende af
     sofabordet, ikke kun tæt på skærmen. */
  .mrbrok-splash{ background:linear-gradient(160deg, #17110a, var(--noir-deep)); width:100%; max-width:520px; height:100%; overflow-y:auto; padding:calc(32px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom)); box-shadow:0 0 60px rgba(255,201,60,.1) inset; text-align:center; display:flex; flex-direction:column; justify-content:center; transform:translateY(10px) scale(.98); transition:transform .25s cubic-bezier(.2,.9,.3,1.2); }
  .mrbrok-splash-backdrop.show .mrbrok-splash{ transform:translateY(0) scale(1); }
  .mrbrok-splash h3{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:30px; line-height:1.25; color:var(--coin); margin:8px 0 28px; }
  .mrbrok-splash ul{ text-align:left; margin:0 0 22px; padding:0; list-style:none; }
  /* Kun instruktions-listen er skaleret ned (ikke overskriften/hvem-du-er,
     se h3 ovenfor) — mindre scroll for at nå "Forstået"-knappen, uden at
     gå på kompromis med selve rolle-afsløringen som stadig skal kunne
     læses fra den anden ende af sofabordet. */
  .mrbrok-splash li{ display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; font-size:14.5px; line-height:1.4; font-weight:600; color:rgba(255,247,232,0.65); }
  .mrbrok-splash li b{ color:rgba(255,247,232,0.98); font-weight:800; }
  .mrbrok-splash li span:first-child{ flex:0 0 auto; font-size:22px; line-height:1.2; }
  .mrbrok-splash li span:last-child{ flex:1 1 auto; min-width:0; }
  /* Samme struktur som .mrbrok-splash ovenfor, men i Det Store Brokkeris egen
     ember-farvevej i stedet for MrBroks noir/guld — se theme-complainer.
     Bruges bl.a. til den PRIVATE afsløringssplash: uden en tydelig,
     umulig-at-overse skærm her risikerer den skyldige spiller reelt at
     overse at deres tur er kommet (fx pga. push der ikke er sat op/blev
     afvist), og resten af bordet oplever spillet som "gået i stå" — se
     maybeShowComplainerRevealSplash. */
  .complainer-splash-backdrop{ position:fixed; inset:0; background:var(--ember-noir-deep); z-index:92; display:flex; align-items:stretch; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .complainer-splash-backdrop.show{ opacity:1; pointer-events:auto; }
  .complainer-splash{ background:linear-gradient(160deg, #3a1608, var(--ember-noir-deep)); width:100%; max-width:520px; height:100%; overflow-y:auto; padding:calc(32px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom)); box-shadow:0 0 60px rgba(255,122,61,.16) inset; text-align:center; display:flex; flex-direction:column; justify-content:center; transform:translateY(10px) scale(.98); transition:transform .25s cubic-bezier(.2,.9,.3,1.2); }
  .complainer-splash-backdrop.show .complainer-splash{ transform:translateY(0) scale(1); }
  .complainer-splash h3{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:30px; line-height:1.25; color:var(--ember); margin:8px 0 20px; }
  .complainer-splash p{ font-size:17px; line-height:1.5; color:rgba(255,247,232,0.85); font-weight:600; margin:0 0 22px; }
  .complainer-splash ul{ text-align:left; margin:0 0 22px; padding:0; list-style:none; }
  .complainer-splash li{ display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; font-size:14.5px; line-height:1.4; font-weight:600; color:rgba(255,247,232,0.65); }
  .complainer-splash li b{ color:rgba(255,247,232,0.98); font-weight:800; }
  .complainer-splash li span:first-child{ flex:0 0 auto; font-size:22px; line-height:1.2; }
  .complainer-splash li span:last-child{ flex:1 1 auto; min-width:0; }
  /* Samme struktur igen, men rummets EGEN farvevej (sea/coin) — vises kun én
     gang, lige efter rummet er oprettet, for at forklare hvor mange "ting"
     der bor i samme rum og hvordan man skifter mellem dem (☰-menuen). Se
     showRoomIntroSplash. */
  .room-splash-backdrop{ position:fixed; inset:0; background:var(--sea-deep); z-index:92; display:flex; align-items:stretch; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .room-splash-backdrop.show{ opacity:1; pointer-events:auto; }
  .room-splash{ background:linear-gradient(160deg, var(--sea), var(--sea-deep)); width:100%; max-width:520px; height:100%; overflow-y:auto; padding:calc(32px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom)); box-shadow:0 0 60px rgba(255,201,60,.1) inset; text-align:center; display:flex; flex-direction:column; justify-content:center; transform:translateY(10px) scale(.98); transition:transform .25s cubic-bezier(.2,.9,.3,1.2); }
  .room-splash-backdrop.show .room-splash{ transform:translateY(0) scale(1); }
  .room-splash h3{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:28px; line-height:1.25; color:var(--coin); margin:8px 0 20px; }
  .room-splash p{ font-size:16px; line-height:1.5; color:rgba(255,247,232,0.85); font-weight:600; margin:0 0 22px; }
  .room-splash ul{ text-align:left; margin:0 0 22px; padding:0; list-style:none; }
  .room-splash li{ display:flex; gap:14px; align-items:flex-start; margin-bottom:14px; font-size:14.5px; line-height:1.4; font-weight:600; color:rgba(255,247,232,0.65); }
  .room-splash li b{ color:rgba(255,247,232,0.98); font-weight:800; }
  .room-splash li span:first-child{ flex:0 0 auto; font-size:22px; line-height:1.2; }
  .room-splash li span:last-child{ flex:1 1 auto; min-width:0; }
  /* Skal kunne skimmes — den vigtigste handling pr. linje er fremhævet med
     <b>, resten er kun understøttende kontekst. Rammer kun ren-tekst <b>
     uden egen inline-farve, så alle de andre stedspecifikke <b style="...">
     i appen IKKE overskrives (inline style vinder altid over denne regel). */
  .game-card p b{ color:rgba(255,247,232,0.98); }
  .day-chip{ display:inline-block; font-size:12px; font-weight:600; background:rgba(255,247,232,0.1); border:1px solid rgba(255,247,232,0.18); padding:5px 10px; border-radius:100px; white-space:nowrap; vertical-align:middle; }

  .jar-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; padding:6px 20px 4px; }
  .jar-svg{ width: min(72vw, 300px); height:auto; display:block; filter: drop-shadow(0 18px 24px rgba(0,0,0,0.35)); }
  .jar-total{ position:absolute; top:52%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
  .jar-total .amt{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:38px; color:var(--ink); line-height:1; }
  .jar-total .lbl{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .tabs{ display:flex; gap:6px; padding:14px 20px 10px; }
  .tab{ flex:1; text-align:center; padding:9px 6px; border-radius:100px; font-size:13px; font-weight:600; background:rgba(255,247,232,0.06); border:1px solid rgba(255,247,232,0.12); color:rgba(255,247,232,0.65); cursor:pointer; transition:all .15s ease; }
  .tab.active{ background:var(--cream); color:var(--sea-deep); border-color:var(--cream); }

  .segmented{ display:flex; gap:2px; background:rgba(255,247,232,0.06); border-radius:100px; padding:3px; margin-bottom:16px; }
  .segmented .seg{ flex:1; text-align:center; padding:7px 6px; border-radius:100px; font-size:12px; font-weight:700; color:rgba(255,247,232,0.5); cursor:pointer; transition:all .15s ease; }
  .segmented .seg.active{ background:rgba(255,247,232,0.15); color:var(--cream); }

  .slot-banner{ display:inline-block; background:linear-gradient(135deg, var(--coral), #e14d2e); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; letter-spacing:.02em; padding:9px 20px; border-radius:8px; margin-bottom:16px; box-shadow:0 8px 18px rgba(255,107,74,.4); clip-path:polygon(4% 0%, 96% 0%, 100% 50%, 96% 100%, 4% 100%, 0% 50%); }

  .game-badge{ display:inline-block; background:linear-gradient(135deg, var(--coral), #e14d2e); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:12.5px; letter-spacing:.02em; padding:7px 16px; border-radius:100px; margin-bottom:14px; box-shadow:0 6px 14px rgba(255,107,74,.35); }
  @keyframes timerPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .game-timer-urgent{ animation:timerPulse .8s ease-in-out infinite; display:inline-block; }
  .waiting-pill{ display:flex; align-items:center; justify-content:center; gap:9px; background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.18); border-radius:100px; padding:11px 18px; margin-top:12px; font-size:14.5px; font-weight:700; color:rgba(255,247,232,0.85); }
  .waiting-pill .waiting-dot{ width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--coin); animation:waitingBlink 1.1s ease-in-out infinite; }
  @keyframes waitingBlink{ 0%,100%{opacity:.25;} 50%{opacity:1;} }
  /* Brok-mekanikken der erstatter en ambient nedtælling: den voksende
     "brok over ..."-knap er ren ambient tidsindikator (ingen tal), og
     dukker først op når man selv er færdig OG mindst 30s er gået. Banneret
     +nedtælling vises kun EFTER et reelt brok (menneske eller Brokspillet). */
  .complain-btn{ display:block; width:100%; margin-top:12px; padding:12px 16px; border:1px solid rgba(255,107,74,0.35); border-radius:100px; background:rgba(255,107,74,0.12); color:rgba(255,247,232,0.9); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; cursor:pointer; transition:transform .2s ease, opacity .2s ease; }
  .complain-btn:active{ transform:scale(0.97) !important; }
  .complaint-banner{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding:12px 16px; border-radius:16px; background:rgba(255,77,46,0.16); border:1px solid rgba(255,77,46,0.4); color:rgba(255,247,232,0.95); font-size:13.5px; line-height:1.35; }
  .complaint-countdown{ flex:0 0 auto; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:#FFD9CC; animation:timerPulse .8s ease-in-out infinite; }
  /* MrBrok: alt der IKKE er ens egen tur dæmpes tydeligt ned — man skal
     kunne se med det samme, uden at læse, om det er en selv der har ordet
     eller ej. */
  .mrbrok-dim{ opacity:.55; filter:grayscale(.3); }
  @keyframes slotWinPop{ 0%{ transform:scale(1) rotate(0deg); } 30%{ transform:scale(1.06) rotate(-1.5deg); } 55%{ transform:scale(1.03) rotate(1.5deg); } 100%{ transform:scale(1) rotate(0deg); } }
  .quip-slot-win{ animation:slotWinPop .5s ease-out; }
  /* Spillets slut-skærm: vinderen fejres, taberen får en lidt komisk
     "dømt"-rystning i stedet for bare flad tekst. */
  @keyframes gameoverWinnerPop{ 0%{ transform:scale(.7); opacity:0; } 55%{ transform:scale(1.14); opacity:1; } 75%{ transform:scale(.96); } 100%{ transform:scale(1); } }
  .gameover-winner-pop{ animation:gameoverWinnerPop .6s cubic-bezier(.34,1.56,.64,1); display:inline-block; }
  /* Det oprindelige pop var overstået på under et sekund og frøs derefter
     helt stille — nem at overse hvis man kigger væk et øjeblik. En blid,
     LØBENDE glød efter pop'et holder vinderen synligt fejret resten af
     tiden man står på skærmen, ikke kun det første halve sekund. */
  @keyframes gameoverWinnerGlow{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(255,201,60,0)); } 50%{ filter:drop-shadow(0 0 10px rgba(255,201,60,.85)); } }
  .gameover-winner-glow{ display:inline-block; animation:gameoverWinnerGlow 1.6s ease-in-out .6s infinite; }
  @keyframes gameoverLoserShake{ 0%,100%{ transform:translateX(0) rotate(0deg); } 15%{ transform:translateX(-6px) rotate(-2deg); } 30%{ transform:translateX(5px) rotate(2deg); } 45%{ transform:translateX(-4px) rotate(-1.5deg); } 60%{ transform:translateX(3px) rotate(1deg); } 75%{ transform:translateX(-2px) rotate(-.5deg); } }
  .gameover-loser-shake{ animation:gameoverLoserShake .7s ease-in-out .5s; }
  @keyframes gameoverLoserDroop{ 0%{ transform:translateY(0) rotate(0deg); } 100%{ transform:translateY(4px) rotate(-8deg); } }
  .gameover-loser-droop{ display:inline-block; animation:gameoverLoserDroop .6s ease-out 1.1s forwards; }
  /* Samme idé som vinderens glød: en langsom, evig sørgmodig vippen i
     stedet for at fryse helt stille lige efter den korte rysten+drop. */
  @keyframes gameoverLoserSway{ 0%,100%{ transform:translateY(4px) rotate(-8deg); } 50%{ transform:translateY(7px) rotate(-11deg); } }
  .gameover-loser-sway{ display:inline-block; animation:gameoverLoserSway 2.2s ease-in-out 1.7s infinite; }
  /* "Chancen" genbruger nu selve spillemaskine-designet fra Brokkekassens
     daglige lodtrækning (.slot-cabinet/.slot-window/.reel osv. herunder) i
     stedet for sin egen chip-reel — samme genkendelige "🎰 3 hjul lander på
     samme vinder"-følelse, bare med Brokspillets egne kandidater som symboler. */
  .game-card{ background:linear-gradient(160deg, rgba(255,201,60,0.18), rgba(255,107,74,0.10)); border:1px solid rgba(255,201,60,0.35); border-radius:22px; padding:20px; box-shadow:0 10px 24px rgba(0,0,0,.18); }
  /* Skjult rolle/emne-felt — bevidst mere "tomt"/dæmpet end de normale
     game-card'er, så det tydeligt læses som "der er noget skjult her at
     trykke på", ikke bare endnu et almindeligt indholds-kort. */
  .mrbrok-role-hidden{ background:rgba(255,247,232,0.04); border:1px dashed rgba(255,247,232,0.25); }
  .game-card p{ color:var(--cream); }
  .game-btn{ display:block; width:100%; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:15px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; box-shadow:0 8px 18px rgba(255,107,74,0.35); cursor:pointer; margin-top:14px; }
  .game-btn:active{ transform:scale(.98); }
  .game-btn:disabled{ background:rgba(255,247,232,0.12); color:rgba(255,247,232,0.4); box-shadow:none; cursor:not-allowed; }
  .game-btn.ghost{ background:transparent; box-shadow:none; color:rgba(255,247,232,0.75); font-weight:600; font-size:14px; padding:10px; }
  .game-progress{ display:flex; align-items:center; gap:10px; margin:14px 4px; font-size:12.5px; font-weight:600; color:rgba(255,247,232,0.65); }
  .game-progress .bar-track{ flex:1; }
  .game-pick{ background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); }
  .game-pick:hover{ background:rgba(255,247,232,0.13); }
  .game-countdown{ position:fixed; inset:0; z-index:96; display:flex; align-items:center; justify-content:center; background:rgba(3,20,22,0.72); pointer-events:none; }
  .game-countdown-num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:120px; color:var(--coin); text-shadow:0 8px 24px rgba(0,0,0,.4); }
  .slot-cabinet{ background:linear-gradient(160deg,#2e2a24,#141414); border-radius:24px; padding:16px 12px 14px; box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #8a6b1f; position:relative; }
  .slot-cabinet::before, .slot-cabinet::after{ content:''; position:absolute; top:10px; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe9a8, #b8860b); box-shadow:0 0 6px rgba(255,201,60,.6); }
  .slot-cabinet::before{ left:12px; } .slot-cabinet::after{ right:12px; }
  .slot-cabinet.win{ box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #FFC93C, 0 0 24px rgba(255,201,60,.5); }
  .slot-window{ display:flex; gap:6px; background:#0a0a0a; border-radius:14px; padding:8px; box-shadow:inset 0 3px 14px rgba(0,0,0,.9); }
  .reel{ flex:1; height:58px; overflow:hidden; border-radius:9px; background:rgba(255,255,255,0.03); position:relative; }
  .reel::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.6), transparent 30%, transparent 70%, rgba(0,0,0,.6)); pointer-events:none; z-index:2; }
  .reel-strip{ position:absolute; top:0; left:0; right:0; }
  .reel-symbol{ height:58px; display:flex; align-items:center; justify-content:center; }
  .reel-symbol .avatar{ width:40px; height:40px; font-size:14px; }
  .slot-lever{ display:block; margin:18px auto 0; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:13px 26px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; box-shadow:0 8px 18px rgba(255,107,74,.4); cursor:pointer; }
  .slot-lever:active{ transform:scale(.97); }
  .slot-lever:disabled{ opacity:.5; }
  .slot-winner-name{ text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--coral); margin-top:14px; opacity:0; }
  /* Vinderens ord stod tidligere kun i kandidat-listen under hjulet — man
     skulle scrolle for at se HVAD der rent faktisk vandt, ikke bare hvem.
     Vises nu lige under navnet, samme sted øjet allerede kigger. */
  .slot-winner-word{ text-align:center; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; font-style:italic; color:var(--cream); margin-top:4px; opacity:0; }
  /* Chancens nye standard-visning: et lykkehjul, i samme mørke/guld
     kabinet-stil som spillemaskinen ovenfor (som stadig ligger urørt som
     reserve — se buildSlotCabinetHtml/playSlotChanceReveal). */
  .wheel-cabinet{ background:radial-gradient(circle at 50% 38%, #3a2f1a, #141414 72%); border-radius:24px; padding:16px 8px 14px; box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #8a6b1f; position:relative; display:flex; flex-direction:column; align-items:center; }
  .wheel-cabinet.win{ box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #FFC93C, 0 0 24px rgba(255,201,60,.5); }
  .wheel-pointer{ position:absolute; left:50%; top:4px; transform:translateX(-50%); width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-top:20px solid var(--coin); z-index:3; filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)); }
  .wheel-pointer::before{ content:''; position:absolute; left:50%; top:-24px; transform:translateX(-50%); width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6d0, var(--coin) 60%, #b8860b); box-shadow:0 0 6px rgba(255,201,60,.8); }
  .wheel-wrap{ position:relative; width:270px; height:270px; margin:14px 0 4px; }
  .wheel-lights{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .wheel-bulb{ position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6d0, var(--coin) 60%, #b8860b); box-shadow:0 0 6px rgba(255,201,60,.75); animation:bulbTwinkle 1.6s ease-in-out infinite; }
  @keyframes bulbTwinkle{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
  .wheel-svg{ position:relative; z-index:2; width:100%; height:100%; display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
  /* Spinnet roteres på en INDRE <g>, IKKE på selve <svg>-roden — CSS
     transform på en SVG-rod blander SVG'ens egen koordinat-transform sammen
     med CSS-boksens, hvilket i praksis viste sig upålideligt på tværs af
     browsere (tekst-labels der "slipper" deres stykke under et langt/hurtigt
     spin, mens selve stykkerne roterer korrekt — de deler ikke nødvendigvis
     samme kompositerings-lag). En <g> med et eksplicit transform-origin i
     SVG-brugerenheder er entydig og opfører sig ens alle steder.
     will-change beder browseren kompositere HELE gruppen (stykker+labels)
     som ét samlet GPU-lag i stedet for at risikere de behandles separat. */
  .wheel-spin-group{ transform-origin:110px 110px; will-change:transform; }
  .wheel-slice-win{ filter:drop-shadow(0 0 5px rgba(255,201,60,.9)); }
  /* Kort glimt lige når hjulet vises, FØR selve spinnet begynder — så hver
     spiller med det samme kan se (uden at læse) at deres eget ord rent
     faktisk er på hjulet. Kun stykker/tekst der matcher DEN VIEWENDE
     spillers eget id får klassen (se pulseMyWordOnWheel). */
  @keyframes wheelMyWordGlow{ 0%,100%{ filter:none; } 50%{ filter:drop-shadow(0 0 6px #FFF7E8) drop-shadow(0 0 16px #FFC93C); } }
  .wheel-my-word-pulse{ animation:wheelMyWordGlow .7s ease-in-out 3; }
  @keyframes wheelMyWordTextPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.4); } }
  .wheel-my-word-text-pulse{ transform-box:fill-box; transform-origin:center; animation:wheelMyWordTextPulse .7s ease-in-out 3; }
  /* Selve vinder-flashet efter landing — samme glød som "bekræft mit ord",
     men tydeligt LÆNGERE og et par ekstra gentagelser, så det faktisk
     bliver set midt i konfetti-regnen i stedet for at være overstået på
     under et sekund. */
  .wheel-winner-flash{ animation:wheelMyWordGlow .8s ease-in-out 5; }
  .wheel-winner-text-flash{ transform-box:fill-box; transform-origin:center; animation:wheelMyWordTextPulse .8s ease-in-out 5; }
  /* Chancens standard-visning ved uafgjort/2-spiller-skip: whack-a-mole,
     rent tilfældig elimination — ingen valg involveret, matcher hvad
     Chancen faktisk ER lige nu (se buildMoleChanceHtml/playMoleChanceReveal).
     Hjulet (ovenfor) er i stedet reserveret til en fremtidig funktion hvor
     spillere selv VÆLGER et brok-ord, og der trækkes lod blandt de valg. */
  /* Lysere, varmere træ-gradient end den gamle næsten-sorte version — det
     er muldvarpene og hullerne der skal fange øjet, ikke en mørk kasse
     omkring dem. Mindre padding så hullerne fylder kabinettet ud, samme
     "fyld pladsen" -tankegang som hjulet fik i wheel-wrap-fixet. */
  .mole-cabinet{ background:linear-gradient(160deg,#8a6238,#5c4128); border-radius:24px; padding:8px 6px 8px; box-shadow:0 12px 26px rgba(0,0,0,.35), inset 0 0 0 3px #d9a84a; position:relative; width:100%; box-sizing:border-box; overflow-x:hidden; }
  .mole-cabinet.win{ box-shadow:0 12px 26px rgba(0,0,0,.35), inset 0 0 0 3px #FFC93C, 0 0 24px rgba(255,201,60,.5); }
  /* Fast 2 pr. række (ikke "så mange der er plads til") — ellers skifter
     antallet af pr.-række afhængig af skærmbredde og kandidatantal, hvilket
     så uforudsigeligt ud. En ulige sidste kandidat spænder over begge
     kolonner på sin egen række, så den lander centreret i stedet for skævt
     ude i venstre side. Hullerne var tidligere langt smallere end hjulets
     bredde (210px total vs. wheel-wrap's 270px) — det er DET "går ikke til
     kant"-indtrykket. Bredere huller/wrapper matcher nu samme totalbredde.*/
  .mole-grid{ display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); justify-items:center; gap:8px; padding:2px; }
  .mole-hole-wrap:last-child:nth-child(odd){ grid-column: 1 / -1; }
  /* Fast px-bredde overflowede skærmen på smallere telefoner (128px×2 +
     mellemrum + kabinet-padding kunne blive bredere end selve viewportet,
     så anden muldvarp blev klippet af). minmax(0,1fr) på gridet + procent-
     bredde her betyder hullerne altid retter sig efter den PLADS der
     faktisk er, med en øvre grænse så de heller ikke bliver kæmpestore på
     brede skærme. */
  .mole-hole-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; width:100%; max-width:132px; padding-top:22px; }
  .mole-hole{ position:relative; width:100%; max-width:104px; aspect-ratio:1/1; border-radius:50%; background:radial-gradient(circle at 50% 30%, #5c4128, #241a10); overflow:hidden; box-shadow:inset 0 4px 10px rgba(0,0,0,.6); }
  /* Håndbygget hammer (ikke emoji'en 🔨) — emoji-glyffer skalerer og
     proportionerer forskelligt på tværs af telefoner/skrifttyper, hvilket
     gjorde den svær at ramme rigtigt i størrelse. Hoved + skaft som to
     simple div'er der roterer samlet giver fuld kontrol over proportionerne
     og en tydeligere silhuet på en lille mobilskærm. */
  .mole-hammer{ position:absolute; top:-20px; left:50%; width:74px; height:79px; margin-left:-37px; transform:rotate(-60deg); transform-origin:76% 86%; opacity:0; pointer-events:none; z-index:5; }
  .mole-hammer-head{ position:absolute; top:0; left:10px; width:52px; height:30px; border-radius:6px; background:linear-gradient(160deg,#d99a5b,#8a5a28); box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 -3px 5px rgba(0,0,0,.3); }
  .mole-hammer-handle{ position:absolute; top:22px; left:30px; width:12px; height:54px; border-radius:4px; background:linear-gradient(180deg,#8a5a30,#4a2c14); }
  @keyframes hammerWhack{ 0%{ transform:rotate(-60deg); opacity:1; } 45%{ transform:rotate(24deg) translateY(28px); opacity:1; } 62%{ transform:rotate(16deg) translateY(22px); opacity:1; } 100%{ transform:rotate(-60deg); opacity:0; } }
  .mole-hammer.whacking{ animation:hammerWhack .5s cubic-bezier(.36,.07,.19,.97); }
  /* Introduktions-hammer, centreret over kabinettet mellem hullerne — rammer
     IKKE noget hul, bare et frit sted, ren "her er hammeren, spillet er i
     gang"-fornemmelse før den rigtige afbankning begynder (se
     playMoleChanceReveal's intro-fase). Genbruger samme hoved/skaft-stil
     som per-hul-hammerne, bare placeret centralt i stedet for over et
     specifikt hul. */
  .mole-intro-hammer{ position:absolute; top:6px; left:50%; width:74px; height:79px; margin-left:-37px; transform:rotate(-60deg); transform-origin:76% 86%; opacity:0; pointer-events:none; z-index:6; }
  /* "Præsentationen" — hammeren letter ind KÆMPESTOR (så man ikke er i tvivl
     om at det er DEN der er hovedpersonen lige nu), krymper ned til sin
     rigtige størrelse med et lille bounce, og BLIVER SÅ SYNLIG (i stedet for
     usynlig som base-tilstanden) mens 3-2-1-nedtællingen løber. Bagefter
     toner den ud igen og overlader selve banket til de rigtige per-hul-
     hamre (se .fading + playMoleChanceReveal) — al "vil den ramme/ramte
     den ikke"-tvivl er væk, det her er ren optakt/præsentation. */
  @keyframes introHammerEnter{ 0%{ opacity:0; transform:rotate(-60deg) scale(2.6); } 55%{ opacity:1; transform:rotate(-60deg) scale(.82); } 100%{ opacity:1; transform:rotate(-60deg) scale(1); } }
  .mole-intro-hammer.entering{ animation:introHammerEnter .6s cubic-bezier(.25,.85,.3,1.2) forwards; }
  .mole-intro-hammer.fading{ transition:opacity .35s ease; opacity:0; }
  .mole-intro-hammer.whacking{ animation:hammerWhack .5s cubic-bezier(.36,.07,.19,.97); }
  .mole-countdown{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; pointer-events:none; }
  .mole-countdown-num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:64px; color:#FFC93C; text-shadow:0 4px 14px rgba(0,0,0,.55); }
  .mole{ position:absolute; left:50%; bottom:-8px; width:74px; height:74px; transform:translate(-50%, -18px); z-index:1; transition:transform .3s ease; }
  .mole .avatar{ position:relative; width:74px; height:74px; font-size:23px; transition:opacity .18s ease; }
  @keyframes moleWinPop{ 0%{ transform:translate(-50%,-18px) scale(1); } 35%{ transform:translate(-50%,-24px) scale(1.15) rotate(-4deg); } 65%{ transform:translate(-50%,-18px) scale(1.05) rotate(4deg); } 100%{ transform:translate(-50%,-18px) scale(1) rotate(0deg); } }
  .mole.mole-win{ animation:moleWinPop .5s ease-out; }
  /* Et rent squash så ud som en fejl, ikke et hit. I stedet splintres
     avataren i stumper der spreder sig og falder ned i hullet, og bliver
     mørkere undervejs — "det gik i stykker dernede", ikke "det blev
     fladtrykt". Molen selv synker en anelse (se .mole.mole-hit ovenfor via
     transition på .mole), mens avataren blegner og stumperne (se
     .mole-shard) flyver fra hinanden og lander som mørkt vraggods. */
  .mole.mole-hit{ transform:translate(-50%, 6px); }
  .mole.mole-hit .avatar{ opacity:0; }
  .mole-shard{ position:absolute; top:0; left:0; width:74px; height:74px; border-radius:50%; background:linear-gradient(160deg, var(--coral), #e14d2e); opacity:0; }
  .mole-shard.s1{ clip-path:polygon(50% 50%, 48% 0%, 100% 0%, 100% 62%); }
  .mole-shard.s2{ clip-path:polygon(50% 50%, 100% 62%, 52% 100%, 0% 100%); }
  .mole-shard.s3{ clip-path:polygon(50% 50%, 0% 100%, 0% 0%, 48% 0%); }
  @keyframes shardFall1{ 0%{ opacity:0; transform:translate(0,0) rotate(0deg) scale(1); filter:brightness(1) saturate(1); } 14%{ opacity:1; transform:translate(-8px,-8px) rotate(-12deg) scale(1.04); filter:brightness(1) saturate(1); } 100%{ opacity:.9; transform:translate(-18px,10px) rotate(-58deg) scale(.55); filter:brightness(.62) saturate(1.3); } }
  @keyframes shardFall2{ 0%{ opacity:0; transform:translate(0,0) rotate(0deg) scale(1); filter:brightness(1) saturate(1); } 14%{ opacity:1; transform:translate(2px,-10px) rotate(6deg) scale(1.04); filter:brightness(1) saturate(1); } 100%{ opacity:.85; transform:translate(4px,16px) rotate(30deg) scale(.5); filter:brightness(.58) saturate(1.3); } }
  @keyframes shardFall3{ 0%{ opacity:0; transform:translate(0,0) rotate(0deg) scale(1); filter:brightness(1) saturate(1); } 14%{ opacity:1; transform:translate(9px,-7px) rotate(14deg) scale(1.04); filter:brightness(1) saturate(1); } 100%{ opacity:.9; transform:translate(17px,9px) rotate(52deg) scale(.55); filter:brightness(.62) saturate(1.3); } }
  .mole.mole-hit .mole-shard.s1{ animation:shardFall1 .5s ease-in forwards; }
  .mole.mole-hit .mole-shard.s2{ animation:shardFall2 .5s ease-in forwards .04s; }
  .mole.mole-hit .mole-shard.s3{ animation:shardFall3 .5s ease-in forwards .08s; }
  @keyframes moleImpactFlash{ 0%{ opacity:.95; transform:translate(-50%,-50%) scale(.15); } 55%{ opacity:.55; transform:translate(-50%,-50%) scale(1.35); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.7); } }
  /* Egen, STILLESTÅENDE flash-boks i selve hullet (ikke på molen, som nu
     bevæger sig væk) — nedslags-glimtet skal sidde fast ét sted, ikke rejse
     med molen ned i hullet. */
  .mole-impact{ position:absolute; inset:0; border-radius:50%; pointer-events:none; z-index:4; }
  .mole-impact.hit::before{ content:''; position:absolute; top:50%; left:50%; width:96px; height:96px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 68%); transform:translate(-50%,-50%); opacity:0; animation:moleImpactFlash .4s ease-out; }
  .mole-name-tag{ font-size:11.5px; font-weight:700; color:rgba(255,247,232,0.55); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mole-name-tag.win{ color:var(--coin); font-weight:800; }
  /* Fuldskærms fejrings-banner (se showMoleWinBanner) — Brokspillets eget
     teal/guld-tema, lever UDEN FOR det almindelige render()-kredsløb (append
     til body, ikke en del af app.innerHTML), så den ikke kan blive visket
     væk af et helt almindeligt gen-render fra en ANDEN spillers "klar"-tryk. */
  .mole-win-banner-backdrop{ position:fixed; inset:0; background:linear-gradient(160deg, var(--sea-deep), var(--ink)); z-index:93; display:flex; align-items:center; justify-content:center; padding:28px; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .mole-win-banner-backdrop.show{ opacity:1; pointer-events:auto; }
  .mole-win-banner{ text-align:center; max-width:420px; }
  .mole-win-banner-emoji{ font-size:56px; }
  .mole-win-banner-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; color:rgba(255,247,232,0.75); margin-top:6px; }
  .mole-win-banner-quote{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:32px; line-height:1.3; color:var(--coin); margin-top:14px; text-shadow:0 4px 18px rgba(255,201,60,.35); }
  .mole-win-banner-hint{ margin-top:28px; font-size:13px; color:rgba(255,247,232,0.5); }

  /* Rose-bonusrunden — bevidst et andet visuelt tema (lyserød, ikke guld/mønt)
     end resten af Brokspillet, så det tydeligt føles som noget andet end brok. */
  .rose-card{ background:linear-gradient(160deg, rgba(255,143,179,0.22), rgba(255,107,74,0.08)); border:1px solid rgba(255,143,179,0.4); }
  .rose-btn{ background:linear-gradient(160deg, #ff8fb3, #e14d7a); box-shadow:0 8px 18px rgba(255,143,179,0.35); }
  .rose-match-card{ background:rgba(255,143,179,0.1); border:1px solid rgba(255,143,179,0.3); border-radius:18px; padding:14px 16px; margin-bottom:12px; transition:opacity .2s ease, padding .2s ease; }
  .rose-match-text{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; margin:0 0 6px; color:var(--cream); }
  .rose-match-to{ font-size:12.5px; margin:0; color:rgba(255,247,232,0.65); }
  .rose-guess-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .rose-guess-chip{ padding:8px 14px; border-radius:100px; border:2px solid rgba(255,143,179,0.4); background:rgba(255,247,232,0.06); color:var(--cream); font-weight:700; font-size:13px; cursor:pointer; }
  /* Et kort der allerede har et gæt (eller er ens EGET, se roseHtml) fylder
     bevidst mindre og collapser — men skal stadig kunne LÆSES uden besvær:
     dæmp kun baggrund/kant (giver "afgjort"-følelsen), ikke selve teksten. */
  .rose-match-card.rose-match-locked, .rose-match-card.rose-match-mine{ padding:10px 16px; background:rgba(255,143,179,0.05); border-color:rgba(255,143,179,0.16); }
  .rose-match-card.rose-match-locked .rose-match-text, .rose-match-card.rose-match-mine .rose-match-text{ font-size:13.5px; margin-bottom:3px; color:rgba(255,247,232,0.92); }
  .rose-match-card.rose-match-locked .rose-match-to, .rose-match-card.rose-match-mine .rose-match-to{ color:rgba(255,247,232,0.8); }
  .rose-match-card.rose-match-locked .rose-match-to b, .rose-match-card.rose-match-mine .rose-match-to b{ color:#ffb3cd; }
  .rose-match-change{ cursor:pointer; text-decoration:underline; font-weight:700; color:#ff8fb3; margin-left:4px; }

  main{ flex:1; padding:0 16px 130px; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .feed-item{ background:rgba(255,247,232,0.07); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
  .avatar{ flex:0 0 auto; width:38px;height:38px; border-radius:50%; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:14px; font-family:'Baloo 2',sans-serif; }
  .feed-body{flex:1; min-width:0;}
  .feed-name{font-weight:700; font-size:14.5px; color:var(--cream);}
  .feed-name .amt{color:var(--coin); font-weight:800; margin-left:6px;}
  .feed-msg{font-size:13.5px; color:rgba(255,247,232,0.75); margin-top:2px; word-wrap:break-word;}
  .feed-time{font-size:11px; color:rgba(255,247,232,0.4); margin-top:4px;}
  .empty-state{ text-align:center; padding:50px 20px; color:rgba(255,247,232,0.55); }
  .empty-state .emoji{font-size:38px; display:block; margin-bottom:10px;}
  .empty-state b{color:var(--cream); display:block; font-family:'Baloo 2',sans-serif; font-size:17px; margin-bottom:4px;}

  .bal-row{ display:flex; align-items:center; gap:12px; background:rgba(255,247,232,0.07); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:12px 14px; margin-bottom:10px; }
  .bal-name{flex:1; font-weight:600; font-size:14.5px;}
  .bal-amt{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--coin);}
  .bal-amt.zero{color:rgba(255,247,232,0.35); font-weight:700;}
  .bal-name.me::after{ content:' (dig)'; font-weight:400; opacity:.6; font-size:12px; }

  .section-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:rgba(255,247,232,0.65); margin:14px 4px 10px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 2px; }
  .bar-track{ flex:1; height:14px; background:rgba(255,247,232,0.1); border-radius:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:10px; background:linear-gradient(90deg, var(--coin-dark), var(--coin)); transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .bar-fill.top{ background:linear-gradient(90deg, #e14d2e, var(--coral)); }
  .bar-amt{ flex:0 0 auto; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13.5px; color:var(--coin); min-width:34px; text-align:right; white-space:nowrap; }

  .history-round{ background:rgba(255,247,232,0.05); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:14px; margin-bottom:12px; }
  .history-round .hr-title{font-weight:700; font-family:'Baloo 2',sans-serif; font-size:16px; color:var(--coin);}
  .history-round .hr-sub{font-size:12px; color:rgba(255,247,232,0.65); margin-bottom:8px;}
  .hr-line{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0; color:rgba(255,247,232,0.8);}

  .bottombar{ position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, var(--sea-deep) 60%, rgba(7,59,64,0)); display:flex; gap:10px; }
  .btn-brok{ flex:1; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:16px 10px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; box-shadow:0 8px 18px rgba(255,107,74,0.35); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-brok:active{transform:scale(0.97);}
  .btn-brok:disabled{opacity:.5;}
  .btn-share{ flex:0 0 auto; width:52px; background:rgba(255,247,232,0.1); border:1px solid rgba(255,247,232,0.2); color:var(--cream); border-radius:100px; font-size:20px; }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(3,20,22,0.68); backdrop-filter: blur(2px); display:flex; align-items:flex-end; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{ width:100%; max-width:480px; margin:0 auto; background:var(--cream); color:var(--ink); border-radius:26px 26px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.3,1.2); max-height:88dvh; overflow-y:auto; }
  .sheet-backdrop.show .sheet{transform:translateY(0);}
  .sheet-handle{ width:40px;height:5px;background:rgba(5,32,36,0.18);border-radius:10px; margin:8px auto 14px; }
  .sheet h2{font-size:20px; margin:0 0 4px; font-weight:800;}
  .sheet p.hint{font-size:13px; color:rgba(5,32,36,0.55); margin:0 0 16px;}

  .name-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .name-pill{ padding:10px 16px; border-radius:100px; border:2px solid rgba(5,32,36,0.12); background:#fff; color:var(--ink); font-weight:700; font-size:14.5px; cursor:pointer; }
  .name-pill.selected{ background:var(--coral); border-color:var(--coral); color:#fff; }
  /* MrBrok's tur-rækkefølge — fast 2-kolonne gitter med lige store knapper,
     i stedet for det delte .name-grid's flex-wrap som gav uforudsigelige
     rækker afhængig af navnelængde. */
  .mrbrok-turn-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .mrbrok-turn-pill{ text-align:center; padding:10px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .name-pill.voted{ background:var(--sea); border-color:var(--sea); color:#fff; }
  .name-pill:disabled{opacity:.4;}

  textarea, input[type=text], input[type=email]{ width:100%; border:2px solid rgba(5,32,36,0.12); border-radius:14px; padding:12px 14px; font-size:15px; font-family:inherit; background:#fff; resize:none; color:var(--ink); margin-bottom:10px; }
  textarea:focus, input:focus{outline:none; border-color:var(--sea);}
  label.field-label{ font-size:12px; font-weight:700; color:rgba(5,32,36,0.5); text-transform:uppercase; letter-spacing:.05em; margin:4px 0 6px; display:block; }

  .sheet-btn{ width:100%; padding:15px; border-radius:100px; border:none; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; margin-top:14px; cursor:pointer; }
  .sheet-btn.primary{background:var(--sea); color:#fff;}
  .sheet-btn.primary:disabled{background:rgba(5,32,36,0.15); color:rgba(5,32,36,0.4);}
  .sheet-btn.ghost{background:transparent; color:rgba(5,32,36,0.5); font-weight:600; font-size:14px; padding:8px;}
  .sheet-btn.danger{background:var(--coral); color:#fff;}
  .sheet-btn.gold{background:linear-gradient(160deg, var(--coin), var(--coin-dark)); color:var(--ink);}
  .sheet-btn.test{background:rgba(5,32,36,0.14); color:var(--ink); font-weight:700;}

  /* Grupperet handlings-liste i sheets (fx ☰-menuen) — en samlet kortflade
     med ikon-chip + label pr. række, i stedet for løstflydende ghost-knapper
     uden nogen visuel beholder omkring sig. */
  .menu-row-list{ background:rgba(5,32,36,0.045); border-radius:18px; margin-top:14px; overflow:hidden; }
  .menu-row{ display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; border-bottom:1px solid rgba(5,32,36,0.07); }
  .menu-row:last-child{ border-bottom:none; }
  .menu-row-icon{ width:32px; height:32px; border-radius:10px; background:rgba(5,32,36,0.06); display:flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto; }
  .menu-row-label{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14.5px; color:var(--ink); flex:1; }
  .menu-row-chevron{ color:rgba(5,32,36,0.25); font-size:14px; }

  .vote-progress{ display:flex; align-items:center; gap:10px; margin:6px 0 16px; font-size:13.5px; font-weight:600; color:rgba(5,32,36,0.6); }
  .vote-progress .bar{flex:1; height:8px; background:rgba(5,32,36,0.1); border-radius:10px; overflow:hidden;}
  .vote-progress .bar > div{height:100%; background:var(--coral); border-radius:10px; transition:width .25s;}

  .onboard{ padding:60px 26px 30px; text-align:center; }
  .onboard .emoji{font-size:52px;}
  .onboard h1{font-size:28px; margin:10px 0 6px;}
  .onboard p{font-size:14.5px; color:rgba(255,247,232,0.7); line-height:1.5; margin-bottom:26px;}
  .onboard-card{ background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); border-radius:20px; padding:20px; text-align:left; }
  .onboard-pick:not(.selected){ opacity:.35; }
  /* Delt "hvilken app"-kort-stil (onboarding-valg + ☰-menu) — ikonet sidder i
     en fast-høj boks øverst i kortet, så ikonerne altid flugter vandret på
     tværs af rækken uanset om et af navnene (fx "Brokkekassen") knækker om
     på to linjer og et andet (fx "MrBrok") ikke gør. */
  .app-pick{ flex:1; cursor:pointer; text-align:center; padding:22px 6px 18px; border-radius:20px; transition:opacity .15s, transform .08s; }
  .app-pick:active{ transform:scale(.96); }
  .app-pick .app-pick-icon{ height:40px; display:flex; align-items:center; justify-content:center; font-size:34px; line-height:1; }
  .app-pick .app-pick-label{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; line-height:1.25; margin-top:8px; letter-spacing:.01em; }
  /* Rækken af app-vælger-kort kan blive bredere end skærmen (fx alle 3 apps
     aktive på en smal skærm) — i stedet for at klippe det sidste kort af
     eller mase kortene sammen til de bliver ulæselige, scroller rækken
     vandret. Selve kortene skal ALDRIG falmes/skjules for at signalere det
     — det gør netop det kort man skal kunne læse og trykke på svært at se.
     I stedet flyder en lille, dæmpet pil-badge ovenpå kanten — kun i den
     retning der RENT FAKTISK er mere at scrolle til (højre-pil når man
     står ved starten, venstre-pil når man har scrollet helt til fx MrBrok,
     ikke bare en fast højre-pil uanset hvor man er). */
  .app-pick-scroll-wrap{ position:relative; }
  .app-pick-row{ display:flex; gap:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .app-pick-row::-webkit-scrollbar{ display:none; }
  .app-pick-row .app-pick{ flex:0 0 auto; min-width:104px; }
  .app-pick-scroll-hint{
    position:absolute; top:50%; transform:translateY(-50%);
    width:18px; height:18px; border-radius:50%;
    background:rgba(120,130,130,0.28); color:rgba(255,255,255,0.75); font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
    pointer-events:none; opacity:0; transition:opacity .2s ease;
  }
  .app-pick-scroll-hint.right{ right:2px; }
  .app-pick-scroll-hint.left{ left:2px; }
  .app-pick-scroll-hint.show{ opacity:1; }
  .onboard-card input{ background:rgba(255,247,232,0.95); }
  .divider{ display:flex; align-items:center; gap:10px; color:rgba(255,247,232,0.4); font-size:12px; margin:22px 0; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:rgba(255,247,232,0.15); }
  /* .divider er designet til mørke baggrunde (.onboard, spilskærme) — cremet
     tekst på cremet baggrund. Men den bruges også inde i .sheet (☰-menuen,
     admin-menuen), som har en LYS baggrund med mørk tekst — der blev
     "afregning"/"kan ikke fortrydes"-overskrifterne næsten usynlige, så
     knapperne fra forskellige sektioner så ud til at flyde sammen uden nogen
     synlig adskillelse. Denne override retter farverne når .divider sidder
     inde i en .sheet. */
  .sheet .divider{ color:rgba(5,32,36,0.4); }
  .sheet .divider::before, .sheet .divider::after{ background:rgba(5,32,36,0.14); }

  /* top var oprindeligt en fast 16px, hvilket overlappede header-titlen.
     At skubbe den NED under header/badge (næste forsøg) løste dét, men
     ramte i stedet ind i selve rundens indhold hver gang en ny runde
     dukkede op mens toasten stadig hang i luften. Rigtige løsning: lad
     den i stedet flyde HELT øverst, foran/over headeren (som en kort
     notifikations-banner) — så den aldrig konkurrerer med rundens tekst
     nedenunder, uanset timing. */
  .toast{ position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%) translateY(-6px) scale(.9); background:linear-gradient(160deg, #0d4b52, var(--ink)); color:var(--cream); padding:13px 20px; border-radius:18px; font-size:14px; font-weight:600; z-index:80; box-shadow:0 10px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,247,232,0.08) inset; opacity:0; transition:opacity .28s ease, transform .28s ease; pointer-events:none; max-width:88vw; text-align:center; line-height:1.4; }
  /* Et lille bounce/pop i stedet for en flad fade — føles mere som en
     fejring når man vinder/taber en runde, i stedet for at bare dukke op. */
  @keyframes toastPop{
    0%{ transform:translateX(-50%) translateY(-10px) scale(.85); }
    55%{ transform:translateX(-50%) translateY(9px) scale(1.06); }
    100%{ transform:translateX(-50%) translateY(6px) scale(1); }
  }

  /* Rolig, ikke-alarmerende banner når nettet mangler — understreger at
     data bare er "sidst kendte" og IKKE væk/nulstillet, i modsætning til
     hvis siden bare stille viste en tom/frisk kasse. */
  .offline-banner{ position:fixed; top:0; left:0; right:0; z-index:90; background:linear-gradient(90deg, var(--coin-dark), var(--coin)); color:var(--ink); font-size:12.5px; font-weight:700; text-align:center; padding:calc(8px + env(safe-area-inset-top)) 16px 8px; transform:translateY(-100%); transition:transform .25s ease; }
  .offline-banner.show{ transform:translateY(0); }
  .toast.show{opacity:1; animation:toastPop .5s cubic-bezier(.34,1.56,.64,1) forwards;}
  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:95; overflow:hidden; }
  .spinner{ width:16px;height:16px;border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; display:inline-block; animation:spin .7s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>
<div class="offline-banner" id="offlineBanner">📡 Ingen forbindelse — viser sidste kendte data</div>
<div class="toast" id="toast"></div>

<script src="gsap.min.js"></script>
<script>
/* ============ CONFIG / IDENTITY ============ */
// Synligt versions-mærke i admin-menuerne, så det altid er utvetydigt om
// en given enhed rent faktisk har hentet den nyeste deployment eller
// stadig viser en cachet version — nyttigt til at fejlsøge PWA/service-
// worker-opdateringsproblemer uden browser-devtools.
const BUILD_TAG = 'build-2026-08-09-91';
// Skal matche api/_lib/gameFlow.js's CASINOBROK_BET_*-konstanter — kun brugt
// til visning her (server afgør altid den reelle udbetaling).
const CASINOBROK_BET_SAFE_POINTS = 1;
const CASINOBROK_BET_WIN_POINTS = 2;
const CASINOBROK_BET_LOSE_POINTS = 1;
const params = new URLSearchParams(location.search);
let roomId = (params.get('r') || localStorage.getItem('bk_lastRoom') || null);
if(roomId) roomId = roomId.toLowerCase();
let profile = JSON.parse(localStorage.getItem('bk_profile_' + roomId) || 'null'); // {memberId, name}

let state = null;
let activeTab = 'feed';
let activeApp = 'kasse'; // 'kasse' | 'spil' | 'mrbrok' — hvilken af de tre "apps" i samme rum der vises
let gameWager = 'fun'; // 'fun' | 'euro' — valgt i Brokspillets lobby, før spillet startes
let gameRounds = 8; // 5 | 8 | 12 — valgt i lobbyen, før spillet startes
let gameSelectedPlayers = null; // memberId[] valgt i lobbyen — sættes til alle medlemmer første gang lobbyen vises
let gameKnownMemberIds = null; // holder styr på hvem der allerede er set, så nytilkomne medlemmer auto-vælges uden at overskrive en bevidst fravalgt
let gameTimerInterval = null;
let gameTimerDeadline = null;
let complaintCountdownInterval = null; // ren visuel nedtælling for en aktiv brok-nedtælling — udløser ALDRIG selv noget, serveren afgør reelt via poll
let lastCelebratedKey = null; // undgår at fyre konfetti/hån-toast flere gange for samme rundes resultat
let lastCountdownRound = null; // undgår at afspille 3-2-1-nedtællingen flere gange for samme runde
let lastAnimatedGameKey = null; // undgår at gen-afspille kortets indgangs-animation ved hvert stille poll-opdatering (så det ikke "flimrer")
let lastComplaintKey = null; // undgår at genstarte brok-nedtællingens visning ved hvert stille poll
let wheelRevealTimeout = null; // se scheduleWheelChanceReveal
let revealAnimationLock = false; // se renderGameScreen — blokerer gen-render mens hjul/mole-afsløring spiller
// Hvilken Chancen-runde (identificeret ved dens phaseStartedAt) DENNE klient
// selv har set afgørelsen (hjul ELLER spillemaskine, se casinobrokHtml's
// chanceVisual) færdig for. "revealed" kunne IKKE bare regnes ud fra
// vægur-tid (Date.now()-phaseStartedAt >= WHEEL_REVEAL_DELAY_MS) — en klient
// der åbner appen/poller EFTER det tidspunkt allerede er passeret (fx var
// væk et øjeblik) fik vist vinderen med det samme (guld-kabinet, glødende
// felt, navn), for derefter at blive nulstillet igen når selve animationen
// startede lokalt (den nulstiller altid opacity/klasser først) — et synligt
// "afslør, nulstil, forfra"-glimt. Nu er "revealed" kun sandt når DENNE
// klients egen animation faktisk er kørt færdig.
let chanceRevealedPhaseKey = null;
let lastAnimatedMrbrokKey = null;
let lastComplaintKeyMrbrok = null; // samme flimmer-fix som lastComplaintKey, men for MrBrok's egen brok-nedtælling

let mrbrokWager = 'fun';
let mrbrokWarmup = 3; // antal rene clue-runder før den første afstemning — se mrbrokMinWarmup for gulvet pr. spillerantal
// Samme formel som api/mrbrok.js's minWarmupForPlayers — server-siden
// håndhæver den uanset hvad klienten sender, men UI'et skal vise det
// rigtige gulv OGSÅ, ellers ser lave taster ud til at virke selvom de i
// praksis bliver løftet af serveren. Se den fils kommentar for hvorfor:
// rolige runder skal udgøre mindst halvdelen af værst-tænkelige spillængde.
function mrbrokMinWarmup(playerCount){
  return Math.max(2, playerCount - 3);
}
let mrbrokSelectedPlayers = null;
let mrbrokInstructionsOpen = null; // null = ikke afgjort endnu denne session — "sådan foregår det" foldes automatisk ud første gang, sammen efterfølgende
let mrbrokRecapOpenRounds = new Set(); // hvilke runder i "Sådan gik det" der har fået vist deres stemme-detaljer
let mrbrokRoleSplashShownFor = null; // m.startedAt for det spil rolle-splashen sidst blev vist til — ét skærmbillede pr. NYT spil, ikke pr. runde
let mrbrokEliminationShownFor = null; // m.startedAt — nulstiller mrbrokEliminationShownCount ved et nyt spil
let mrbrokEliminationShownCount = 0; // hvor mange eliminationer vi allerede har vist en afsløring for
let mrbrokVoteStartSplashShownFor = null; // "m.startedAt:round" — vises ved HVER afstemningsrunde, men kun én gang pr. runde
let gameInstructionsOpen = null; // samme mønster for Brokspillets egen lobby
let mrbrokKnownMemberIds = null;
let mrbrokTipText = null; // client-only "hint til vinkel"-forslag — nulstilles ved ny tur, se mrbrokClueHtml/bindMrbrokHandlers
// Rolle/emne-feltet er SKJULT som standard (kræver et tryk for at se) —
// telefoner ligger tit fremme på bordet under spillet, og et permanent
// synligt "du er X"-felt kunne afsløre rollen/hvem der er MrBrok for en
// forbipasserende, uden at ejeren selv gjorde noget forkert. Nulstilles til
// skjult ved hver ny runde (se mrbrokTopicBanner), så det aldrig "glemmes"
// synligt fra en tidligere tur.
let mrbrokRoleRevealed = false;
let mrbrokRoleRevealedRound = null;

/* ============ PUSH-NOTIFIKATIONER ============ */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushEnabledLocally(){ return localStorage.getItem('bk_push_enabled_' + roomId) === '1'; }
async function enablePush(){
  if(!pushSupported()){ toast('Understøttes ikke her (mangler serviceWorker/PushManager/Notification)'); return false; }
  toast('Nuværende tilladelse: ' + Notification.permission + ' — spørger...');
  await new Promise(r=>setTimeout(r, 1300));
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifikationer blev ikke tilladt (' + perm + ')'); return false; }
    toast('Tilladt! Henter nøgle...');
    const { publicKey } = await api('push');
    if(!publicKey){ toast('Push er ikke sat op på serveren endnu (mangler VAPID-nøgle)'); return false; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){ sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) }); }
    await api('push', { roomId, memberId: profile.memberId, subscription: sub.toJSON() });
    localStorage.setItem('bk_push_enabled_' + roomId, '1');
    toast('🔔 Du får nu besked når nogen brokker sig');
    return true;
  }catch(e){ toast('Fejl: ' + e.message); return false; }
}

// Bot-navne har et emoji-præfiks (fx "🤖 Bot Bo") — emoji uden for BMP er
// et surrogatpar i JS-strenge, så et rå word[0] kun greb HALVDELEN af
// emojiet (en løs surrogat), som browseren tegnede som et ugyldigt tegn
// (så ud som "0B" i stedet for "BB"). Luger derfor ikke-bogstaver
// (emoji/symboler/tal) væk FØR vi splitter i ord.
function initials(name){
  const lettersOnly = (name||'').replace(/[^\p{L}\s]/gu, '').trim();
  const src = lettersOnly || (name||'?').trim();
  return src.split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
}
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString() === now.toDateString()) return 'i dag ' + time;
  return d.toLocaleDateString('da-DK',{day:'2-digit',month:'short'}) + ' ' + time;
}
function dayCount(){
  if(!state || !state.createdAt) return 0;
  return Math.max(1, Math.floor((Date.now() - state.createdAt)/86400000) + 1);
}

/* ============ API ============ */
async function api(path, body){
  let r;
  try{
    // Et svagt/hængende signal fejler ikke altid hurtigt af sig selv — uden
    // en øvre grænse kan et fetch-kald hænge langt længere end brugeren
    // gider vente, i stedet for at vise offline-tilstanden. 8 sek er rigeligt
    // for et normalt svar, men kort nok til at føles responsivt.
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 8000);
    try{
      r = await fetch('/api/' + path, {
        method: body ? 'POST' : 'GET',
        headers: body ? {'Content-Type':'application/json'} : undefined,
        body: body ? JSON.stringify(body) : undefined,
        signal: controller.signal,
      });
    }finally{ clearTimeout(timeoutId); }
  }catch(networkErr){
    // fetch selv fejlede (offline, DNS, timeout...) — adskil det tydeligt
    // fra et rigtigt API-svar som "ukendt brokkekasse", som er noget helt
    // andet. Bruges bl.a. til IKKE at vise "rummet findes ikke længere" når
    // det bare er nettet der mangler.
    const err = new Error('Ingen forbindelse');
    err.isNetworkError = true;
    throw err;
  }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Noget gik galt');
  return data;
}

async function refreshState(silent){
  try{
    const { state: s } = await api('state?room=' + encodeURIComponent(roomId) + '&member=' + encodeURIComponent((profile && profile.memberId) || ''));
    setOfflineBanner(false);
    const json = JSON.stringify(s);
    if(silent && json === lastStateJSON) return; // intet nyt — undgå at afbryde en igangværende scroll unødigt
    lastStateJSON = json;
    state = s;
    const typingTag = document.activeElement && document.activeElement.tagName;
    if(silent && (activeApp === 'spil' || activeApp === 'mrbrok') && (typingTag === 'TEXTAREA' || typingTag === 'INPUT')) return; // undgå at nulstille et svar man er ved at skrive i Brokspillet/MrBrok
    render();
  }catch(e){
    if(e.isNetworkError){
      // Vis den rolige banner i stedet for en fejl-toast — state rører vi
      // slet ikke, så det der allerede står på skærmen (fx 15€ i puljen)
      // bliver stående uændret, i stedet for at se nulstillet ud.
      setOfflineBanner(true);
      return;
    }
    if(!silent) toast('Kunne ikke hente data: ' + e.message);
  }
}

  if(!roomId){

    return;
  }

async function enterRoom(){
  localStorage.setItem('bk_lastRoom', roomId);
  app.innerHTML = `<div class="onboard"><div class="spinner" style="width:28px;height:28px;border-width:3px;margin-top:100px;"></div></div>`;
  try{
    const { state: s } = await api('state?room=' + encodeURIComponent(roomId) + '&member=' + encodeURIComponent((profile && profile.memberId) || ''));
    state = s;
  }catch(e){
    if(e.isNetworkError){
      // VIGTIGT: dette er IKKE "rummet findes ikke" — det er bare ingen
      // forbindelse lige nu. At vise "opret et nyt rum" her ville se ud som
      // om alt (fx puljen) var væk, selvom data stadig ligger urørt på
      // serveren og bare ikke kan hentes lige nu.
      renderOfflineRetry();
      return;
    }
    renderCreateOrJoin('Den brokkekasse findes ikke længere. Opret en ny, eller tjek linket.');
    return;
  }
  if(!profile || !state.members.find(m=>m.id===profile.memberId)){
    renderWhoAmI();
    return;
  }
  if(!state.kasseEnabled && state.gameEnabled) activeApp = 'spil';
  else if(!state.kasseEnabled && !state.gameEnabled && state.mrbrokEnabled) activeApp = 'mrbrok';
  else if(!state.kasseEnabled && !state.gameEnabled && !state.mrbrokEnabled && state.complainerEnabled) activeApp = 'complainer';
  else if(state.kasseEnabled) activeApp = 'kasse';
  rememberRoom();
  render();
  startPolling();
}

  roomId = null; profile = null; state = null;
  const u = new URL(location.href); u.search = '';
  history.replaceState(null,'',u.toString());

  renderCreateOrJoin();

// Viser kun den venstre/højre pil-badge i den retning der RENT FAKTISK er
// mere at scrolle til lige nu (opdateres løbende på scroll — så pilen til
// højre forsvinder og pilen til venstre dukker op når man har scrollet
// helt hen til fx MrBrok, i stedet for en fast pil der peger forkert).
// Scroller også den AKTIVE app (hvis der er en) ind i syne først.
function updateAppPickHints(row){
  const wrap = row.closest('.app-pick-scroll-wrap');
  if(!wrap) return;
  const canScrollLeft = row.scrollLeft > 1;
  const canScrollRight = row.scrollLeft < row.scrollWidth - row.clientWidth - 1;
  const left = wrap.querySelector('.app-pick-scroll-hint.left');
  const right = wrap.querySelector('.app-pick-scroll-hint.right');
  if(left) left.classList.toggle('show', canScrollLeft);
  if(right) right.classList.toggle('show', canScrollRight);
}
function markAppPickScrollable(){
  document.querySelectorAll('.app-pick-row').forEach(row=>{
    const active = row.querySelector(`[data-goto-app="${activeApp}"]`);
    if(active) active.scrollIntoView({ block:'nearest', inline:'center' });
    updateAppPickHints(row);
    row.onscroll = () => updateAppPickHints(row);
  });
}

// Kasse-motor-generalisering, Fase 4: erstatter den tidligere hardcodede
// activeApp==='spil'?'Brokspillet':...-ternary (fundet i UI-audit-bilaget,
// index.html:1688 dengang) — læser tema-afhængige spilnavne fra
// state.gameNames (sat server-side af redactStateFor, se _lib/store.js's
// getGameNames). Faldback til de oprindelige brok-navne hvis en ældre,
// cachet state-version (fra før dette felt fandtes) skulle mangle det.
function activeAppDisplayName(){
  const names = (state && state.gameNames) || {};
  if(activeApp==='spil') return names.spil || 'Brokspillet';
  if(activeApp==='mrbrok') return names.mrbrok || 'MrBrok';
  if(activeApp==='complainer') return names.complainer || 'Det Store Brokkeri';
  return (state && state.themeName) || 'Brokkekassen';
}

          <div class="onboard-pick app-pick${i===0?' selected':''}" data-base-id="${skin.id}" style="background:var(--sea); color:#fff;">

      <button class="sheet-btn primary" id="customNextBtn" style="margin-top:14px;">Videre</button>
    </div>
  `;
  document.getElementById('backToStep1Btn').onclick = renderCreateFlowStep1;
  document.querySelectorAll('#customBaseRow .onboard-pick').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('#customBaseRow .onboard-pick').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
    };
  });
  document.getElementById('customNextBtn').onclick = ()=>{
    const name = document.getElementById('customNameInput').value.trim();
    const about = document.getElementById('customAboutInput').value.trim();
    if(!name){ toast('Giv jeres kasse et navn'); return; }
    if(!about){ toast('Skriv kort hvad den handler om'); return; }
    const baseEl = document.querySelector('#customBaseRow .onboard-pick.selected');
    const base = SKIN_PRESETS.find(s => s.id === (baseEl && baseEl.dataset.baseId)) || SKIN_PRESETS[0];
    // "Med småt"-skabelonen er FÆLLES på tværs af alle skins (se planens
    // "Konkret 'med småt'-tekst pr. skin"-afsnit): "{differentiator},
    // {bekræftelsesmodel}" — her sammensat dynamisk i stedet for slået op
    // i en tabel, da et frit navn ingen har skrevet før ikke findes der.
    const aboutCapitalized = about.charAt(0).toUpperCase() + about.slice(1);
    const customSkin = {
      id: base.id, name, emoji: base.emoji,
      ruleTagline: `${aboutCapitalized}, og det tæller i ${name.toLowerCase()}s pulje.`, unit: base.unit,
      poolPolarity: base.poolPolarity, confirmationModel: base.confirmationModel, dailyRhythm: base.dailyRhythm,
      smaatText: `${aboutCapitalized}, bekræftet af alle`,
      gameNames: base.gameNames, allowedGames: base.allowedGames,

    renderCreateFlowStep2(customSkin);

            <div class="app-pick-icon">👉</div>
            <div class="app-pick-label">${escapeHtml(skin.gameNames.spil)}</div>

  document.getElementById('changeSkinBtn').onclick = renderCreateFlowStep1;
  document.querySelectorAll('.onboard-pick[data-pick]').forEach(el=>{
    el.onclick = ()=>{
      const willSelect = !el.classList.contains('selected');
      if(!willSelect){
        const otherSelected = document.querySelectorAll('.onboard-pick[data-pick].selected').length > 1;
        if(!otherSelected) return; // mindst én skal altid være valgt
      }
      el.classList.toggle('selected');
    };
  });
  ['rhythmPickRow','accessPickRow'].forEach(id=>{
    document.querySelectorAll(`#${id} .onboard-pick`).forEach(el=>{
      el.onclick = ()=>{
        document.querySelectorAll(`#${id} .onboard-pick`).forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
      };
    });
  });
  // Kasse-motor-generalisering, Dommer-reglen "host-approval udelukker
  // MrBrok" (se _lib/themeRegistry.js's checkRegistry — samme regel gjaldt
  // kun de KURATEREDE skins før dette, men brugeren kan her frit vælge "Én
  // bestemmer" uanset base, så reglen skal håndhæves HER også, ikke kun i
  // Dommeren). "Kan den ikke, er den ikke available" — MrBrok-flisen
  // skjules og fravælges, den vises ikke bare deaktiveret.
  function applyHostApprovalGameRestriction(){
    const isHostApproval = document.querySelector('#confirmationPickRow [data-confirmation-model="host-approval"]').classList.contains('selected');
    const mrbrokTile = document.querySelector('#gamePickRow [data-pick="mrbrok"]');
    if(!mrbrokTile) return;
    mrbrokTile.style.display = isHostApproval ? 'none' : '';
    if(isHostApproval) mrbrokTile.classList.remove('selected');
    else mrbrokTile.classList.add('selected');
  }
  document.querySelectorAll('#confirmationPickRow .onboard-pick').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('#confirmationPickRow .onboard-pick').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
      applyHostApprovalGameRestriction();
    };
  });
  applyHostApprovalGameRestriction();
  document.getElementById('createBtn').onclick = async ()=>{
    const btn = document.getElementById('createBtn');
    btn.innerHTML = '<span class="spinner"></span>';
    try{
      // Kasse-motor-generalisering: et spil der ikke er i skin.allowedGames
      // findes slet ikke som fliser her (se markup ovenfor) — "kan den
      // ikke, er den ikke available", ikke bare skjult/deaktiveret.
      const pick = name => { const el = document.querySelector(`#gamePickRow [data-pick="${name}"]`); return !!el && el.classList.contains('selected'); };
      const kasseEnabled = pick('kasse');
      const gameEnabled = pick('spil');
      const mrbrokEnabled = pick('mrbrok');
      const complainerEnabled = pick('complainer');
      const selectedConfirmationEl = document.querySelector('#confirmationPickRow .onboard-pick.selected');
      const confirmationModel = (selectedConfirmationEl && selectedConfirmationEl.dataset.confirmationModel) || skin.confirmationModel;
      const selectedRhythmEl = document.querySelector('#rhythmPickRow .onboard-pick.selected');
      const dailyRhythm = selectedRhythmEl ? selectedRhythmEl.dataset.dailyRhythm === '1' : skin.dailyRhythm;
      const selectedAccessEl = document.querySelector('#accessPickRow .onboard-pick.selected');
      const accessModel = (selectedAccessEl && selectedAccessEl.dataset.accessModel) || 'open';
      const r = await api('room', {
        kasseEnabled, gameEnabled, mrbrokEnabled, complainerEnabled,
        themeId: skin.id, themeName: skin.name, ruleTagline: skin.ruleTagline,
        unit: skin.unit, poolPolarity: skin.poolPolarity,
        confirmationModel, dailyRhythm, accessModel,
      });
      roomId = r.roomId;
      const u = new URL(location.href); u.search = '?r=' + roomId;
      history.replaceState(null,'',u.toString());
      localStorage.setItem('bk_lastRoom', roomId);
      state = r.state;
      renderWhoAmI(true);
    }catch(e){ toast('Kunne ikke oprette: ' + e.message); btn.textContent = 'Opret nyt rum'; }
  };
}

    const btn = document.getElementById('joinRoomBtn');
    btn.innerHTML = '<span class="spinner"></span>';
    try{
      const { state: s } = await api('state?room=' + encodeURIComponent(rid));
      roomId = rid;
